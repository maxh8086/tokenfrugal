<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:13px;fill:#1f2937}.t{font-size:15px;font-weight:600}.s{font-size:11px;fill:#4b5563}.b{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}.g{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}.o{fill:#fff7ed;stroke:#f59e0b;stroke-width:1.5}.l{stroke:#6b7280;stroke-width:1.5;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="28" class="t">TokenFrugal - Low-Level Design: modules</text>
<rect x="300" y="50" width="300" height="130" rx="8" class="o"/><text x="450" y="72" text-anchor="middle" class="t">server.py</text>
<text x="312" y="95" class="s">tools: dispatch_task, ask_followup, resume_task,</text><text x="312" y="110" class="s">get_detail, list_roles, plan_add/overview/revert/update_from</text><text x="312" y="130" class="s">_execute(tid, agent, role, prompt, messages, plan_id)</text><text x="312" y="145" class="s">_plan(fn) safe wrapper, _warm_up(), _lifespan()</text><text x="312" y="160" class="s">_ClientSeen middleware -> events.emit("client")</text>
<rect x="30" y="230" width="200" height="110" rx="8" class="b"/><text x="130" y="252" text-anchor="middle" class="t">config.py</text><text x="42" y="274" class="s">load_personas()  resolve_role()</text><text x="42" y="290" class="s">OLLAMA_URL, WORKSPACE, DB_PATH</text><text x="42" y="306" class="s">NATIVE_SERVERS, COMPOSE_FILE</text><text x="42" y="322" class="s">personas.yaml: 282 slugs -> 11 roles</text>
<rect x="260" y="230" width="200" height="110" rx="8" class="b"/><text x="360" y="252" text-anchor="middle" class="t">loop.py</text><text x="272" y="274" class="s">run(agent, role, prompt, msgs, tid)</text><text x="272" y="290" class="s">slop_check()  parse_text_calls()</text><text x="272" y="306" class="s">leaf()  LoopError  TOOL_CAP=8000</text><text x="272" y="322" class="s">max 2 tool calls per step</text>
<rect x="490" y="230" width="190" height="110" rx="8" class="b"/><text x="585" y="252" text-anchor="middle" class="t">mcp_client.py</text><text x="502" y="274" class="s">open_role -> Router(sessions)</text><text x="502" y="290" class="s">open_profile (docker mcp gateway)</text><text x="502" y="306" class="s">open_native (codebase, plan, ...)</text><text x="502" y="322" class="s">to_openai_tools()  result_text()</text>
<rect x="710" y="230" width="170" height="110" rx="8" class="b"/><text x="795" y="252" text-anchor="middle" class="t">compose.py</text><text x="722" y="274" class="s">backends() ctx manager</text><text x="722" y="290" class="s">ensure()  stop_all_sync()</text><text x="722" y="306" class="s">register()/release() pid files</text><text x="722" y="322" class="s">last gateway out stops all</text>
<rect x="30" y="390" width="170" height="100" rx="8" class="g"/><text x="115" y="412" text-anchor="middle" class="t">store.py</text><text x="42" y="434" class="s">SQLite tasks table</text><text x="42" y="450" class="s">create / update / get</text><text x="42" y="466" class="s">messages JSON for resume</text>
<rect x="225" y="390" width="190" height="100" rx="8" class="g"/><text x="320" y="412" text-anchor="middle" class="t">summarize.py</text><text x="237" y="434" class="s">summarize(model, text, task)</text><text x="237" y="450" class="s">hard_trim()  tokens()</text><text x="237" y="466" class="s">150-300 token cap</text>
<rect x="440" y="390" width="220" height="100" rx="8" class="g"/><text x="550" y="412" text-anchor="middle" class="t">plan.py / plan_mcp.py</text><text x="452" y="434" class="s">Neo4j: add, claim, done, revert,</text><text x="452" y="450" class="s">rollback, update_from, prune,</text><text x="452" y="466" class="s">checkpoint, check_evidence</text>
<rect x="685" y="390" width="195" height="100" rx="8" class="g"/><text x="782" y="412" text-anchor="middle" class="t">events / ui_launcher</text><text x="697" y="434" class="s">emit() -> events.jsonl</text><text x="697" y="450" class="s">write_roles() -> roles.json</text><text x="697" y="466" class="s">start()/stop() Node UI :7777</text>
<path class="l" d="M380 180L370 230"/><path class="l" d="M310 160L190 230"/><path class="l" d="M450 180L585 230"/><path class="l" d="M580 160L795 230"/>
<path class="l" d="M330 180L120 390"/><path class="l" d="M400 180L330 390"/><path class="l" d="M520 180L550 390"/><path class="l" d="M590 175L760 390"/>
<text x="20" y="530" class="s">Arrows show "calls / depends on". server.py orchestrates; loop.py drives the model; mcp_client.py reaches tools; compose.py owns container lifecycle.</text>
</svg>
