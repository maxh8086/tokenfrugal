<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:13px;fill:#1f2937}.t{font-size:17px;font-weight:600}.s{font-size:11px;fill:#4b5563}.b{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}.g{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}.o{fill:#fff7ed;stroke:#f59e0b;stroke-width:1.5}.p{fill:#fdf2f8;stroke:#ec4899;stroke-width:1.5}.l{stroke:#6b7280;stroke-width:1.5;fill:none;marker-end:url(#a)}.d{stroke-dasharray:5 4}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="28" class="t">TokenFrugal - High-Level Design</text>
<rect x="30" y="60" width="170" height="70" rx="8" class="b"/><text x="115" y="90" text-anchor="middle">Cloud agent</text><text x="115" y="108" text-anchor="middle" class="s">Claude / Codex (planner)</text>
<rect x="270" y="50" width="330" height="270" rx="8" class="o"/><text x="435" y="72" text-anchor="middle" class="t">tokenfrugal gateway (FastMCP, stdio)</text>
<rect x="290" y="90" width="140" height="48" rx="8" class="b"/><text x="360" y="119" text-anchor="middle">MCP tools (server.py)</text>
<rect x="445" y="90" width="140" height="48" rx="8" class="b"/><text x="515" y="119" text-anchor="middle">Role router (config)</text>
<rect x="290" y="155" width="140" height="48" rx="8" class="b"/><text x="360" y="184" text-anchor="middle">Agent loop (loop.py)</text>
<rect x="445" y="155" width="140" height="48" rx="8" class="b"/><text x="515" y="184" text-anchor="middle">Summarizer (150-300)</text>
<rect x="290" y="220" width="140" height="48" rx="8" class="b"/><text x="360" y="249" text-anchor="middle">Task store (SQLite)</text>
<rect x="445" y="220" width="140" height="48" rx="8" class="b"/><text x="515" y="249" text-anchor="middle">Plan store client</text>
<rect x="290" y="282" width="295" height="28" rx="8" class="b"/><text x="437" y="301" text-anchor="middle">compose.py lifecycle + events.py + ui_launcher.py</text>
<rect x="700" y="60" width="170" height="70" rx="8" class="g"/><text x="785" y="90" text-anchor="middle">Local LLMs</text><text x="785" y="108" text-anchor="middle" class="s">builder qwen2.5-coder / thinker llama3.2</text>
<rect x="700" y="170" width="170" height="90" rx="8" class="g"/><text x="785" y="198" text-anchor="middle">Docker MCP profiles</text><text x="785" y="216" text-anchor="middle" class="s">build, debug, analyze, browser,</text><text x="785" y="231" text-anchor="middle" class="s">design, docs, security, build-data</text><text x="785" y="248" text-anchor="middle" class="s">(4-6 allowlisted tools/role)</text>
<rect x="30" y="380" width="200" height="90" rx="8" class="p"/><text x="130" y="408" text-anchor="middle">docker-compose (ts-mcp)</text><text x="130" y="426" text-anchor="middle" class="s">crawl4ai, searxng, sonarqube,</text><text x="130" y="441" text-anchor="middle" class="s">penpot-mcp (started on demand)</text>
<rect x="270" y="380" width="160" height="90" rx="8" class="p"/><text x="350" y="418" text-anchor="middle">Neo4j plan graph</text><text x="350" y="436" text-anchor="middle" class="s">tasks, deps, retention</text>
<rect x="470" y="380" width="170" height="90" rx="8" class="g"/><text x="555" y="418" text-anchor="middle">Workspace files</text><text x="555" y="436" text-anchor="middle" class="s">mounted at /workspace</text>
<rect x="680" y="380" width="190" height="90" rx="8" class="o"/><text x="775" y="408" text-anchor="middle">Live dashboard :7777</text><text x="775" y="426" text-anchor="middle" class="s">Node ui/server.js reads</text><text x="775" y="441" text-anchor="middle" class="s">events.jsonl + roles.json</text>
<path class="l" d="M200 95H270"/><text x="235" y="87" text-anchor="middle" class="s">dispatch_task</text>
<path class="l" d="M600 95H700"/><path class="l" d="M600 190H700"/>
