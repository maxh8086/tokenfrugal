<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif" fill="#1f2933">
  <title id="t">media-motion: workflow</title>
  <desc id="d">Narrated motion-graphics film, 30 to 120 s, from a text brief.</desc>
  <defs>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="bold">media-motion</text>
  <text x="30" y="66" font-size="13" fill="#475569">Model: Local Thinker (prism-bonsai-4b) | Profile: media-generator | Max steps: 8 | Timeout: 900 s</text>
  <!-- flow row -->
  <rect x="22" y="110" width="136" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="90" y="133" font-size="12" text-anchor="middle">
  <tspan x="90" dy="0">Input: brief text,</tspan>
  <tspan x="90" dy="16">length_target_s</tspan>
  <tspan x="90" dy="16">music flag, out_name</tspan>
</text>
  <rect x="186" y="110" width="136" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="254" y="133" font-size="12" text-anchor="middle">
  <tspan x="254" dy="0">1 Take brief,</tspan>
  <tspan x="254" dy="16">out_name and length</tspan>
  <tspan x="254" dy="16">(30-120 s)</tspan>
</text>
  <rect x="350" y="110" width="136" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="418" y="133" font-size="12" text-anchor="middle">
  <tspan x="418" dy="0">2 brief once with</tspan>
  <tspan x="418" dy="16">text, out_name,</tspan>
  <tspan x="418" dy="16">length (default 30 s)</tspan>
</text>
  <rect x="514" y="110" width="136" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="582" y="133" font-size="12" text-anchor="middle">
  <tspan x="582" dy="0">3 If brief returns an</tspan>
  <tspan x="582" dy="16">error line, report it</tspan>
  <tspan x="582" dy="16">verbatim</tspan>
</text>
  <rect x="678" y="110" width="136" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="746" y="133" font-size="12" text-anchor="middle">
  <tspan x="746" dy="0">4 Retry once at most,</tspan>
  <tspan x="746" dy="16">then report Render</tspan>
  <tspan x="746" dy="16">file name and exit line</tspan>
</text>
  <rect x="842" y="110" width="136" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="910" y="133" font-size="12" text-anchor="middle">
  <tspan x="910" dy="0">Output: Render file</tspan>
  <tspan x="910" dy="16">name and brief</tspan>
  <tspan x="910" dy="16">exit line</tspan>
</text>
  <line x1="160" y1="145" x2="184" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="324" y1="145" x2="348" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="488" y1="145" x2="512" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="652" y1="145" x2="676" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="816" y1="145" x2="840" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="30" y="220" font-size="13" font-weight="bold">Tools:</text>
  <rect x="90.0" y="204" width="52.0" height="24" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="116.0" y="220" font-family="Consolas, monospace" font-size="12" text-anchor="middle">brief</text>
  <rect x="150.0" y="204" width="80.8" height="24" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="190.4" y="220" font-family="Consolas, monospace" font-size="12" text-anchor="middle">read_file</text>
  <text x="30" y="270" font-size="12" fill="#7c2d12">Blocked: brief returns "error: not built yet" for a valid brief. The role cannot finish until media-briefing is built.</text>
  <text x="30" y="292" font-size="12" fill="#475569">Native server: media-briefing (router/media_briefing_mcp.py). Stop: Render path returned, or 8 steps used.</text>
  <rect x="30" y="300" width="940" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="330" font-size="15" font-weight="bold">Checks before the task is done</text>
  <text x="50" y="358" font-size="13"><tspan fill="#15803d" font-weight="bold">[auto]</tspan><tspan dx="6">brief returned the Render path with no error.</tspan></text>
  <text x="50" y="384" font-size="13"><tspan fill="#92400e" font-weight="bold">[review]</tspan><tspan dx="6">Only the options the task asked for were passed.</tspan></text>
  <text x="50" y="410" font-size="13"><tspan fill="#92400e" font-weight="bold">[review]</tspan><tspan dx="6">Narration fits about 3 words per second of length (90 words at 30 s, 360 at 120 s).</tspan></text>
  <text x="30" y="590" font-size="11" fill="#64748b">Source: router/tf-roles.yaml; router/skills/role-media-motion/SKILL.md</text>
  <text x="970" y="610" font-size="11" fill="#64748b" text-anchor="end">Diagram: media-motion, hand-drawn from the role's config and skill file.</text>
</svg>
