  <rect x="334.8" y="204" width="80.8" height="24" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="375.2" y="220" font-family="Consolas, monospace" font-size="12" text-anchor="middle">read_file</text>
  <text x="30" y="270" font-size="12" fill="#7c2d12">Fallback: download fails: yt-dlp -U, retry once, else ask user to add file to video-editor/References/. Never cookies, PO tokens, proxies.</text>
  <rect x="30" y="300" width="940" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="330" font-size="15" font-weight="bold">Checks before the task is done</text>
  <text x="50" y="358" font-size="13"><tspan fill="#15803d" font-weight="bold">[auto]</tspan><tspan dx="6">The clip exists in list_raw.</tspan></text>
  <text x="50" y="384" font-size="13"><tspan fill="#15803d" font-weight="bold">[auto]</tspan><tspan dx="6">mgen returned the Render path with no error.</tspan></text>
  <text x="50" y="410" font-size="13"><tspan fill="#15803d" font-weight="bold">[auto]</tspan><tspan dx="6">The output file is listed in list_renders.</tspan></text>
  <text x="50" y="436" font-size="13"><tspan fill="#92400e" font-weight="bold">[review]</tspan><tspan dx="6">Only the options the task asked for were passed, and no Raw clip changed.</tspan></text>
