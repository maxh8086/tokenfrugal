<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif" fill="#1f2933">
  <title id="t">media-generator: workflow</title>
  <desc id="d">Turns one raw talking clip in Raw into a captioned 9:16 short (Mode A). Mode B (text brief to film) is not built.</desc>
  <defs>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="bold">media-generator</text>
  <text x="30" y="66" font-size="13" fill="#475569">Model: Local Thinker (prism-bonsai-4b) | Profile: media-generator | Max steps: 8 | Timeout: 900 s</text>
  <!-- flow row -->
  <rect x="22" y="110" width="136" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="90" y="133" font-size="12" text-anchor="middle">
  <tspan x="90" dy="0">Input: clip name</tspan>
  <tspan x="90" dy="16">in Raw, no_music</tspan>
  <tspan x="90" dy="16">flag, output name</tspan>
</text>
  <rect x="186" y="110" width="136" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="254" y="133" font-size="12" text-anchor="middle">
  <tspan x="254" dy="0">1 list_raw: clip</tspan>
  <tspan x="254" dy="16">must be listed,</tspan>
  <tspan x="254" dy="16">or stop</tspan>
</text>
  <rect x="350" y="110" width="136" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="418" y="133" font-size="12" text-anchor="middle">
  <tspan x="418" dy="0">2 mgen once,</tspan>
  <tspan x="418" dy="16">captions auto</tspan>
  <tspan x="418" dy="16">(options if asked)</tspan>
</text>
  <rect x="514" y="110" width="136" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="582" y="133" font-size="12" text-anchor="middle">
  <tspan x="582" dy="0">3 list_renders:</tspan>
  <tspan x="582" dy="16">output must</tspan>
  <tspan x="582" dy="16">appear</tspan>
</text>
  <rect x="678" y="110" width="136" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="746" y="133" font-size="12" text-anchor="middle">
  <tspan x="746" dy="0">4 Report Render</tspan>
  <tspan x="746" dy="16">file name and mgen</tspan>
  <tspan x="746" dy="16">exit line</tspan>
</text>
  <rect x="842" y="110" width="136" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="910" y="133" font-size="12" text-anchor="middle">
  <tspan x="910" dy="0">Output: Render</tspan>
  <tspan x="910" dy="16">file name and</tspan>
  <tspan x="910" dy="16">mgen exit line</tspan>
</text>
  <line x1="160" y1="145" x2="184" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="324" y1="145" x2="348" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="488" y1="145" x2="512" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="652" y1="145" x2="676" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="816" y1="145" x2="840" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="30" y="220" font-size="13" font-weight="bold">Tools:</text>
  <rect x="90.0" y="204" width="73.6" height="24" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="126.8" y="220" font-family="Consolas, monospace" font-size="12" text-anchor="middle">list_raw</text>
  <rect x="171.6" y="204" width="102.4" height="24" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="222.8" y="220" font-family="Consolas, monospace" font-size="12" text-anchor="middle">list_renders</text>
