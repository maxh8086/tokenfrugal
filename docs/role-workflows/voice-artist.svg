<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif" fill="#1f2933">
  <title id="t">voice-artist: workflow</title>
  <desc id="d">Returns voice settings (engine, voice id, speed, reference clip, consent note) for a named profile. Reads only.</desc>
  <defs>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="bold">voice-artist</text>
  <text x="30" y="66" font-size="13" fill="#475569">Model: Local Thinker (prism-bonsai-4b) | Profile: media-generator | Max steps: 4 | Timeout: 300 s</text>
  <!-- flow row -->
  <rect x="22" y="110" width="136" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="90" y="141" font-size="12" text-anchor="middle">
  <tspan x="90" dy="0">Input: voice name,</tspan>
  <tspan x="90" dy="16">optional section</tspan>
</text>
  <rect x="186" y="110" width="136" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="254" y="133" font-size="12" text-anchor="middle">
  <tspan x="254" dy="0">1 Pick</tspan>
  <tspan x="254" dy="16">docs/designs/</tspan>
  <tspan x="254" dy="16">voice-artist-name.md</tspan>
</text>
  <rect x="350" y="110" width="136" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="418" y="149" font-size="12" text-anchor="middle">
  <tspan x="418" dy="0">2 read_file once</tspan>
</text>
  <rect x="514" y="110" width="136" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="582" y="141" font-size="12" text-anchor="middle">
  <tspan x="582" dy="0">3 Return the</tspan>
  <tspan x="582" dy="16">voice settings</tspan>
</text>
  <rect x="678" y="110" width="136" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="746" y="133" font-size="12" text-anchor="middle">
  <tspan x="746" dy="0">4 Consent note</tspan>
  <tspan x="746" dy="16">missing for a real-</tspan>
  <tspan x="746" dy="16">person clip: report</tspan>
</text>
  <rect x="842" y="110" width="136" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="910" y="133" font-size="12" text-anchor="middle">
  <tspan x="910" dy="0">Output: voice</tspan>
  <tspan x="910" dy="16">settings and one</tspan>
  <tspan x="910" dy="16">line on asked section</tspan>
</text>
  <line x1="160" y1="145" x2="184" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="324" y1="145" x2="348" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="488" y1="145" x2="512" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="652" y1="145" x2="676" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="816" y1="145" x2="840" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="30" y="220" font-size="13" font-weight="bold">Tools:</text>
  <rect x="90.0" y="204" width="80.8" height="24" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="130.4" y="220" font-family="Consolas, monospace" font-size="12" text-anchor="middle">read_file</text>
  <rect x="30" y="300" width="940" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="330" font-size="15" font-weight="bold">Checks before the task is done</text>
  <text x="50" y="358" font-size="13"><tspan fill="#15803d" font-weight="bold">[auto]</tspan><tspan dx="6">read_file was called on docs/designs/voice-artist-&lt;name&gt;.md or voice-artist-profile.md.</tspan></text>
  <text x="50" y="384" font-size="13"><tspan fill="#92400e" font-weight="bold">[review]</tspan><tspan dx="6">The settings appear in the profile file.</tspan></text>
  <text x="50" y="410" font-size="13"><tspan fill="#92400e" font-weight="bold">[review]</tspan><tspan dx="6">A reference clip of a real person has a consent note; if missing, say so.</tspan></text>
  <text x="50" y="436" font-size="13"><tspan fill="#92400e" font-weight="bold">[review]</tspan><tspan dx="6">No setting invented; a missing file is reported with the path tried.</tspan></text>
  <text x="30" y="590" font-size="11" fill="#64748b">Source: router/tf-roles.yaml; router/skills/role-voice-artist/SKILL.md</text>
  <text x="970" y="610" font-size="11" fill="#64748b" text-anchor="end">Diagram: voice-artist, hand-drawn from the role's config and skill file.</text>
</svg>
