# PrismML llama.cpp server for Ternary-Bonsai GGUFs, part of the ts-mcp project.
# Use with the base file, same project name:
#   docker compose -p ts-mcp -f docker-compose.yml -f docker/prism-llama/compose.yml --profile bench up -d prism-llama
# Select the model with PRISM_MODEL (file name inside PRISM_MODELS_DIR). Loopback only, port 8282.
name: ts-mcp

services:
  prism-llama:
    image: maxh8086/prism-llama:e8fd209
    profiles: [bench]
    command: ["-m", "/models/${PRISM_MODEL:-Ternary-Bonsai-8B-Q2_0_g64.gguf}", "--alias", "ternary-bonsai", "-c", "16384", "-np", "1", "-ngl", "99", "--host", "0.0.0.0", "--port", "8080"]
    volumes: ["${PRISM_MODELS_DIR:-C:/Users/vaibh/Downloads/Projects/prism-models}:/models:ro"]
    ports: ["127.0.0.1:8282:8080"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: "no"
