# ComfyUI model folders. /models is the read-only mount of models/video_generation on the host.
# ComfyUI also lists the other files in that folder, not only the ones named here.
tokenfrugal:
  base_path: /models
  checkpoints: ltx-video-2b-distilled/
  text_encoders: ltx-video-2b-distilled/
  clip: ltx-video-2b-distilled/

# Image models (Mage-Flow). /image_models is the read-only mount of models/image_generation/comfy-t2i on the host.
mage_flow:
  base_path: /image_models
  diffusion_models: diffusion_models/
  text_encoders: text_encoders/
  vae: vae/