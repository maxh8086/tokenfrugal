<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <title>Kinetic typography (HyperFrames)</title>
  <style>
    html, body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0d1117;
    }
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #0d1117;
      overflow: hidden;
    }
    #bar {
      position: absolute;
      left: 160px;
      top: 300px;
      width: 1600px;
      height: 12px;
      background: #2f81f7;
      transform-origin: left center;
    }
    #title {
      position: absolute;
      left: 160px;
      top: 380px;
      width: 1600px;
      font-family: "DejaVu Sans", sans-serif;
      font-weight: 700;
      font-size: 120px;
      line-height: 1.1;
      color: #e6edf3;
    }
    #title .word {
      display: inline-block;
      margin-right: 0.25em;
    }
    #subtitle {
      position: absolute;
      left: 160px;
      top: 700px;
      width: 1600px;
      font-family: "DejaVu Sans", sans-serif;
      font-weight: 400;
      font-size: 56px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
    <div id="bar"></div>
    <div id="title"></div>
    <div id="subtitle"></div>
  </div>

  <!-- props.js is written per job by server.js (window.PROPS). The defaults below are used when opened directly. -->
  <script src="props.js"></script>
  <script src="gsap.min.js"></script>
  <script>
    (function () {
      var p = window.PROPS || {};
      var root = document.getElementById('root');
      var bar = document.getElementById('bar');
      var title = document.getElementById('title');
      var subtitle = document.getElementById('subtitle');

      root.style.background = p.background || '#0d1117';
      bar.style.background = p.accent || '#2f81f7';
      title.style.color = p.textColor || '#e6edf3';
      subtitle.style.color = p.subColor || '#8b949e';

      // Text is set with textContent, never innerHTML, so props cannot inject markup.
      var words = String(p.title || 'Hello from HyperFrames').split(/\s+/);
      words.forEach(function (w) {
        var span = document.createElement('span');
        span.className = 'word';
        span.textContent = w;
        title.appendChild(span);
      });
      subtitle.textContent = p.subtitle || '';

      // Total length from props (default 3 s). The entrance animation always takes
      // the first 3 s; the rest is a slow push-in, then a fade-out at the end.
      var D = Number(p.duration) || 3;
      root.setAttribute('data-duration', String(D));

      // Deterministic timeline: paused, seeked by the renderer.
      var tl = gsap.timeline({ paused: true });
      tl.from('#bar', { scaleX: 0, duration: 0.8, ease: 'power3.out' }, 0)
        .from('#title .word', {
          opacity: 0, y: 60, scale: 0.85, duration: 0.6,
          ease: 'back.out(1.6)', stagger: 0.12
        }, 0.3)
        .from('#subtitle', { opacity: 0, y: 24, duration: 0.6, ease: 'power2.out' }, 1.2)
        .to('#root', { scale: 1.04, duration: D, ease: 'none', transformOrigin: '50% 50%' }, 0)
        .to('#root', { opacity: 0, duration: 0.4, ease: 'power1.in' }, D - 0.4);

      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
    })();
  </script>
</body>
</html>
