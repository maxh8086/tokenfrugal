# SearXNG for the research role: local metasearch, JSON API only used by mcp-crawl4ai (web_search).
use_default_settings: true
general:
  instance_name: ts-searxng
  enable_metrics: false
search:
  safe_search: 0
  formats: [html, json]
server:
  limiter: false
  image_proxy: false
  # secret_key comes from SEARXNG_SECRET (mcp.env)
