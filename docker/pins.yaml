# Upstream sources built locally at an exact commit. Used by scripts/pinned_build.py.
# tag_regex (3 capture groups = major.minor.patch) selects release tags for scripts/check_pins.py; sha must be the full 40-char commit; dockerfile is the TokenFrugal Dockerfile used with the clone as build context.
pins:
  chrome-devtools-mcp:
    repo: https://github.com/ChromeDevTools/chrome-devtools-mcp.git
    tag_regex: '^chrome-devtools-mcp-v(\d+)\.(\d+)\.(\d+)$'
    sha: e52c6b59b476c5e04d8dd9fd4bd017ba3b3d65df   # tag chrome-devtools-mcp-v1.10.1
    image: maxh8086/chrome-devtools-mcp:1
    dockerfile: docker/chrome-devtools-mcp/Dockerfile
  penpot-mcp:
    repo: https://github.com/penpot/penpot.git
    tag_regex: '^(\d+)\.(\d+)\.(\d+)$'
    sha: d49fa51fefc2faaafa69bd46ec273ba48d682731   # tag 2.15.4
    image: tokenfrugal/penpot-mcp:1
    dockerfile: docker/penpot-mcp/Dockerfile
  # Content-analyst sources. Dockerfiles fetch the upstream source themselves and verify the sha, so the build
  # context is the folder (context: folder), not the clone. tag_regex '^$' = no release tag matches the pinned
  # commit (check_pins skips these); see each SOURCE.md.
  qdrant-mcp:
    repo: https://github.com/qdrant/mcp-server-qdrant.git
    tag_regex: '^$'
    sha: c56ae5adf62bb78d852bf7bbcbc5d7b75e2bbe41   # untagged; package 0.8.1
    image: tokenfrugal/qdrant-mcp:1
    dockerfile: docker/qdrant-mcp/Dockerfile
    context: folder
    licence: Apache-2.0
    base_image: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
  postgres-mcp:
    repo: https://github.com/crystaldba/postgres-mcp.git
    tag_regex: '^$'
    sha: 15c8e33353546148acc2d8bd784551cf3905d1e2   # untagged; package 0.3.0
    image: tokenfrugal/postgres-mcp:1
    dockerfile: docker/postgres-mcp/Dockerfile
    context: folder
    licence: MIT
    base_image: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
  reddit-mcp:
    repo: https://github.com/ekatiyar/simple-reddit-mcp.git
    tag_regex: '^v(\d+)\.(\d+)\.(\d+)$'
    sha: 6011105882d447847265dc040823261dbd14d011   # tag v0.0.1
    image: tokenfrugal/reddit-mcp:1
    dockerfile: docker/reddit-mcp/Dockerfile
    context: folder
    licence: MIT
    base_image: python:3.12-slim-bookworm@sha256:e697c81897302a4c4333bade000d98038fbb21eb064f8ee1fd42d02ebcd9d337
  hn-mcp:
    repo: https://github.com/erithwik/mcp-hn.git
    tag_regex: '^$'
    sha: a454f624e6b1171e0e3dbe0c9eafd2830565190f   # untagged (2025-07-13 commit)
    image: tokenfrugal/hn-mcp:1
    dockerfile: docker/hn-mcp/Dockerfile
    context: folder
    licence: MIT
    base_image: python:3.12-slim-bookworm@sha256:e697c81897302a4c4333bade000d98038fbb21eb064f8ee1fd42d02ebcd9d337
  rss-mcp:
    repo: https://github.com/veithly/rss-mcp.git
    tag_regex: '^$'
    sha: f0713aaeebef6129f277f2f4d524361751606011   # untagged (2025-12-12 commit)
    image: tokenfrugal/rss-mcp:1
    dockerfile: docker/rss-mcp/Dockerfile
    context: folder
    licence: Apache-2.0
    base_image: node:22-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
  youtube-mcp:
    repo: https://github.com/kirbah/mcp-youtube.git
    tag_regex: '^$'
    sha: 0ba98f673cf4f2ebdd21edb0ac9d3337c77f4531   # untagged (2026-10-31 commit)
    image: tokenfrugal/youtube-mcp:1
    dockerfile: docker/youtube-mcp/Dockerfile
    context: folder
    licence: MIT
    base_image: node:22-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
  # ComfyUI for the GPU video lease (docker-compose.gpu.yml, project tokenfrugal-gpu). Built by scripts/pinned_build.py:
  # it clones ComfyUI and each node at node_sha, checks each tree against tree_sha, and checks the node requirements
  # against docker/comfyui/requirements.lock before docker build. Node keys are node_sha/tree_sha, so check_pins --write
  # never rewrites them. tree_sha placeholders are written by the first build (the build prints the computed value).
  comfyui:
    repo: https://github.com/comfyanonymous/ComfyUI.git
    tag_regex: '^v(\d+)\.(\d+)\.(\d+)$'
    sha: 423cbd20511becb1f16122ab518e92e58bfa03d9   # tag v0.43.2
    tree_sha: <written by the first build>
    image: tokenfrugal/comfyui:1
    dockerfile: docker/comfyui/Dockerfile
    context: folder
    lockfile: docker/comfyui/requirements.lock
    licence: GPL-3.0 (confirm from LICENSE in the pinned tree at first build)
    base_image: nvidia/cuda:12.6.3-runtime-ubuntu24.04@sha256:<resolve-at-first-build>
    nodes:
      - repo: https://github.com/Lightricks/ComfyUI-LTXVideo.git
        node_sha: 220e1d45aa0469f518e982102fca4dca92a61862   # tag v1.1.0
        tree_sha: <written by the first build>
        folder: ComfyUI-LTXVideo
      - repo: https://github.com/city96/ComfyUI-GGUF.git
        node_sha: 6ea2651e7df66d7585f6ffee804b20e92fb38b8a   # untagged
        tree_sha: <written by the first build>
        folder: ComfyUI-GGUF
  # Small TCP forwarder that publishes 127.0.0.1:8188 to the internal-only ComfyUI container. No upstream git source:
  # the pin is the base image digest and the socat package version (both resolved at first build).
  forwarder:
    image: tokenfrugal/forwarder:1
    dockerfile: docker/forwarder/Dockerfile
    context: folder
    licence: GPL-2.0 (socat; confirm at first build)
    base_image: alpine:3.20@sha256:<resolve-at-first-build>
    socat_version: 1.8.0.0-r0   # confirm the apk version at first build
