<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #1b1f24; --muted: #667085; --line: #e4e7ec;
    --ink: #5b4b8a; --blue: #4dabf7; --amber: #ffb347; --run: #1a73e8; --done: #1a7f4b; --fail: #c62828; --stale: #8a6d00; --accent-bg: #e8f0fe;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #171b21; --fg: #e6e8eb; --muted: #8b95a3; --line: #262c35;
            --ink: #b9aaf0; --run: #6ea8fe; --done: #5fd39a; --fail: #ff7b7b; --stale: #e0b84a; --accent-bg: #16253d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { text-align: center; margin: 4px 0 18px; }
  .brand h1 { margin: 0; font: 800 48px/1.1 Nunito, "Varela Round", "Arial Rounded MT Bold", "Segoe UI", sans-serif; letter-spacing: .5px; }
  .brand h1 span:first-child { color: var(--ink); } .brand h1 span:last-child { color: var(--blue); }
  .brand h1::after { content: ""; display: block; width: 120px; height: 4px; border-radius: 2px; background: var(--amber); margin: 6px auto 0; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; }
  #conn { margin-left: auto; font-size: 12px; color: var(--muted); }
  #conn::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--fail); }
  #conn.on { display: none; }
  .roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .role { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .role.busy { border-color: var(--run); background: var(--accent-bg); }
  .role b { font-size: 13px; }
  .role .n { float: right; font-size: 12px; color: var(--run); font-weight: 600; }
  .role small { display: block; color: var(--muted); font-size: 12px; word-break: break-word; }
  .task { background: transparent; border-radius: 12px; padding: 4px 0; margin-bottom: 8px; min-width: 0; cursor: pointer; }
  .task .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .running { color: var(--run); } .done { color: var(--done); } .failed { color: var(--fail); } .stale { color: var(--stale); }
  .running .dot, .badge.running { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .badge.running { animation: none; } }
  .agent { font-weight: 600; } .meta { color: var(--muted); font-size: 12px; }
  .time { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .prompt { margin-top: 4px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--run); transition: width .3s; }
  .prog { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; --pc: var(--blue); }
  .prog .track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .prog .track i { display: block; height: 100%; width: 100%; background: var(--pc); border-radius: 4px; transition: width .4s, background .4s; }
  .prog .num { font-size: 12px; font-weight: 600; color: var(--pc); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
  .prog.run { --pc: var(--done); } .prog.fix { --pc: #e0a800; } .prog.fail { --pc: var(--fail); }
  .now { margin-top: 6px; font-size: 12px; }
  .now code { background: var(--accent-bg); padding: 1px 6px; border-radius: 4px; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; padding: 8px; background: var(--bg); border-radius: 6px; font-size: 12px; display: none; }
  .task.open pre { display: block; } .task.open .prompt { white-space: normal; }
  .prompt.wrap { white-space: normal; }
  .task { cursor: default; }

  .stage { display: flex; gap: 14px; align-items: center; margin-top: 12px; }
  .bot { flex: none; width: 72px; animation: bob 1.4s ease-in-out infinite; }
  .bot .eye { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
  .bot .mouth { transform-box: fill-box; transform-origin: center; animation: talk .35s ease-in-out infinite; }
  .bot .ant { animation: ping 1.4s ease-in-out infinite; }
  .bot .arm { transform-box: fill-box; transform-origin: top center; animation: type .5s ease-in-out infinite alternate; }
  .bot .body { fill: var(--accent-bg); stroke: var(--run); stroke-width: 3; }
  .bot .face { fill: var(--card); }
  .bot .ink { fill: var(--run); stroke: var(--run); }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes talk { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1.3); } }
  @keyframes ping { 50% { opacity: .3; } }
  @keyframes type { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
  .bubble { position: relative; flex: 1; min-width: 0; background: #fff; color: #1b1f24; border-radius: 12px; padding: 10px 12px; font-size: 13px; min-height: 40px; white-space: pre-wrap; word-break: break-word; }
  .bubble::before { content: ""; position: absolute; left: -5px; top: 18px; width: 12px; height: 12px; background: #fff; transform: rotate(45deg); }
  .think { position: relative; background: #fff; color: #1b1f24; border-radius: 10px; padding: 8px 12px; margin-top: 12px; font-size: 14px; line-height: 1.55; font-style: italic; min-height: 40px; max-height: 480px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .think::before { content: attr(data-label); display: block; font-size: 10px; font-style: normal; text-transform: uppercase; letter-spacing: .06em; color: #667085; margin-bottom: 2px; }
  .tail { position: absolute; left: 34px; bottom: -7px; width: 12px; height: 12px; background: #fff; transform: rotate(45deg); }
  .thinkwrap { position: relative; }
  .stage.under { margin-top: 10px; }
  .bubble.log { font: 13px/1.55 ui-monospace, Consolas, monospace; min-height: 40px; max-height: 560px; overflow-y: auto; white-space: normal; }
  .bubble.log div { white-space: pre-wrap; word-break: break-word; }
  .bubble.log .ts { color: #667085; margin-right: 6px; }
  .bot.sleep { animation: breathe 3.5s ease-in-out infinite; opacity: .8; }
  .bot.sleep .eye, .bot.sleep .mouth, .bot.sleep .ant, .bot.sleep .arm { animation: none; }
  .bot.sleep .eye { transform: scaleY(.12); }
  .bot.sleep .mouth { transform: scaleY(.5); }
  .zzz { position: absolute; font-weight: 700; color: var(--muted); animation: zz 2.4s ease-in infinite; opacity: 0; }
  @keyframes breathe { 50% { transform: scale(1.03); } }
  @keyframes zz { 0% { opacity: 0; transform: translate(0,0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(10px,-18px); } }
  @media (prefers-reduced-motion: reduce) { .bot, .bot * { animation: none !important; } }
  .strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 6px; }
  .strip h2 { margin: 0 6px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 0 0 16px; }
  .cell { background: var(--card); padding: 10px 14px; min-width: 0; grid-column: span 3; }
  .cell.third { grid-column: span 4; } .cell.wide { grid-column: span 8; }
  .cell h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .cell .val { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; } .cell .val small { color: var(--muted); font-weight: 400; }
  .cell .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip.running::before { background: var(--run); } .chip.disconnected::before, .chip.unavailable::before { background: var(--fail); }
  @media (max-width: 640px) { .cell, .cell.third, .cell.wide { grid-column: span 12; } }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; font-size: 12px; }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .chip.up::before, .chip.ready::before { background: var(--done); } .chip.down::before, .chip.missing::before { background: var(--fail); }
  .chip.idle::before { background: var(--stale); } .chip.native::before { background: var(--blue); }
  .chip.active { border-color: var(--run); background: var(--accent-bg); } .chip small { color: var(--muted); }
  .saved { text-align: center; margin: 8px 0 24px; color: var(--muted); } .saved b { display: block; font-size: 32px; color: var(--blue); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <h1 id="title"></h1>
  </div>
  <header>
    <span id="summary" class="meta"></span>
    <span id="conn"></span>
  </header>
  <div class="grid" id="bar"></div>
  <div id="tasks"></div>
  <div id="saved" class="saved"></div>
</main>
<script>
const BOT = `<svg class="bot" viewBox="0 0 72 84" aria-hidden="true">
  <line x1="36" y1="4" x2="36" y2="14" class="ink" stroke-width="3"/><circle class="ant ink" cx="36" cy="4" r="3.5"/>
  <rect class="body" x="10" y="14" width="52" height="40" rx="12"/>
  <rect class="face" x="17" y="21" width="38" height="26" rx="8"/>
  <ellipse class="eye ink" cx="28" cy="31" rx="3.5" ry="4.5"/><ellipse class="eye ink" cx="44" cy="31" rx="3.5" ry="4.5"/>
  <ellipse class="mouth ink" cx="36" cy="41" rx="6" ry="3"/>
  <rect class="body" x="20" y="58" width="32" height="20" rx="6"/>
  <rect class="arm ink" x="8" y="60" width="7" height="16" rx="3.5"/><rect class="arm ink" x="57" y="60" width="7" height="16" rx="3.5" style="animation-direction:alternate-reverse"/>
</svg>`;
const tasks = new Map();
let roles = [];
let state = {};
const T = (k) => (state.ui && state.ui[k]) || '';
const fill = (str, vars) => String(str).replace(/\{(\w+)\}/g, (_, k) => vars[k]);
const word = (group, k) => ((state.ui && state.ui[group]) || {})[k] || k;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function fmt(sec) {
  sec = Math.max(0, Math.round(sec));
  return sec < 60 ? sec + 's' : Math.floor(sec / 60) + 'm ' + String(sec % 60).padStart(2, '0') + 's';
}

function makeStage(sleeping, log, think) {
  const stage = el('div', 'stage under');
  const wrap = el('div'); wrap.style.position = 'relative';
  wrap.innerHTML = BOT;
  const bot = wrap.firstChild;
  if (sleeping) {
    bot.classList.add('sleep');
    wrap.append(el('span', 'zzz', 'z'));
    wrap.lastChild.style.cssText = 'left:58px;top:6px';
  }
  const box = el('div', 'bubble log');
  const lines = log && log.length ? log : [{ ts: 0, text: sleeping ? T('sleeping_log') : T('awake_log') }];
  for (const l of lines.slice(-12)) {
    const d = el('div');
    if (l.ts) d.append(el('span', 'ts', new Date(l.ts * 1000).toLocaleTimeString([], { hour12: false })));
    d.append(l.text);
    box.append(d);
  }
  stage.append(wrap, box);
  const thought = el('div', 'think', sleeping ? T('sleeping_think') : (think || T('thinking_placeholder')));
  thought.dataset.label = T('thinking_label');
  const all = el('div'); const tw = el('div', 'thinkwrap'); tw.append(thought, el('i', 'tail')); all.append(tw, stage);
  requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; thought.scrollTop = thought.scrollHeight; });
  return all;
}

function prog(t) {
  const max = t ? t.maxSteps : 0, n = t ? Math.min(t.step, max) : 0;
  const cls = !t ? '' : t.status === 'failed' ? 'fail' : t.fix ? 'fix' : 'run';
  const p = el('div', 'prog ' + cls), track = el('div', 'track'), i = el('i');
  if (t) i.style.width = (max ? (t.status === 'failed' ? Math.max(n, 1) / max : n / max) * 100 : 0) + '%';
  track.append(i); p.append(track, el('span', 'num', n + ' / ' + max));
  p.title = !t ? T('progress_idle') : t.status === 'failed' ? T('progress_failed') : t.fix ? T('progress_fix') : T('progress_run');
  return p;
}

function renderTasks() {
  const nowS = Date.now() / 1000;
  const live = [...tasks.values()].filter((t) => t.status === 'running');
  const list = [...tasks.values()].filter((t) => t.status === 'running' || (t.status === 'failed' && nowS - t.endedAt < 180)).sort((a, b) => b.startedAt - a.startedAt);
  const box = $('tasks'); box.replaceChildren();
  if (!list.length) {
    box.append(el('div', 'empty', T('idle')));
    const last = [...tasks.values()].filter((t) => t.endedAt).sort((a, b) => b.endedAt - a.endedAt)[0];
    const c = el('div', 'task');
    c.append(prog(null), makeStage(true, last ? last.log : []));
    box.append(c);
  }
  const now = Date.now() / 1000;
  for (const t of list) {
    const r = roles.find((x) => x.role === t.role);
    const c = el('div', 'task');
    const top = el('div', 'top');
    top.append(el('span', 'badge ' + (t.status === 'failed' ? 'failed' : 'running'), T(t.status === 'failed' ? 'badge_failed' : 'badge_running')), el('span', 'agent', t.agent),
               el('span', 'meta', t.role + (t.attempt > 1 ? ' · ' + fill(T('attempt'), { n: t.attempt }) : '')),
               el('span', 'time', fmt((t.endedAt || now) - t.startedAt)));
    const cur = el('div', 'now', fill(T('step_line'), { step: t.step, max: t.maxSteps, calls: t.calls }));
    if (t.status === 'failed') cur.textContent = t.error;
    if (t.tool) cur.append(T('calling'), el('code', null, t.tool));
    const stage = makeStage(false, t.log, t.think);
    c.append(prog(t), top, el('div', 'prompt wrap', t.prompt), cur);
    const ol = (state.services || {}).ollama || {};
    const ms = (ol.models || []).includes(t.model) ? 'ready' : (ol.ok ? 'missing' : 'down');
    const mrow = el('div', 'strip'); mrow.append(el('span', 'meta', T('model_label')), chip(t.model, ms, word('status', ms)));
    c.append(mrow);
    const mine = (state.mcp || []).filter((m) => m.roles.includes(t.role));
    if (mine.length) {
      const row = el('div', 'strip'); row.append(el('span', 'meta', T('mcp_label')));
      for (const m of mine) row.append(chip(m.name, m.status, word('status', m.status), word('kinds', m.kind)));
      c.append(row);
    }
    if (r) c.append(el('div', 'meta', T('tools_label') + r.tools.join(', ')));
    c.append(stage);
    box.append(c);
  }
  $('summary').textContent = fill(T('summary_running'), { n: live.length });
}

function chip(name, status, label, hint, active) {
  const c = el('span', 'chip ' + status + (active ? ' active' : ''), name);
  c.append(el('small', null, label));
  if (hint) c.title = hint;
  return c;
}

function renderChrome() {
  const u = state.ui || {};
  document.title = u.title || '';
  const parts = u.title_parts || [u.title || ''];
  $('title').replaceChildren(...parts.map((p) => el('span', null, p)));
  $('title').setAttribute('aria-label', u.title || '');
  const sv = state.services || {}, o = sv.ollama, d = sv.docker;
  const L = u.bar || {}, none = u.bar_none || '', sn = u.services || {}, names = u.bar_names || {};
  const cell = (k, cls, ...v) => { const c = el('div', 'cell ' + cls); c.append(el('h3', null, L[k] || ''), ...v); return c; };
  const val = (text, small) => { const v = el('div', 'val', text || none); if (small) v.append(' ', el('small', null, small)); return v; };
  const who = [...new Set((state.connected || []).map((n) => names[Object.keys(names).find((k) => n.toLowerCase().includes(k))] || n))];
  const list = [...tasks.values()].filter((t) => t.status === 'running').sort((a, b) => b.startedAt - a.startedAt);
  const running = list.length > 0;
  const st = !who.length ? 'disconnected' : (o && !o.ok) ? 'unavailable' : running ? 'running' : 'idle';
  const sc = el('div', 'chips'); sc.append(chip(word('state', st), st, who.join(' + ')));
  const oc = el('div', 'chips'); oc.append(o ? chip(sn.ollama, o.ok ? 'up' : 'down', word('status', o.ok ? 'up' : 'down') + (o.ok ? ' · ' + o.models.length : ''), o.url) : none);
  const dc = el('div', 'chips'); dc.append(d ? chip(sn.docker, d.ok ? 'up' : 'down', word('status', d.ok ? 'up' : 'down') + (d.version ? ' · ' + d.version : '')) : none);
  const g = sv.graph, gc = el('div', 'chips');
  if (g) {
    const gchip = chip(u.bar && u.bar.graph || '', g.ok ? 'up' : 'down', g.ok ? word('state', 'running') : word('state', 'unavailable'), g.ok ? (u.codelense_open || '') + ' ' + g.url : '');
    if (g.ok) { const a = el('a', null); a.href = g.url; a.target = '_blank'; a.rel = 'noopener'; a.style.textDecoration = 'none'; a.style.color = 'inherit'; a.append(gchip); gc.append(a); }
    else gc.append(gchip);
  }
  $('bar').replaceChildren(cell('status', '', sc), cell('ollama', '', oc), cell('docker', '', dc), cell('graph', '', gc));
}

function renderSaved() {
  const n = [...tasks.values()].reduce((a, t) => a + (t.saved || 0), 0);
  const b = $('saved'); b.replaceChildren(el('b', '', n.toLocaleString()), el('span', '', T('tokens_saved')));
}
function render() { renderChrome(); renderTasks(); renderSaved(); }

async function load() {
  const s = await (await fetch('/api/state')).json();
  state = s; roles = s.roles || [];
  tasks.clear(); for (const t of s.tasks) tasks.set(t.id, t);
  render();
}

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { $('conn').className = 'on'; $('conn').textContent = ''; load(); };
  es.onmessage = (m) => { const t = JSON.parse(m.data); tasks.set(t.id, t); render(); };
  es.onerror = () => { $('conn').className = ''; $('conn').textContent = word('conn', 'reconnecting'); };
}

load().catch(() => {});
connect();
setInterval(() => load().catch(() => {}), 5000); // services / MCP status
setInterval(() => { renderTasks(); renderSaved(); }, 1000); // keeps elapsed timers ticking

</script>
</body>
</html>
