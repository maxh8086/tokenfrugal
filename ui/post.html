<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share benchmark</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #1b1f24; --muted: #667085; --line: #e4e7ec;
    --ink: #5b4b8a; --blue: #4dabf7; --amber: #ffb347; --done: #1a7f4b; --fail: #c62828; --accent-bg: #e8f0fe;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f1216; --card: #171b21; --fg: #e6e8eb; --muted: #8b95a3; --line: #262c35;
            --ink: #b9aaf0; --done: #5fd39a; --fail: #ff7b7b; --accent-bg: #16253d; }
  }
  :root[data-theme="dark"] { --bg: #0f1216; --card: #171b21; --fg: #e6e8eb; --muted: #8b95a3; --line: #262c35;
            --ink: #b9aaf0; --done: #5fd39a; --fail: #ff7b7b; --accent-bg: #16253d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  .brand { text-align: center; margin: 4px 0 18px; }
  .brand h1 { margin: 0; font: 800 40px/1.1 Nunito, "Varela Round", "Arial Rounded MT Bold", "Segoe UI", sans-serif; letter-spacing: .5px; }
  .brand h1 span:first-child { color: var(--ink); } .brand h1 span:last-child { color: var(--blue); }
  .brand h1::after { content: ""; display: block; width: 120px; height: 4px; border-radius: 2px; background: var(--amber); margin: 6px auto 0; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  img { width: 100%; border-radius: 6px; border: 1px solid var(--line); display: block; }
  button, .btn { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-block; margin: 4px 4px 0 0; }
  button:hover, .btn:hover { border-color: var(--blue); }
  .primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .meta { color: var(--muted); font-size: 12px; }
  .status { color: var(--muted); font-size: 13px; }
  .status.ok { color: var(--done); } .status.err { color: var(--fail); }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 8px; }
  #hint { min-height: 1em; }
  .back { display: inline-block; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <a class="back" href="/">&larr; Dashboard</a>
  <div class="brand">
    <h1><span>Token</span><span>Frugal</span></h1>
    <p>Share benchmark</p>
  </div>

  <div id="empty" class="card" hidden>
    <h3>No benchmark result yet</h3>
    <p class="status">Run a benchmark from the dashboard first. This page fills in with your latest result.</p>
    <a class="btn primary" href="/">Open dashboard</a>
  </div>

  <div id="content" hidden>
    <div class="card">
      <h3>1. Text</h3>
      <textarea id="txt" readonly rows="7"></textarea>
      <div class="actions">
        <button type="button" id="copyTxt">Copy text</button>
        <span id="m1" class="status"></span>
      </div>
    </div>

    <div class="card">
      <h3>2. Image</h3>
      <img id="img" alt="Benchmark result card">
      <div class="actions">
        <button type="button" id="copyImg">Copy image</button>
        <button type="button" id="dlImg">Download</button>
        <span id="m2" class="status"></span>
      </div>
    </div>

    <div class="card">
      <h3>3. Post</h3>
      <div class="actions">
        <a class="btn primary" href="https://www.linkedin.com/feed/?shareActive=true" target="_blank" rel="noopener">Post</a>
        <button type="button" id="tw">Share on X</button>
      </div>
      <p class="meta" id="hint">Paste the text with Ctrl+V and attach the image (or paste it after Copy image).</p>
    </div>
  </div>

  <canvas id="cv" width="1200" height="627" hidden></canvas>
</main>
<script>
const BENCH_GH = 'https://github.com/maxh8086/tokenfrugal';
const BENCH_BASE = 'https://maxh8086.github.io/tokenfrugal/Benchmark/';
const LI_TAG = '@vpavtekar';      // LinkedIn handle in the shared text
const X_TAG = '@vaibhavpavtekar'; // X handle, swapped in for the X share only
let S = null;
const $ = (id) => document.getElementById(id);

const nameOf = (s) => s.model || s.tag;
// LinkedIn turns hf.co links into shortened links, so the text drops the host and keeps owner/model
const shortName = (s) => nameOf(s).replace(/^(https?:\/\/)?(www\.)?hf\.co\//i, '');

// rows: one finished run (latest) or the top 3 runs when there is no recent run
function postText(rows) {
  const head = rows.length === 1
    ? `🚀💥 Boom! My (${shortName(rows[0])}) model just scored ${rows[0].verified}/${rows[0].ran} (${rows[0].pct}%) on the TokenFrugal Benchmark! 🧠🔥\n\n`
    : `🚀💥 Boom! Here are Top ${rows.length} benchmarks I discovered on TokenFrugal! 🧠🔥\n` +
      rows.map((s, i) => `${i + 1}. ${shortName(s)}: ${s.verified}/${s.ran} (${s.pct}%)`).join('\n') + '\n\n';
  return head +
    `Try your own model using ${BENCH_GH} shared by ${LI_TAG}. Share me your results below so we can see how different hardware performs!\n` +
    `#LocalLLM #Ollama #TokenFrugal`;
}

// wrap text on character boundaries so nothing runs past maxW
function wrapLines(x, text, maxW) {
  const out = []; let cur = '';
  for (const ch of text) {
    const t = cur + ch;
    if (cur && x.measureText(t).width > maxW) { out.push(cur); cur = ch; } else cur = t;
  }
  if (cur) out.push(cur);
  return out;
}

// shrink the font until the text fits maxW (keeps one line, never overflows)
function fitFont(x, text, maxW, size, weight) {
  let fs = size; x.font = `${weight} ${fs}px system-ui,sans-serif`;
  while (x.measureText(text).width > maxW && fs > 16) { fs -= 2; x.font = `${weight} ${fs}px system-ui,sans-serif`; }
  return text;
}

function drawCard(rows) {
  const c = $('cv'), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1200, 627); g.addColorStop(0, '#0f172a'); g.addColorStop(1, '#1e3a8a');
  x.fillStyle = g; x.fillRect(0, 0, 1200, 627);
  x.fillStyle = '#93c5fd'; x.font = '600 34px system-ui,sans-serif';
  x.fillText(rows.length === 1 ? 'TokenFrugal Ollama benchmark' : `TokenFrugal Ollama benchmark · Top ${rows.length}`, 70, 100);
  if (rows.length === 1) {
    const s = rows[0];
    x.fillStyle = '#fff'; x.font = '700 56px system-ui,sans-serif';
    wrapLines(x, nameOf(s), 1060).forEach((l, i) => x.fillText(l, 70, 165 + i * 68));
    x.fillStyle = '#4ade80'; x.font = '800 190px system-ui,sans-serif'; x.fillText(s.pct + '%', 70, 420);
    x.fillStyle = '#e2e8f0';
    const l1 = `${s.verified}/${s.ran} checks passed`;
    const l2 = `${s.cases} real-world coding cases` + (s.tps != null ? ` · ${s.tps} t/s` : '');
    fitFont(x, l1, 610, 40, 500); x.fillText(l1, 520, 330);
    fitFont(x, l2, 610, 40, 500); x.fillText(l2, 520, 390);
  } else {
    rows.forEach((s, i) => {
      const y = 220 + i * 120;
      x.fillStyle = '#fff';
      x.fillText(fitFont(x, `${i + 1}. ${nameOf(s)}`, 800, 48, 700), 70, y);
      x.fillStyle = '#4ade80'; x.font = '800 56px system-ui,sans-serif'; x.textAlign = 'right';
      x.fillText(s.pct + '%', 1130, y);
      x.textAlign = 'left';
      x.fillStyle = '#94a3b8'; x.font = '500 30px system-ui,sans-serif';
      const sub = `${s.verified}/${s.ran} checks passed · ${s.cases} cases`;
      fitFont(x, sub, 1060, 30, 500); x.fillText(sub, 70, y + 42);
    });
  }
  x.fillStyle = '#94a3b8'; x.font = '500 30px system-ui,sans-serif';
  const foot = 'Run on my own machine · github.com/maxh8086/tokenfrugal';
  x.fillStyle = '#94a3b8'; fitFont(x, foot, 1060, 30, 500); x.fillText(foot, 70, 560);
  $('img').src = c.toDataURL('image/png');
}

function imgBlob() { return new Promise((r) => $('cv').toBlob(r, 'image/png')); }

async function copyText() {
  try { await navigator.clipboard.writeText($('txt').value); $('m1').textContent = 'copied'; $('m1').className = 'status ok'; }
  catch { $('txt').select(); $('m1').textContent = 'press Ctrl+C'; $('m1').className = 'status'; }
}
async function copyImage() {
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': await imgBlob() })]); $('m2').textContent = 'copied'; $('m2').className = 'status ok'; }
  catch { $('m2').textContent = 'copy blocked, use Download'; $('m2').className = 'status err'; }
}
async function download() {
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(await imgBlob());
    a.download = 'tokenfrugal-benchmark.png'; a.click();
  } catch { $('m2').textContent = 'download failed'; $('m2').className = 'status err'; }
}
async function shareX() {
  await download();
  const text = $('txt').value.split(LI_TAG).join(X_TAG).replace(/\n{3,}/g, '\n\n').trim();
  const url = BENCH_BASE + (S && S.target === 'explorer' ? 'explorer.html' : '');
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url), '_blank', 'noopener');
}

async function init() {
  let rows = [];
  try {
    const j = await (await fetch('/api/bench/status', { cache: 'no-store' })).json();
    if (j.summary && j.summary.ran) rows = [j.summary];
  } catch { /* no status: fall back to the newest run on disk */ }
  if (!rows.length) {
    try {
      const j = await (await fetch('/api/bench/latest', { cache: 'no-store' })).json();
      if (j.latest) rows = [j.latest];
    } catch { /* fall through to top runs */ }
  }
  if (!rows.length) {
    try {
      const j = await (await fetch('/api/bench/top', { cache: 'no-store' })).json();
      rows = (j.top || []).filter((s) => s.ran);
    } catch { rows = []; }
  }
  if (!rows.length) { $('empty').hidden = false; return; }
  S = rows[0];
  $('txt').value = postText(rows);
  drawCard(rows);
  $('content').hidden = false;
}

$('copyTxt').onclick = copyText;
$('copyImg').onclick = copyImage;
$('dlImg').onclick = download;
$('tw').onclick = shareX;
init();
</script>
</body>
</html>
