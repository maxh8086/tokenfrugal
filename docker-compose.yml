# All MCP backing services for the TokenFrugal router, in one project (tokenfrugal).
# Nothing runs by default: the router (or scripts/mcp_up.*) starts only what a role needs and stops it afterwards.
#   backends  : long-running services (crawl4ai, sonarqube, penpot-mcp)
#   neo4j     : plan/task graph; started with the router, kept up until the router exits (which stops every tokenfrugal container)
#   mcp-*     : stdio MCP wrappers, started per task with `docker compose run --rm -T` (router native servers)
# Secrets are Docker secret files in the secrets directory outside the repo (~/.docker/mcp/secrets, written by
# python -m router.secrets_store). scripts/mcp_up.* set TF_SECRETS_DIR to that directory. Each service mounts only the
# secrets it needs at /run/secrets/NAME; no secret value is read from the environment.
name: tokenfrugal

secrets:
  CRAWL4AI_API_TOKEN: {file: "${TF_SECRETS_DIR:?run scripts/mcp_up first}/CRAWL4AI_API_TOKEN"}
  SEARXNG_SECRET: {file: "${TF_SECRETS_DIR:?run scripts/mcp_up first}/SEARXNG_SECRET"}
  SONARQUBE_TOKEN: {file: "${TF_SECRETS_DIR:?run scripts/mcp_up first}/SONARQUBE_TOKEN"}
  NEO4J_AUTH: {file: "${TF_SECRETS_DIR:?run scripts/mcp_up first}/NEO4J_AUTH"}
  TF_DB_PASSWORD: {file: "${TF_SECRETS_DIR:?run scripts/mcp_up first}/TF_DB_PASSWORD"}
  TF_DB_MSSQL_PASSWORD: {file: "${TF_SECRETS_DIR:?run scripts/mcp_up first}/TF_DB_MSSQL_PASSWORD"}

services:
  crawl4ai:
    image: unclecode/crawl4ai:latest
    profiles: [research]
    # The image's entrypoint reads /run/secrets/api_token, so the secret is mounted under that name.
    secrets: [{source: CRAWL4AI_API_TOKEN, target: api_token}]
    ports: ["127.0.0.1:11235:11235"]
    shm_size: 1g
    mem_limit: 2g
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:11235/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  mcp-crawl4ai:
    image: tokenfrugal/crawl4ai-mcp:1
    build: ./docker/crawl4ai-mcp   # built on first use, then reused
    profiles: [research]
    environment:
      CRAWL4AI_URL: http://crawl4ai:11235
      SEARXNG_URL: http://searxng:8080
    secrets: [CRAWL4AI_API_TOKEN]   # server.py reads /run/secrets/CRAWL4AI_API_TOKEN
    stdin_open: true

  searxng:
    image: searxng/searxng:latest
    profiles: [research]
    # Wrapper: exports the secret file into the environment inside the container, then runs the image's entrypoint.
    entrypoint: ["/bin/sh", "-c", "export SEARXNG_SECRET=\"$$(cat /run/secrets/SEARXNG_SECRET)\" && exec /usr/local/searxng/entrypoint.sh \"$$@\"", "sh"]
    secrets: [SEARXNG_SECRET]
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports: ["127.0.0.1:8088:8080"]
    mem_limit: 512m
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  sonarqube:
    image: sonarqube:community
    profiles: [security]
    # Elasticsearch resolves the container's own hostname at start; pin it so /etc/hosts has an entry for it.
    hostname: tf-sonarqube
    extra_hosts: ["tf-sonarqube:127.0.0.1"]
    ports: ["127.0.0.1:9100:9000"]
    mem_limit: 3g
    restart: "no"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_ext:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  mcp-sonarqube:
    image: mcp/sonarqube@sha256:925c88bc7cab2a1e1025b0bd43f0af504cd8ce1b99e9663ececaca914fb632e7
    profiles: [security]
    # Wrapper: exports the secret file as SONARQUBE_TOKEN (the server reads only the environment), then runs the image's entrypoint.
    entrypoint: ["/bin/sh", "-c", "export SONARQUBE_TOKEN=\"$$(cat /run/secrets/SONARQUBE_TOKEN)\" && exec /usr/local/bin/docker-entrypoint \"$$@\"", "sh"]
    environment:
      SONARQUBE_ORG: ${SONARQUBE_ORG:-}
      SONARQUBE_URL: http://sonarqube:9000
      STORAGE_PATH: /tmp
    secrets: [SONARQUBE_TOKEN]
    stdin_open: true

  neo4j:
    image: neo4j:5-community
    profiles: [plan]
    # BLOCKED: NEO4J_AUTH is mounted at /run/secrets/NEO4J_AUTH, but the image is not verified to read it from a file
    # (not pulled locally). Until a wrapper is verified, the server starts without the configured auth.
    secrets: [NEO4J_AUTH]
    environment:
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_PLUGINS: "[]"
    ports: ["127.0.0.1:7697:7687"]
    mem_limit: 1g
    restart: "no"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/7687'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  penpot-mcp:
    image: tokenfrugal/penpot-mcp:1
    build: ./docker/penpot-mcp   # built on first use, then reused
    profiles: [design]
    environment:
      MODE: service
    ports: ["127.0.0.1:4400-4402:4400-4402"]
    mem_limit: 1g
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(4401,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Scratch databases for the db-* roles. Ephemeral (no volumes), loopback only. Their passwords are the files
  # TF_DB_PASSWORD and TF_DB_MSSQL_PASSWORD in the secrets directory and must match the DSNs in scripts/gen_db_profiles.py.
  # Never point real data at these.
  db-postgres:
    image: postgres:16
    profiles: [db-postgres]
    environment: {POSTGRES_USER: tf, POSTGRES_PASSWORD_FILE: /run/secrets/TF_DB_PASSWORD, POSTGRES_DB: tf_scratch}
    secrets: [TF_DB_PASSWORD]
    ports: ["127.0.0.1:5432:5432"]
    mem_limit: 512m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tf -d tf_scratch"]
      interval: 3s
      timeout: 3s
      retries: 30

  db-mysql:
    image: mysql:8.0
    profiles: [db-mysql]
    environment: {MYSQL_ROOT_PASSWORD_FILE: /run/secrets/TF_DB_PASSWORD, MYSQL_DATABASE: tf_scratch}
    secrets: [TF_DB_PASSWORD]
    ports: ["127.0.0.1:3306:3306"]
    mem_limit: 768m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$(cat /run/secrets/TF_DB_PASSWORD)\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  db-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [db-mssql]
    # Wrapper: exports the secret file as MSSQL_SA_PASSWORD, then runs the image's launcher (image entrypoint and command).
    entrypoint: ["/bin/sh", "-c", "export MSSQL_SA_PASSWORD=\"$$(cat /run/secrets/TF_DB_MSSQL_PASSWORD)\" && exec /opt/mssql/bin/launch_sqlservr.sh \"$$@\"", "sh"]
    command: ["/opt/mssql/bin/sqlservr"]
    environment: {ACCEPT_EULA: "Y", MSSQL_PID: Developer}
    secrets: [TF_DB_MSSQL_PASSWORD]
    ports: ["127.0.0.1:1433:1433"]
    mem_limit: 2g
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  db-mongo:
    image: mongo:7
    profiles: [db-mongo]
    ports: ["127.0.0.1:27017:27017"]
    mem_limit: 512m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  db-redis:
    image: redis:7
    profiles: [db-redis]
    ports: ["127.0.0.1:6379:6379"]
    mem_limit: 256m
    restart: "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    profiles: [db-elastic]
    environment: {discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m"}
    ports: ["127.0.0.1:9200:9200"]
    mem_limit: 1g
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  # existing volume of the former ts-mcp project, so the plan-store data is kept
  neo4j_data: {external: true, name: ts-mcp_neo4j_data}
  # existing volumes from the former `docker run` sonarqube-ce container (keeps its data)
  sonarqube_data: {external: true}
  sonarqube_logs: {external: true}
  sonarqube_ext: {external: true}
