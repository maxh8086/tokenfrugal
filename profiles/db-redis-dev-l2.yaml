version: 1
id: db-redis-dev-l2
name: db-redis-dev-l2
secrets:
  default:
    provider: docker-desktop-store
servers:
- type: image
  secrets: default
  tools:
  - lpush
  - rpush
  - sadd
  - expire
  - json_get
  - json_set
  image: mcp/redis@sha256:e886a7e9990a084a20d46adcea8e7c89d539271f1b453ffabdce4c3f96f27fa0
  snapshot:
    server:
      name: redis
      type: server
      image: mcp/redis@sha256:e886a7e9990a084a20d46adcea8e7c89d539271f1b453ffabdce4c3f96f27fa0
      description: Redis (dev)
      title: redis
      remote: {}
      env:
      - name: REDIS_HOST
        value: host.docker.internal
      - name: REDIS_PORT
        value: '6379'
