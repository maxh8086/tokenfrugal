version: 1
id: db-redis-admin-l1
name: db-redis-admin-l1
secrets:
  default:
    provider: docker-desktop-store
servers:
- type: image
  secrets: default
  tools:
  - info
  - dbsize
  - client_list
  - scan_keys
  - get_indexes
  - get_index_info
  image: mcp/redis@sha256:e886a7e9990a084a20d46adcea8e7c89d539271f1b453ffabdce4c3f96f27fa0
  snapshot:
    server:
      name: redis
      type: server
      image: mcp/redis@sha256:e886a7e9990a084a20d46adcea8e7c89d539271f1b453ffabdce4c3f96f27fa0
      description: Redis (admin)
      title: redis
      remote: {}
      env:
      - name: REDIS_HOST
        value: host.docker.internal
      - name: REDIS_PORT
        value: '6379'
