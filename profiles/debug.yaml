      type: server
      image: mcp/mcp-code-interpreter@sha256:d6ce03d191c78b8e1b76eb861759c005469fc05606c7d8cc4fe64355a24550a9
      description: A Python-based execution tool that mimics a Jupyter notebook environment.
        It accepts code snippets, executes them, and maintains state across sessions
        — preserving variables, imports, and past results. Ideal for iterative development,
        debugging, or code execution.
      title: Python Interpreter
      icon: https://raw.githubusercontent.com/akuadane/mcp-code-interpreter/refs/heads/main/asset/logo.png
      readme: https://desktop.docker.com/mcp/catalog/v3/readme/mcp-code-interpreter.md
      remote: {}
      volumes:
      - notebooks:/app/notebooks
      tools:
      - name: execute_code
        description: Executes Python code within a persistent session, retaining past
          results (e.g., variables, imports). Similar to a Jupyter notebook. A session_id
          is returned on first use and must be included in subsequent requests to
          maintain context.
        arguments:
        - name: code
          type: string
          desc: ''
        - name: session_id
          type: integer
          desc: ''
          optional: true
      metadata:
        pulls: 56936
        stars: 2
