version: 1
id: github
name: github
servers:
- type: image
  secrets: default
  tools:
  - list_pull_requests
  - pull_request_read
  - issue_read
  - list_issues
  - get_file_contents
  - create_pull_request
  - update_pull_request
  - issue_write
  - merge_pull_request
  - actions_list
  - actions_get
  - get_job_logs
  - actions_run_trigger
  image: ghcr.io/github/github-mcp-server@sha256:ffced0d76e77428532a2ced185516992d77fd146d69eec2f244e6237d1a97796
  catalog_ref: mcp/docker-mcp-catalog:latest
  snapshot:
    server:
      name: github-official
      type: server
      image: ghcr.io/github/github-mcp-server@sha256:ffced0d76e77428532a2ced185516992d77fd146d69eec2f244e6237d1a97796
      title: GitHub Official
      # Actions tools are an opt-in toolset in github-mcp-server (v2.0.2); default keeps the repo/PR/issue tools.
      command:
      - stdio
      - --toolsets=default,actions
      remote: {}
      oauth:
        providers:
        - provider: github
          secret: github.personal_access_token
          env: GITHUB_PERSONAL_ACCESS_TOKEN
      secrets:
      - name: github.personal_access_token
        env: GITHUB_PERSONAL_ACCESS_TOKEN
      allowHosts:
      - api.github.com:443
      - github.com:443
      - raw.githubusercontent.com:443
secrets:
  default:
    provider: docker-desktop-store
