version: 1
id: security
name: security
servers:
- type: image
  config:
    path: __WORKSPACE__
  secrets: default
  tools:
  - ast-grep
  image: mcp/ast-grep@sha256:5fc3f2e9dcf2c019e92662f608b8d89e12134ed6d91e6f5461de6efd506a1e72
  catalog_ref: mcp/docker-mcp-catalog:latest
  snapshot:
    server:
      name: ast-grep
      type: server
      image: mcp/ast-grep@sha256:5fc3f2e9dcf2c019e92662f608b8d89e12134ed6d91e6f5461de6efd506a1e72
      description: ast-grep is a fast and polyglot tool for code structural search,
        lint, rewriting at large scale.
      title: ast-grep
      icon: https://avatars.githubusercontent.com/u/114017360?s=200&v=4
      readme: https://desktop.docker.com/mcp/catalog/v3/readme/ast-grep.md
      remote: {}
      volumes:
      - '{{ast-grep.path|volume-target}}:/src'
      disableNetwork: true
      tools:
      - name: ast-grep
        description: Search codebases using ast-grep patterns for straightforward
          structural matches. (returns json)
        arguments:
        - name: pattern
          type: string
          desc: The ast-grep pattern to search for. Note, the pattern must have valid
            AST structure.
        - name: dir
          type: string
          desc: The directory to search in. If not specified, will use the current
            working directory.
          optional: true
        - name: lang
          type: string
          desc: The language of the code. If not specified, will be auto-detected
            based on file extensions.
          optional: true
        annotations:
          title: Search codebases using ast-grep patterns
          readOnlyHint: true
          destructiveHint: true
          idempotentHint: false
          openWorldHint: true
      config:
      - description: The MCP server is allowed to access this directory
        name: ast-grep
        properties:
          path:
            type: string
        required:
        - path
        type: object
      metadata:
        pulls: 100799
        stars: 2
        githubStars: 5
        category: code
        tags:
        - code
        - refactoring
        - grep
        license: Apache License 2.0
        owner: dgageot
- type: image
  secrets: default
  tools:
  - analyze_security_and_patterns
  - analyze_python_file
  image: mcp/mcp-python-refactoring@sha256:4cd4303da424f021f03e9fafc46187a08bcab212ead6f1e39867afee1d42cd24
  catalog_ref: mcp/docker-mcp-catalog:latest
  snapshot:
    server:
      name: mcp-python-refactoring
      type: server
      image: mcp/mcp-python-refactoring@sha256:4cd4303da424f021f03e9fafc46187a08bcab212ead6f1e39867afee1d42cd24
      description: Educational Python refactoring assistant that provides guided suggestions
        for AI assistants.
      title: Python Refactoring Assistant
      icon: https://www.google.com/s2/favicons?domain=python.org&sz=64
      readme: https://desktop.docker.com/mcp/catalog/v3/readme/mcp-python-refactoring.md
      remote: {}
      tools:
      - name: analyze_python_file
        description: Analyze Python file for refactoring opportunities with precise
          guidance
        arguments:
        - name: content
          type: string
          desc: Python file content to analyze
        - name: file_path
          type: string
          desc: Path to Python file to analyze
          optional: true
      - name: analyze_python_package
        description: Comprehensive package/folder analysis for refactoring opportunities
        arguments:
        - name: package_path
          type: string
          desc: Path to Python package/folder to analyze
        - name: package_name
          type: string
          desc: Name of the package (optional, will be inferred from path)
          optional: true
      - name: analyze_security_and_patterns
        description: Comprehensive security scanning and modern Python patterns analysis
        arguments:
        - name: content
          type: string
          desc: Python file content to analyze
        - name: file_path
          type: string
          desc: Path to Python file to analyze
          optional: true
        - name: include_dependency_scan
          type: boolean
          desc: 'Include dependency vulnerability scanning (default: true)'
          optional: true
        - name: include_modernization
          type: boolean
          desc: 'Include modern Python pattern suggestions (default: true)'
          optional: true
        - name: include_security_scan
          type: boolean
          desc: 'Include code security vulnerability scanning (default: true)'
          optional: true
      - name: analyze_test_coverage
        description: Analyze Python test coverage and suggest improvements
        arguments:
        - name: source_path
          type: string
          desc: Path to source code directory or file
        - name: target_coverage
          type: integer
          desc: 'Target coverage percentage (default: 80)'
          optional: true
        - name: test_path
          type: string
          desc: Path to test directory (optional)
          optional: true
      - name: find_long_functions
        description: Find functions that are candidates for extraction
        arguments:
        - name: content
          type: string
          desc: Python file content to analyze
        - name: line_threshold
          type: integer
          desc: 'Minimum lines to consider a function long (default: 20)'
          optional: true
      - name: find_package_issues
        description: Identify package-level refactoring opportunities and structural
          issues
        arguments:
        - name: package_path
          type: string
          desc: Path to Python package/folder
        - name: issue_types
          type: array
          items:
            type: string
          desc: 'Specific types of issues to look for (optional): scattered_functionality,
            god_package, circular_dependency, etc.'
          optional: true
      - name: get_extraction_guidance
        description: Get detailed step-by-step guidance for extracting functions
        arguments:
        - name: content
          type: string
          desc: Python file content
        - name: file_path
          type: string
          desc: Path to Python file
          optional: true
        - name: function_name
          type: string
          desc: Name of function to analyze for extraction
          optional: true
      - name: get_package_metrics
        description: Get aggregated metrics for a Python package
        arguments:
        - name: package_path
          type: string
          desc: Path to Python package/folder
        - name: package_name
          type: string
          desc: Name of the package (optional)
          optional: true
      - name: tdd_refactoring_guidance
        description: 'Generate TDD-based refactoring guidance: test first, refactor,
          test again'
        arguments:
        - name: content
          type: string
          desc: Python code content to refactor
        - name: function_name
          type: string
          desc: Specific function/class to refactor (optional)
          optional: true
        - name: test_path
          type: string
          desc: Path to test directory (optional)
          optional: true
      metadata:
        pulls: 36033
        stars: 2
        githubStars: 13
        category: development
        tags:
        - python
        - refactoring
        - code-analysis
        - education
        - development
        - code-quality
        - static-analysis
        - mentoring
        license: MIT License
        owner: slamer59
- type: image
  secrets: default
  tools:
  - read_file
  - read_multiple_files
  - list_directory
  - search_files
  image: mcp/filesystem@sha256:35fcf0217ca0d5bf7b0a5bd68fb3b89e08174676c0e0b4f431604512cf7b3f67
  snapshot:
    server:
      name: ts-fs-ro
      type: server
      image: mcp/filesystem@sha256:35fcf0217ca0d5bf7b0a5bd68fb3b89e08174676c0e0b4f431604512cf7b3f67
      description: Project filesystem ro
      title: ts-fs-ro
      remote: {}
      command:
      - /workspace
      volumes:
      - __WORKSPACE__:/workspace:ro
      disableNetwork: true
secrets:
  default:
    provider: docker-desktop-store
