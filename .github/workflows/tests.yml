name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: .
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -q
