# MCPs a persona can use, and the profile types shown in scripts/persona_ui.py.
# Each MCP names the Docker MCP profile and/or native server that serves it, the compose backends it needs,
# and the tool names it adds to the role allowlist. A persona's selection may combine several MCPs; the
# gateway opens the distinct profiles/natives and allows the union of tools (keep it at 6 or fewer for 3B models).
mcps:
  filesystem:         {label: "Filesystem (mcp/filesystem)",              profile: build,    tools: [read_file, write_file, edit_file, search_files, list_directory]}
  synaptree:          {label: "synaptree-mcp code graph",                  native: synaptree, tools: [search_graph, get_code_snippet, trace_path]}
  ast-grep:           {label: "ast-grep (mcp/ast-grep)",                   profile: analyze,  tools: [ast-grep]}
  git:                {label: "Git diff (analyze profile)",                profile: analyze,  tools: [git_diff]}
  git-history:        {label: "Git log (debug profile)",                   profile: debug,    tools: [git_log]}
  sequentialthinking: {label: "Sequential Thinking",                       profile: debug,    tools: [sequentialthinking]}
  code-interpreter:   {label: "Code Interpreter (mcp/mcp-code-interpreter)", profile: debug, tools: [execute_code]}
  fetch:              {label: "Fetch (mcp/fetch)",                         profile: docs,     tools: [fetch]}
  web-search:         {label: "SearXNG + Crawl4AI",                        native: crawl4ai,  compose: [crawl4ai, searxng], tools: [web_search, crawl_markdown, crawl_links]}
  sonarqube:          {label: "SonarQube",                                 native: sonarqube, compose: [sonarqube], tools: [search_sonar_issues_in_projects, search_security_hotspots, show_rule]}
  penpot:             {label: "Penpot",                                    profile: design,   compose: [penpot-mcp], tools: [high_level_overview, penpot_api_info, execute_code, export_shape]}
  chrome-devtools:    {label: "Chrome DevTools",                           profile: browser,  tools: [navigate_page, take_snapshot, take_screenshot, list_console_messages, list_network_requests, lighthouse_audit]}
  plan:               {label: "Task plan store (Neo4j)",                   native: plan,      compose: [neo4j], tools: [plan_next, plan_claim, plan_status, plan_blockers, plan_done, plan_note]}
  github:             {label: "GitHub (official MCP)",                     profile: github,   tools: [list_pull_requests, pull_request_read, issue_read, list_issues, get_file_contents, create_pull_request]}
  github-actions:     {label: "GitHub Actions (read-only, official MCP)", profile: github, tools: [actions_list, actions_get, get_job_logs]}
# Profile type -> personas that suit it; `default` is pre-selected.
profile_types:
  financial-analyst:  {label: "Financial analyst",  default: finance-analyst,                personas: [finance-analyst, support-finance-tracker, chief-financial-officer, accounts-payable-agent]}
  equity-research:    {label: "Equity research",    default: specialized-pricing-analyst,    personas: [specialized-pricing-analyst, chief-financial-officer, ma-integration-manager, business-strategist]}
  programmer:         {label: "Programmer",         default: engineering-backend-architect,  personas: [engineering-backend-architect, engineering-minimal-change-engineer, engineering-senior-developer, engineering-software-architect, engineering-api-platform-engineer, testing-test-automation-engineer, specialized-mcp-builder]}
  data-scientist:     {label: "Data scientist",     default: engineering-data-engineer,      personas: [engineering-data-engineer, engineering-database-optimizer, gis-analyst, support-analytics-reporter, testing-test-results-analyzer]}
  developer:          {label: "Developer / coder",   default: engineering-senior-developer, personas: [engineering-senior-developer, engineering-frontend-developer, engineering-rapid-prototyper, engineering-rust-refactoring-specialist, engineering-mobile-app-builder, engineering-webassembly-engineer, engineering-api-platform-engineer, engineering-codebase-onboarding-engineer]}
  devops:             {label: "DevOps / platform",  default: engineering-devops-automator, personas: [engineering-devops-automator, engineering-platform-engineer, engineering-git-workflow-master, engineering-mobile-release-engineer, engineering-developer-tooling-engineer, engineering-finops-engineer]}
  product-owner:      {label: "Product / launch owner", default: product-manager, personas: [product-manager, product-sprint-prioritizer, product-feedback-synthesizer, product-trend-researcher, project-management-experiment-tracker, product-dx-engineer]}
  architect:          {label: "Architect", default: engineering-software-architect, personas: [engineering-software-architect, engineering-backend-architect, engineering-multi-agent-systems-architect, security-architect, security-cloud-security-architect, specialized-workflow-architect, specialized-master-plan-architect]}
  frontend-mobile:    {label: "Frontend / mobile / i18n", default: engineering-frontend-developer, personas: [engineering-frontend-developer, engineering-mobile-app-builder, engineering-desktop-app-engineer, engineering-i18n-engineer, engineering-cms-developer, engineering-uswds-developer, engineering-wechat-mini-program-developer]}
  backend-services:   {label: "Backend / payments / realtime", default: engineering-api-platform-engineer, personas: [engineering-api-platform-engineer, engineering-payments-billing-engineer, engineering-realtime-collaboration-engineer, engineering-search-relevance-engineer, engineering-video-streaming-engineer, engineering-voice-ai-integration-engineer]}
  qa-perf:            {label: "QA / performance / accessibility", default: testing-test-automation-engineer, personas: [testing-test-automation-engineer, testing-performance-benchmarker, testing-api-tester, testing-reality-checker, testing-accessibility-auditor, testing-test-results-analyzer, testing-workflow-optimizer, engineering-section-508-specialist]}
  appsec:             {label: "AppSec / pentest / secrets", default: security-appsec-engineer, personas: [security-appsec-engineer, security-penetration-tester, security-secrets-credential-engineer, security-senior-secops, security-threat-detection-engineer, security-threat-intelligence-analyst, security-ai-generated-code-auditor]}
  compliance-privacy: {label: "Compliance / privacy / identity", default: security-compliance-auditor, personas: [security-compliance-auditor, support-legal-compliance-checker, data-privacy-officer, engineering-privacy-engineer, engineering-identity-access-engineer, specialized-fedramp-rmf-compliance, legal-document-review]}
  itsm-support:       {label: "ITSM / launch support", default: engineering-it-service-manager, personas: [engineering-it-service-manager, support-support-responder, support-infrastructure-maintainer, customer-service, customer-success-manager, engineering-servicenow-developer-mentor]}
  reviewer-qa:        {label: "Reviewer / QA",      default: testing-code-reviewer,          personas: [testing-code-reviewer, engineering-code-reviewer, testing-reality-checker, testing-accessibility-auditor]}
  sre-debugger:       {label: "SRE / debugger",     default: engineering-sre,                personas: [engineering-sre, engineering-incident-response-commander, engineering-database-reliability-engineer, engineering-network-engineer, engineering-it-service-manager, testing-api-tester, support-infrastructure-maintainer, security-incident-responder]}
  security:           {label: "Security",           default: security-auditor,               personas: [security-auditor, engineering-privacy-engineer, specialized-fedramp-rmf-compliance]}
  ux-designer:        {label: "UI / UX designer", default: design-ux-architect, personas: [design-ux-architect, design-ui-designer, design-ux-researcher, design-persona-walkthrough, design-ui-finish-gate-reviewer, design-brand-guardian, design-inclusive-visuals-specialist, design-whimsy-injector, design-visual-storyteller, testing-accessibility-auditor]}
  ui-tester:          {label: "Designer / UI tester", default: testing-evidence-collector,  personas: [testing-evidence-collector, design-ui-designer, design-persona-walkthrough, design-ui-finish-gate-reviewer]}
  docs-writer:        {label: "Docs writer",        default: support-docs-writer,            personas: [support-docs-writer, engineering-technical-writer, specialized-document-generator]}
  project-manager:    {label: "Project manager",    default: project-management-project-shepherd, personas: [project-management-project-shepherd, project-manager-senior]}
