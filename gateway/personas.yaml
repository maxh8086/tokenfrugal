# compose: backends started (and stopped afterwards) around the task; keep_alive: true leaves them up.
# Role -> local model, Docker MCP profile, tool allowlist (names as exposed by the gateway).
# Local-only: no cloud fallback. Failures return a capped error summary to Haiku.
models:
  builder: qwen2.5-coder-yarn:3b
  thinker: llama3.2:3b-16k
# Per-persona model (agency-agents slug -> Ollama tag, or the logical name builder/thinker).
# Defaults = smallest adequate, then fastest measured solo model per persona (Benchmark/persona-model-selection.md). Edit here, or override
# without touching this file via `python -m scripts.persona_ui` (writes gateway/persona_models.json).
# Personas not listed use their role's model. Tags come from models/trial/*.Modelfile.
persona_models:
  engineering-backend-architect: ts-gemma4-e4b-16384
  testing-code-reviewer: thinker
  engineering-sre: builder
  support-docs-writer: ts-qwen3-8b-16384
  engineering-software-architect: builder
  gis-analyst: builder
  engineering-technical-writer: builder
  security-auditor: builder
  design-ui-designer: thinker
  testing-evidence-collector: thinker
  project-management-project-shepherd: thinker
roles:
  builder:  {model: builder, profile: build,      max_steps: 12, native: [synaptree], tools: [read_file, write_file, edit_file, search_files, search_graph, get_code_snippet]}
  data:     {model: builder, profile: build-data, max_steps: 12, tools: [read_file, write_file, list_directory]}  # no SQL MCP wired yet
  analyzer: {model: thinker, profile: analyze,    max_steps: 10, native: [synaptree], tools: [read_file, search_graph, get_code_snippet, trace_path, git_diff, ast-grep]}
  security: {model: thinker, profile: security,   max_steps: 10, compose: [sonarqube], native: [sonarqube], tools: [read_file, search_files, ast-grep, search_sonar_issues_in_projects, search_security_hotspots, show_rule]}
  reviewer: {model: thinker, profile: analyze,    max_steps: 8,  native: [synaptree], tools: [read_file, git_diff, get_code_snippet, trace_path, ast-grep]}
  debugger: {model: thinker, profile: debug,      max_steps: 12, native: [synaptree], tools: [read_file, search_graph, trace_path, git_log, sequentialthinking, execute_code]}
  docs:     {model: thinker, profile: docs,       max_steps: 8,  tools: [read_file, list_directory, git_log, fetch]}
  designer: {model: thinker, profile: design,     max_steps: 10, compose: [penpot-mcp], tools: [high_level_overview, penpot_api_info, execute_code, export_shape]}
  browser:  {model: thinker, profile: browser,    max_steps: 8,  tools: [navigate_page, take_snapshot, take_screenshot, list_console_messages, list_network_requests, lighthouse_audit]}
  tracker:  {model: thinker, max_steps: 6,  compose: [neo4j], native: [plan], tools: [plan_next, plan_claim, plan_status, plan_blockers, plan_done, plan_note], skills: [planning]}
  github-read: {model: thinker, profile: github, max_steps: 8, tools: [list_pull_requests, pull_request_read, issue_read, list_issues, get_file_contents]}  # read-only; create/close/merge PRs stay with Haiku
  github-actions-read: {model: thinker, profile: github, max_steps: 8, tools: [actions_list, actions_get, get_job_logs]}  # read-only Actions; actions_run_trigger (run, rerun, cancel, delete logs) stays with Haiku
  devops:   {model: builder, profile: [build, analyze, debug], max_steps: 12, tools: [read_file, write_file, edit_file, git_diff, git_log, execute_code]}
  finance:  {model: thinker, profile: docs,       max_steps: 8,  compose: [crawl4ai, searxng], native: [crawl4ai], tools: [read_file, list_directory, fetch, web_search, crawl_markdown]}
  research: {model: thinker,                       max_steps: 8,  compose: [crawl4ai, searxng], native: [crawl4ai], tools: [web_search, crawl_markdown, crawl_links]}
persona_skills:
  project-management-project-shepherd: [planning]
