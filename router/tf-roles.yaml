# compose: backends started (and stopped afterwards) around the task; keep_alive: true leaves them up.
# Role -> local model, Docker MCP profile, tool allowlist (names as exposed by the router).
# Local-only: no cloud fallback. Failures return a capped error summary to Haiku.
models:
  builder: hf.co/unsloth/Qwen3.5-4B-GGUF:Q6_K
  thinker: prism-bonsai-4b-q1:latest
# Per-agent model (agency-agents slug -> Ollama tag, or the logical name builder/thinker).
# Empty by default: every agent uses its role's model. Add entries here, or override
# without touching this file via `python -m scripts.tf_roles_ui` (writes router/tf-roles_models.json).
tf_roles_models: {}
# Slugs accepted even with no model mapping (benchmark cases dispatch to these).
known_agents: [db-postgres-dev, db-postgres-admin, db-mysql-dev, db-mysql-admin, db-mssql-dev, db-mssql-admin, db-oracle-dev, db-oracle-admin, db-elastic-dev, db-elastic-admin, db-mongo-dev-l1, db-mongo-dev-l2, db-mongo-admin-l1, db-mongo-admin-l2, db-redis-dev-l1, db-redis-dev-l2, db-redis-dev-l3, db-redis-admin-l1, coding-l1, coding-l2, coding-l3, coding-l4, coding-l5, coding-l6, engineering-backend-architect, design-ui-designer, gis-analyst, support-docs-writer]
roles:
  builder:  {model: builder, profile: build,      max_steps: 12, timeout_s: 90, native: [synaptree, sandbox], tools: [read_file, write_file, edit_file, search_graph, get_code_snippet, run_tests], skills: [role-builder]}
  data-engineer: {model: builder, profile: build-data, max_steps: 12, timeout_s: 60, tools: [read_file, list_directory], skills: [role-data]}  # pipelines and files; SQL work goes to db-* roles
  analyzer: {model: thinker, profile: analyze,    max_steps: 10, timeout_s: 60, native: [synaptree], tools: [read_file, search_graph, get_code_snippet, trace_path, git_diff, ast-grep], skills: [role-analyzer]}
  security: {model: thinker, profile: security,   max_steps: 10, timeout_s: 160, compose: [sonarqube], native: [sonarqube], tools: [read_file, search_files, ast-grep, search_sonar_issues_in_projects, search_security_hotspots, show_rule], skills: [security-audit]}
  reviewer: {model: thinker, profile: analyze,    max_steps: 8, timeout_s: 60,  native: [synaptree], tools: [read_file, git_diff, get_code_snippet, trace_path, ast-grep], skills: [code-review]}
  debugger: {model: thinker, profile: debug,      max_steps: 12, timeout_s: 220, native: [synaptree], tools: [read_file, search_graph, trace_path, git_log, sequentialthinking, execute_code], skills: [role-debugger]}
  docs:     {model: thinker, profile: docs,       max_steps: 8, timeout_s: 100,  tools: [read_file, list_directory, git_log, fetch], skills: [docs-style]}
  designer: {model: thinker, profile: design,     max_steps: 10, timeout_s: 160, compose: [penpot-mcp], tools: [high_level_overview, penpot_api_info, execute_code, export_shape], skills: [role-designer]}
  browser:  {model: thinker, profile: browser,    max_steps: 8, timeout_s: 80,  tools: [navigate_page, take_snapshot, take_screenshot, list_console_messages, list_network_requests, lighthouse_audit], skills: [role-browser]}
  tracker:  {model: thinker, max_steps: 6, timeout_s: 60,  compose: [neo4j], native: [plan], tools: [plan_next, plan_claim, plan_status, plan_blockers, plan_done, plan_note], skills: [role-tracker]}
  code-l1:  {model: builder, profile: code-l1, max_steps: 8, timeout_s: 120,  native: [sandbox], tools: [read_file, write_file, run_tests], skills: [code-l1]}
  code-l2:  {model: builder, profile: code-l2, max_steps: 10, timeout_s: 150, native: [sandbox], tools: [read_file, write_file, edit_file, search_files, run_tests], skills: [code-l2]}
  code-l3:  {model: builder, profile: code-l3, max_steps: 12, timeout_s: 180, native: [sandbox], tools: [read_file, write_file, edit_file, search_files, directory_tree, run_tests], skills: [code-l3]}
  code-l4:  {model: builder, profile: code-l4, max_steps: 12, timeout_s: 300, native: [sandbox], tools: [ast-grep, read_file, edit_file, write_file, search_files, run_tests], skills: [code-l4]}
  code-l5:  {model: builder, profile: code-l5, max_steps: 14, timeout_s: 300, native: [sandbox], tools: [sequentialthinking, git_diff, read_file, edit_file, run_tests, run_python], skills: [code-l5]}
  code-l6:  {model: builder, profile: code-l6, max_steps: 14, timeout_s: 300, native: [synaptree, sandbox], tools: [search_graph, trace_path, get_code_snippet, read_file, edit_file, run_tests], skills: [code-l6]}
  github-read: {model: thinker, profile: github, max_steps: 8, tools: [list_pull_requests, pull_request_read, issue_read, list_issues, get_file_contents], skills: [role-github-read]}  # read-only; create/close/merge PRs stay with Haiku
  github-actions-read: {model: thinker, profile: github, max_steps: 8, tools: [actions_list, actions_get, get_job_logs], skills: [role-github-actions-read]}  # read-only Actions; actions_run_trigger (run, rerun, cancel, delete logs) stays with Haiku
  devops:   {model: builder, profile: [build, analyze, debug], max_steps: 12, tools: [read_file, write_file, edit_file, git_diff, git_log, execute_code], skills: [role-devops]}
  finance:  {model: thinker, profile: docs,       max_steps: 8,  compose: [crawl4ai, searxng], native: [crawl4ai], tools: [read_file, list_directory, fetch, web_search, crawl_markdown], skills: [role-finance]}
  research: {model: thinker,                       max_steps: 8, timeout_s: 60,  compose: [crawl4ai, searxng], native: [crawl4ai], tools: [web_search, crawl_markdown, crawl_links], skills: [role-research]}
  db-postgres-dev: {model: builder, profile: db-postgres-dev, max_steps: 10, compose: [db-postgres], tools: [execute_sql, search_objects], skills: [db-dev]}
  db-postgres-admin: {model: thinker, profile: db-postgres-admin, max_steps: 8, compose: [db-postgres], tools: [execute_sql, search_objects], skills: [db-admin]}
  db-mysql-dev: {model: builder, profile: db-mysql-dev, max_steps: 10, compose: [db-mysql], tools: [execute_sql, search_objects], skills: [db-dev]}
  db-mysql-admin: {model: thinker, profile: db-mysql-admin, max_steps: 8, compose: [db-mysql], tools: [execute_sql, search_objects], skills: [db-admin]}
  db-mssql-dev: {model: builder, profile: db-mssql-dev, max_steps: 10, compose: [db-mssql], tools: [execute_sql, search_objects], skills: [db-dev]}
  db-mssql-admin: {model: thinker, profile: db-mssql-admin, max_steps: 8, compose: [db-mssql], tools: [execute_sql, search_objects], skills: [db-admin]}
  db-oracle-dev: {model: builder, profile: db-oracle-dev, max_steps: 10, tools: [execute_sql, search_objects], skills: [db-dev]}
  db-oracle-admin: {model: thinker, profile: db-oracle-admin, max_steps: 8, tools: [execute_sql, search_objects], skills: [db-admin]}
  db-elastic-dev: {model: builder, profile: db-elastic-dev, max_steps: 10, compose: [db-elastic], tools: [esql, get_mappings, list_indices, search], skills: [db-dev]}
  db-elastic-admin: {model: thinker, profile: db-elastic-admin, max_steps: 8, compose: [db-elastic], tools: [esql, get_mappings, get_shards, list_indices, search], skills: [db-admin]}
  db-mongo-dev-l1: {model: builder, profile: db-mongo-dev-l1, max_steps: 10, compose: [db-mongo], tools: [find, aggregate, count, collection-schema, explain, list-collections], skills: [db-dev]}
  db-mongo-dev-l2: {model: builder, profile: db-mongo-dev-l2, max_steps: 10, compose: [db-mongo], tools: [insert-many, update-many, create-collection, create-index, find, collection-schema], skills: [db-dev]}
  db-mongo-admin-l1: {model: thinker, profile: db-mongo-admin-l1, max_steps: 8, compose: [db-mongo], tools: [list-databases, list-collections, collection-schema, collection-indexes, db-stats, collection-storage-size], skills: [db-admin]}
  db-mongo-admin-l2: {model: thinker, profile: db-mongo-admin-l2, max_steps: 8, compose: [db-mongo], tools: [explain, find, aggregate, count, mongodb-logs, collection-indexes], skills: [db-admin]}
  db-redis-dev-l1: {model: builder, profile: db-redis-dev-l1, max_steps: 10, compose: [db-redis], tools: [get, set, hgetall, hset, lrange, smembers], skills: [db-dev]}
  db-redis-dev-l2: {model: builder, profile: db-redis-dev-l2, max_steps: 10, compose: [db-redis], tools: [lpush, rpush, sadd, expire, json_get, json_set], skills: [db-dev]}
  db-redis-dev-l3: {model: builder, profile: db-redis-dev-l3, max_steps: 10, compose: [db-redis], tools: [create_vector_index_hash, set_vector_in_hash, hybrid_search, search_redis_documents, get_indexed_keys_number, scan_keys], skills: [db-dev]}
  db-redis-admin-l1: {model: thinker, profile: db-redis-admin-l1, max_steps: 8, compose: [db-redis], tools: [info, dbsize, client_list, scan_keys, get_indexes, get_index_info], skills: [db-admin]}
  # db-oracle-*: wired and unit-tested only, no scratch container (unverified live)
