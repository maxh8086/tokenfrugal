# UI roles, defined but NOT dispatchable yet. No model is assigned: each role gets a model
# only after it passes its own test. To activate one, move its entry under `roles:` and add
# `model: <logical name>` once the model is chosen.
pending_roles:
  ui-components: {profile: build,   max_steps: 12, timeout_s: 120, native: [sandbox], required_tool: read_file, tools: [read_file, write_file, edit_file, run_tests], skills: [role-ui-builder], improve: gated}   # shadcn/Radix components
  ui-layout:     {profile: build,   max_steps: 12, timeout_s: 150, native: [sandbox], required_tool: read_file, tools: [read_file, write_file, edit_file, run_tests], skills: [role-ui-builder], improve: gated}   # Tailwind grids, responsive layout, motion when the spec asks
  ui-polish:     {profile: build,   max_steps: 10, timeout_s: 120, native: [sandbox], required_tool: read_file, tools: [read_file, edit_file, run_tests], skills: [role-ui-builder], improve: gated}   # spacing, shadows, the chosen aesthetic, diff-only fixes from a review
  ui-tokens:     {profile: build,   max_steps: 10, timeout_s: 90,  native: [sandbox], required_tool: read_file, tools: [read_file, write_file, edit_file], skills: [role-ui-tokens], improve: gated}                                  # CSS variables and tokens file
  ui-tokens-check: {profile: analyze, max_steps: 8, timeout_s: 60, native: [synaptree], required_tool: read_file, tools: [read_file, search_graph, ast-grep], skills: [role-ui-tokens], improve: gated}                             # read-only: raw values outside tokens
  ui-a11y-check: {profile: analyze, max_steps: 8, timeout_s: 60,  native: [synaptree], required_tool: read_file, tools: [read_file, search_graph, ast-grep], skills: [role-ui-a11y], improve: gated}                                 # read-only accessibility audit of code
  ui-review-lighthouse: {profile: browser, max_steps: 8, timeout_s: 80, required_tool: navigate_page, tools: [navigate_page, lighthouse_audit], skills: [role-ui-review], improve: gated}                                              # scores and failing audits
  ui-review-console: {profile: browser, max_steps: 8, timeout_s: 80, required_tool: navigate_page, tools: [navigate_page, take_snapshot, list_console_messages], skills: [role-ui-review], improve: gated}                                   # runtime errors and DOM checks
  ui-vision-review: {profile: browser, max_steps: 6, timeout_s: 120, required_tool: navigate_page, tools: [navigate_page, take_screenshot], skills: [role-ui-review], improve: gated}                                                       # screenshot critique (needs a vision model before activation)
  ui-webapp-test: {profile: build, max_steps: 12, timeout_s: 180, native: [sandbox], required_tool: read_file, tools: [read_file, write_file, edit_file, run_tests], skills: [role-ui-webapp-test], improve: gated}   # Playwright checks on a running app (from anthropics/skills webapp-testing, not installed yet)

# Teams: fixed membership per role (edit here, not in the UI). Each team has one lead.
# The lead and the orchestrator are cloud models run by Claude Code, so the router only records them;
# the lead chooses which role of its team to pull for a job. Override the lead or orchestrator in
# the tf_roles_ui Teams panel (writes router/tf-roles_teams.json). Models: claude-haiku-5-5, claude-sonnet-5-5,
# claude-opus-5-5, claude-fable-5-1.
orchestration:
  orchestrator: claude-sonnet-5-5   # reviews each team lead's result and gives the final answer
  team_lead: claude-haiku-5-5       # default lead for every team that does not set its own
teams:
  frontend:
    description: Frontend work. Layout, components, design tokens, accessibility checks, visual and console review, webapp tests.
    roles: [designer, browser, ui-components, ui-layout, ui-polish, ui-tokens, ui-tokens-check, ui-a11y-check, ui-review-lighthouse, ui-review-console, ui-vision-review, ui-webapp-test]
  backend-sql-dba:
    description: SQL database administration. Inspecting and operating PostgreSQL, MySQL, MSSQL and Oracle servers.
    roles: [db-postgres-admin, db-mysql-admin, db-mssql-admin, db-oracle-admin]
  backend-nosql-dba:
    description: NoSQL database administration. Inspecting and operating MongoDB, Redis and Elasticsearch servers.
    roles: [db-mongo-admin-l1, db-mongo-admin-l2, db-redis-admin-l1, db-elastic-admin]
  dev-sql:
    description: SQL database development. Queries, schemas and data changes on PostgreSQL, MySQL, MSSQL and Oracle.
    roles: [db-postgres-dev, db-mysql-dev, db-mssql-dev, db-oracle-dev]
  dev-nosql:
    description: NoSQL database development. Documents, keys, indexes and data pipelines on MongoDB, Redis and Elasticsearch.
    roles: [db-mongo-dev-l1, db-mongo-dev-l2, db-redis-dev-l1, db-redis-dev-l2, db-redis-dev-l3, db-elastic-dev, data-engineer]
  infra:
    description: Infrastructure. Devops, CI configuration and read-only GitHub and Actions access.
    roles: [devops, github-read, github-actions-read]
  orchestrator:
    description: Orchestration. Builds the change and tracks the plan status.
    roles: [builder, tracker]
  dev-coding:
    description: Coding. Writing and changing application code at each difficulty level.
    roles: [code-l1, code-l2, code-l3, code-l4, code-l5, code-l6]
  dev-analyst:
    description: Analysis. Reviewing code, analysing the codebase and debugging.
    roles: [analyzer, reviewer, debugger]
  security:
    description: Security audits and reviews.
    roles: [security]
  research:
    description: Research, finance analysis and documentation.
    roles: [research, finance, docs]

# Self-improvement gate (scripts/role_improve.py). A role may propose a diff to its own skill files.
# Nothing is applied automatically: only 'python -m scripts.role_improve approve <id>' applies one.
self_improve:
  enabled: true
  gate: approval
  scope: [skills]


# Role contracts: every active role in `roles:` has one. Read by preflight.contract_errors.
# purpose / inputs / output_format / stop_condition describe the role; checklist items are
# tagged `deterministic` (the router can check it: command exit, git state, lint, cited paths)
# or `judgement` (the client reviewer decides). Fields are validated, not used by the loop.
contracts:
  builder:
    purpose: Write or edit application source code for one named change.
    inputs: [named file paths in the workspace, the change to make, the Accept command]
    output_format: changed file paths, then the Accept result line.
    stop_condition: run_tests passes, or 4 failed attempts. 12 steps max.
    checklist:
      - {text: "Only the task's named files changed (git status).", kind: deterministic}
      - {text: "Accept command exits 0.", kind: deterministic}
      - {text: "Python files pass router.lint.check_python.", kind: deterministic}
      - {text: "The change does what the task asked and nothing more.", kind: judgement}
  data-engineer:
    purpose: Transform, load or inspect data files and pipelines.
    inputs: [input file paths, the transform, the expected output]
    output_format: output file paths and row counts.
    stop_condition: each named file reported with its row count, or 12 steps used.
    checklist:
      - {text: "Output file exists and its row count matches the task.", kind: deterministic}
      - {text: "Input files are unchanged (git status).", kind: deterministic}
      - {text: "Python files pass router.lint.check_python.", kind: deterministic}
      - {text: "The transform follows the stated rule, not a guess at it.", kind: judgement}
  analyzer:
    purpose: Explain how named code works, with file:line for every claim.
    inputs: [symbol or topic, the question]
    output_format: "one line per finding: file:line - finding."
    stop_condition: question answered, or "not found" after two searches.
    checklist:
      - {text: "Every cited file:line appears in a tool result.", kind: deterministic}
      - {text: "No file was written.", kind: deterministic}
      - {text: "Each finding answers the question asked.", kind: judgement}
  security:
    purpose: Report security issues in named code, using SonarQube results and file reads.
    inputs: [SonarQube project key, paths in scope]
    output_format: "findings as file:line - severity - issue - failing input."
    stop_condition: scope covered, or 10 steps used.
    checklist:
      - {text: "Each finding cites a file:line from a tool result.", kind: deterministic}
      - {text: "Severity matches the Sonar rule level when one exists.", kind: deterministic}
      - {text: "Each finding is a real exploit path, not a style point.", kind: judgement}
  reviewer:
    purpose: Judge a diff or file for defects.
    inputs: [diff range or file, task scope]
    output_format: "file:line - severity - problem - failing input, highest first; or 'no defects found'."
    stop_condition: diff reviewed, or 8 steps used.
    checklist:
      - {text: "Each finding cites a file:line inside the diff or the named file.", kind: deterministic}
      - {text: "Output follows the line pattern exactly.", kind: deterministic}
      - {text: "Each finding has a concrete failing input.", kind: judgement}
  debugger:
    purpose: Find the cause of one reported failure.
    inputs: [error text or failing test, the code path]
    output_format: cause as file:line, the evidence, and a one-line fix suggestion.
    stop_condition: one cause proven with evidence, or 12 steps used.
    checklist:
      - {text: "The cause cites a file:line from a tool result.", kind: deterministic}
      - {text: "No file was changed.", kind: deterministic}
      - {text: "The cause explains every symptom in the error text.", kind: judgement}
  docs:
    purpose: Write or check documentation against the code it describes.
    inputs: [doc paths, the code they describe]
    output_format: changed doc paths and a list of corrections made.
    stop_condition: doc matches the code, or 8 steps used.
    checklist:
      - {text: "Only documentation files changed.", kind: deterministic}
      - {text: "Every command or path named in the doc exists in the repo.", kind: deterministic}
      - {text: "The wording is clear to a new reader.", kind: judgement}
  designer:
    purpose: Produce or check a Penpot design through its API.
    inputs: [design file reference, the design goal]
    output_format: design changes made, with shape ids.
    stop_condition: goal met, or 10 steps used.
    checklist:
      - {text: "Every shape id in the output appears in an export_shape result.", kind: deterministic}
      - {text: "The layout meets the stated design goal.", kind: judgement}
      - {text: "The text and colours follow the design tokens in the task.", kind: judgement}
  browser:
    purpose: Load a page and report console, network and Lighthouse findings.
    inputs: [URL, checks to run]
    output_format: one line per finding with the metric or message.
    stop_condition: checks run, or 4 steps (5 if the task asks).
    checklist:
      - {text: "Each finding quotes a console, network or audit result.", kind: deterministic}
      - {text: "No form was submitted.", kind: deterministic}
      - {text: "Findings are relevant to the stated check.", kind: judgement}
  tracker:
    purpose: Read and update plan task state.
    inputs: [plan id, the task action]
    output_format: task id, new status, and evidence.
    stop_condition: action done, or 6 steps used.
    checklist:
      - {text: "A done status has evidence (git sha or finished task id).", kind: deterministic}
      - {text: "Only the named task changed.", kind: deterministic}
      - {text: "The note states what was done, not a guess.", kind: judgement}
  code-l1:
    purpose: Implement one small function to a stated spec.
    inputs: [file path, spec, Accept command]
    output_format: changed paths and the Accept result line.
    stop_condition: run_tests passes, or 8 steps used.
    checklist: &code_checklist
      - {text: "Only the named files changed (git status).", kind: deterministic}
      - {text: "Accept command exits 0.", kind: deterministic}
      - {text: "Python files pass router.lint.check_python.", kind: deterministic}
      - {text: "The change matches the spec and adds no behaviour.", kind: judgement}
  code-l2:
    purpose: Implement a function or small module, with tests.
    inputs: [file paths, spec, Accept command]
    output_format: changed paths and the Accept result line.
    stop_condition: run_tests passes, or 10 steps used.
    checklist: *code_checklist
  code-l3:
    purpose: Change several related files to a spec.
    inputs: [file paths, spec, Accept command]
    output_format: changed paths and the Accept result line.
    stop_condition: run_tests passes, or 12 steps used.
    checklist: *code_checklist
  code-l4:
    purpose: Rename or refactor one pattern across files.
    inputs: [file paths, pattern to change, Accept command]
    output_format: changed paths, match count before and after, and the Accept result line.
    stop_condition: run_tests passes, or 16 steps used.
    checklist: *code_checklist
  code-l5:
    purpose: Fix one logic bug with a reproducing test.
    inputs: [file path, bug report, Accept command]
    output_format: changed paths and the Accept result line.
    stop_condition: run_tests passes, or 14 steps used.
    checklist: *code_checklist
  code-l6:
    purpose: Make a multi-file change, with callers checked in the graph.
    inputs: [file paths, symbol, Accept command]
    output_format: changed paths, callers checked, and the Accept result line.
    stop_condition: run_tests passes, or 14 steps used.
    checklist: *code_checklist
  github-read:
    purpose: Read pull requests, issues and file contents on GitHub. Read-only.
    inputs: [repo, PR or issue number, or file path]
    output_format: read-only summary with numbers and file:line references.
    stop_condition: item read and reported, or 8 steps used.
    checklist:
      - {text: "No write action was called.", kind: deterministic}
      - {text: "Every cited PR or issue number appears in a tool result.", kind: deterministic}
      - {text: "The summary answers the question asked.", kind: judgement}
  github-actions-read:
    purpose: Read CI runs and job logs. Read-only.
    inputs: [repo, run id or workflow name]
    output_format: run status, failing job names, and log excerpt lines.
    stop_condition: failing job identified and reported, or 8 steps used.
    checklist:
      - {text: "No rerun or cancel action was called.", kind: deterministic}
      - {text: "Every job name appears in a tool result.", kind: deterministic}
      - {text: "The named failure is the cause of the failed run.", kind: judgement}
  devops:
    purpose: Edit CI, Docker, compose and config files. Not application source.
    inputs: [named config paths, the change, validation command]
    output_format: changed paths and the validation command result.
    stop_condition: validation passes, or 12 steps used.
    checklist:
      - {text: "Only CI, Docker, compose or config files changed.", kind: deterministic}
      - {text: "The validation command named in the task exits 0.", kind: deterministic}
      - {text: "The change does only what the task asked.", kind: judgement}
  finance:
    purpose: Gather public financial data with cited sources. No trades and no personal investment advice.
    inputs: [question, tickers or topics]
    output_format: figures with source URL and date.
    stop_condition: figure recorded with its source, or 8 steps used.
    checklist:
      - {text: "Every figure has a source URL from a tool result.", kind: deterministic}
      - {text: "No trade, transfer or order action was taken.", kind: deterministic}
      - {text: "Caveats about data age and quality are stated.", kind: judgement}
  research:
    purpose: Answer a question from web sources, with citations.
    inputs: [question]
    output_format: answer with numbered source URLs.
    stop_condition: 3 pages read (fewer if only 1-2 worked), or 8 steps used.
    checklist:
      - {text: "Every claim cites a numbered source URL from a tool result.", kind: deterministic}
      - {text: "The cited sources support the claim they are cited for.", kind: judgement}
      - {text: "The answer states what the sources do not cover.", kind: judgement}
