<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BusinessNext prototype recreation, 3D (v7 generator)</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/three.bundle.js"></script>
<style>
html, body { margin: 0; background: #000; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: Inter, "DejaVu Sans", sans-serif; }
.scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; overflow: hidden; }
.over { position: absolute; z-index: 5; }
.label { position: absolute; left: 140px; top: 96px; font-family: "DejaVu Sans Mono", monospace; font-size: 22px; letter-spacing: 0.2em; color: #0f766e; opacity: 0; z-index: 5; }
.head { position: absolute; left: 140px; margin: 0; font-weight: 700; font-size: 66px; line-height: 1.15; opacity: 0; z-index: 5; }
.head2 { position: absolute; left: 140px; margin: 0; font-weight: 400; font-size: 66px; line-height: 1.15; opacity: 0; z-index: 5; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">

  <!-- Scene 1: entry gateway (light) -->
  <div class="scene" id="s1" style="background: radial-gradient(ellipse at 50% 40%, #ffffff 0%, #eef1f5 100%);">
    <canvas id="c1" style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;"></canvas>
    <div class="label" id="lab1">01 · ENTRY</div>
    <p class="head" id="h1a" style="top: 150px; color: #111318;">Every request.</p>
    <p class="head2" id="h1b" style="top: 232px; color: #5b616b;">One secure gateway.</p>
  </div>

  <!-- Scene 2: understanding network (WebGL) -->
  <div class="scene" id="s2" style="background: #ffffff;">
    <canvas id="c2" style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;"></canvas>
  </div>

  <!-- Scene 3: routing ring (WebGL) -->
  <div class="scene" id="s3" style="background: #f4f6f8;">
    <canvas id="c3" style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;"></canvas>
  </div>

  <!-- Scene 4: logo end card (WebGL) -->
  <div class="scene" id="s4" style="background: #f4f6f8;">
    <canvas id="c4" style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;"></canvas>
    <div class="over" id="word4" style="left:0;width:1920px;top:560px;text-align:center;font-weight:700;font-size:92px;letter-spacing:0.12em;color:#111318;text-shadow:0 0 36px rgba(15,118,110,0.35);opacity:0;"><span style="display:inline-block;margin-left:150px;">BUSINESSNEXT</span></div>
    <div class="over" id="tag4" style="left:0;width:1920px;top:680px;text-align:center;font-size:36px;color:#5b616b;opacity:0;">Secure by design. <span style="color:#0f766e;">Measured</span> in production.</div>
  </div>

  <!-- Captions shared across scenes -->
  <div class="over" id="cap2" style="left: 140px; top: 800px; opacity: 0;">
    <div style="font-family: 'DejaVu Sans Mono', monospace; font-size: 20px; letter-spacing: 0.2em; color: #0f766e;">02 · UNDERSTANDING</div>
    <p style="margin: 14px 0 0 0; font-weight: 700; font-size: 60px; line-height: 1.15; color: #111318;">Read for meaning,<br>not keywords.</p>
  </div>
  <div class="over" id="cap3" style="left: 140px; top: 800px; opacity: 0;">
    <div style="font-family: 'DejaVu Sans Mono', monospace; font-size: 20px; letter-spacing: 0.2em; color: #0f766e;">03 · DECISION</div>
    <p style="margin: 14px 0 0 0; font-weight: 700; font-size: 60px; line-height: 1.15; color: #111318;">Routed. Traced.<br>Explained.</p>
  </div>

</div>

<script>
(function () {
  var seed = 20260405;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  function lerp3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function bez3(P0, P1, P2, P3, t) {
    var u = 1 - t, out = [];
    for (var k = 0; k < 3; k++) {
      out.push(u*u*u*P0[k] + 3*u*u*t*P1[k] + 3*u*t*t*P2[k] + t*t*t*P3[k]);
    }
    return out;
  }
  function clamp01(x) { return Math.min(Math.max(x, 0), 1); }
  function fade(t, s, d) { return clamp01((t - s) / d); }
  function fadeOut(t, s, d) { return 1 - clamp01((t - s) / d); }
  // power2.inOut, same easing the CSS version used for the cloud travel
  function ease2(x) { x = clamp01(x); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
  var D2R = Math.PI / 180;

  var tl = gsap.timeline({ paused: true });

  // Shared three.js helpers for acts 2 to 4.
  // Layout uses the old CSS-pixel coordinates (y down); world y is flipped for three.js.
  // Camera at z = 1500 with FOV 39.3 so 1 world unit = 1 CSS px on the z = 0 plane.
  var T1 = window.THREE;
  function V1(x, y, z) { return new T1.Vector3(x, -y, z); }
  function stage(id) {
    var r = new T1.WebGLRenderer({ canvas: document.getElementById(id), antialias: true, alpha: true, preserveDrawingBuffer: true });
    r.setPixelRatio(1);
    r.setSize(1920, 1080, false);
    r.setClearColor(0x000000, 0);
    var sc = new T1.Scene();
    sc.add(new T1.HemisphereLight(0xffffff, 0xc5cdd8, 1.1));
    var key = new T1.DirectionalLight(0xffffff, 1.4);
    key.position.set(-700, 1000, 900);
    sc.add(key);
    var fill = new T1.DirectionalLight(0xdfe8f5, 0.4);
    fill.position.set(900, 300, 600);
    sc.add(fill);
    var cam = new T1.PerspectiveCamera(39.3, 1920 / 1080, 10, 6000);
    cam.position.set(0, 0, 1500);
    cam.lookAt(0, 0, 0);
    // The whole act hangs off one group, rotated by the camera-move tween (same role as the CSS world element).
    var g = new T1.Group();
    sc.add(g);
    return { r: r, sc: sc, cam: cam, g: g };
  }
  var cylGeo = new T1.CylinderGeometry(1, 1, 1, 8, 1);
  var yAxis = new T1.Vector3(0, 1, 0);
  // Cylinder from A to B (CSS coords), radius in px. Used for lines and tendrils.
  function cylBetween(g, A, B, radius, mat) {
    var a = V1(A[0], A[1], A[2]), b = V1(B[0], B[1], B[2]);
    var dir = b.clone().sub(a);
    var L = dir.length();
    var m = new T1.Mesh(cylGeo, mat);
    m.position.copy(a).add(b).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(yAxis, dir.normalize());
    m.scale.set(radius, L, radius);
    g.add(m);
    return m;
  }
  function glowTex(rgba) {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    var x = c.getContext('2d');
    var gr = x.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0, rgba);
    gr.addColorStop(0.62, 'rgba(0,0,0,0)');
    x.fillStyle = gr;
    x.fillRect(0, 0, 256, 256);
    return new T1.CanvasTexture(c);
  }
  // Soft coloured glow, returned material so its opacity can be driven by time.
  function glowSprite(g, x, y, z, w, h, rgba) {
    var m = new T1.SpriteMaterial({ map: glowTex(rgba), transparent: true, depthWrite: false });
    var s = new T1.Sprite(m);
    s.position.copy(V1(x, y, z));
    s.scale.set(w, h, 1);
    g.add(s);
    return m;
  }
  // Rounded label plate, 270x74 CSS px, drawn at 2x for sharpness.
  function plateTex(txt) {
    var c = document.createElement('canvas');
    c.width = 540; c.height = 148;
    var x = c.getContext('2d');
    var rr = 16;
    x.fillStyle = '#e2e8f0';
    x.beginPath();
    x.moveTo(rr, 0); x.lineTo(540 - rr, 0); x.arcTo(540, 0, 540, rr, rr);
    x.lineTo(540, 148 - rr); x.arcTo(540, 148, 540 - rr, 148, rr);
    x.lineTo(rr, 148); x.arcTo(0, 148, 0, 148 - rr, rr);
    x.lineTo(0, rr); x.arcTo(0, 0, rr, 0, rr);
    x.closePath();
    x.fill();
    x.fillStyle = '#111318';
    x.font = '48px "DejaVu Sans Mono", monospace';
    x.textBaseline = 'middle';
    var ls = 0.16 * 48;
    var widths = txt.split('').map(function (ch) { return x.measureText(ch).width; });
    var total = widths.reduce(function (a, b) { return a + b; }, 0) + ls * (txt.length - 1);
    var px = (540 - total) / 2;
    for (var i = 0; i < txt.length; i++) {
      x.fillText(txt.charAt(i), px, 74);
      px += widths[i] + ls;
    }
    return new T1.CanvasTexture(c);
  }

  // ---------- Scene 1: entry gateway, 0.0 to 6.2 s ----------
  // WebGL (three.js) act 1: lit rounded boxes, tube lanes, contact shadows.
  var r1 = new T1.WebGLRenderer({ canvas: document.getElementById('c1'), antialias: true, alpha: true, preserveDrawingBuffer: true });
  r1.setPixelRatio(1);
  r1.setSize(1920, 1080, false);
  r1.setClearColor(0x000000, 0);
  r1.shadowMap.enabled = true;
  r1.shadowMap.type = T1.PCFSoftShadowMap;
  var sc1 = new T1.Scene();
  var cam1g = new T1.PerspectiveCamera(39.3, 1920 / 1080, 10, 6000);
  function clamp01b(x) { return Math.min(Math.max(x, 0), 1); }

  sc1.add(new T1.HemisphereLight(0xffffff, 0xc5cdd8, 1.1));
  var key1 = new T1.DirectionalLight(0xffffff, 1.6);
  key1.position.set(-700, 1000, 900);
  key1.castShadow = true;
  key1.shadow.mapSize.set(2048, 2048);
  key1.shadow.camera.left = -1100; key1.shadow.camera.right = 1100;
  key1.shadow.camera.top = 1100; key1.shadow.camera.bottom = -1100;
  key1.shadow.camera.near = 100; key1.shadow.camera.far = 3000;
  key1.shadow.radius = 6;
  key1.shadow.bias = -0.0005;
  sc1.add(key1);
  var fill1 = new T1.DirectionalLight(0xdfe8f5, 0.45);
  fill1.position.set(900, 300, 600);
  sc1.add(fill1);

  var floorMesh = new T1.Mesh(new T1.PlaneGeometry(3000, 3000), new T1.ShadowMaterial({ opacity: 0.12 }));
  floorMesh.rotation.x = -Math.PI / 2;
  floorMesh.position.y = -420;
  floorMesh.receiveShadow = true;
  sc1.add(floorMesh);

  var mBox1 = new T1.MeshStandardMaterial({ color: 0xe6eaf0, roughness: 0.55, metalness: 0.0 });
  var mGate1 = new T1.MeshStandardMaterial({ color: 0xdfe4ea, roughness: 0.5, metalness: 0.0 });
  var mEdge1 = new T1.LineBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.4 });
  function blobTex1() {
    var c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    var g = c.getContext('2d');
    var gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(15,23,42,0.45)');
    gr.addColorStop(0.6, 'rgba(15,23,42,0.12)');
    gr.addColorStop(1, 'rgba(15,23,42,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 128, 128);
    return new T1.CanvasTexture(c);
  }
  var blobMat1 = new T1.MeshBasicMaterial({ map: blobTex1(), transparent: true, depthWrite: false });
  function roundBox1(cx, cy, cz, w, h, d, rad, mat) {
    var g = new T1.RoundedBoxGeometry(w, h, d, 4, rad);
    var m = new T1.Mesh(g, mat);
    m.position.copy(V1(cx, cy, cz));
    m.castShadow = true;
    m.receiveShadow = true;
    m.add(new T1.LineSegments(new T1.EdgesGeometry(g, 28), mEdge1));
    sc1.add(m);
    var blob = new T1.Mesh(new T1.PlaneGeometry(w * 1.2, d * 1.2), blobMat1);
    blob.rotation.x = -Math.PI / 2;
    blob.position.copy(V1(cx, cy + h / 2 + 0.5, cz));
    sc1.add(blob);
    return m;
  }
  for (var i = 0; i < 6; i++) {
    roundBox1(-780 + i * 40, 330 - i * 70, 0, 250, 90, 170, 10, mBox1);
  }
  var gateCx = 560, gateCy = -40;
  roundBox1(gateCx, gateCy, 0, 340, 200, 230, 12, mGate1);

  var mRing1 = new T1.MeshStandardMaterial({ color: 0x0f766e, emissive: 0x0f766e, emissiveIntensity: 0.9, roughness: 0.4, transparent: true, opacity: 0 });
  var gateRing1 = new T1.Mesh(new T1.TorusGeometry(120, 4, 16, 128), mRing1);
  gateRing1.position.copy(V1(gateCx, gateCy - 104, 0));
  sc1.add(gateRing1);

  var mLane1 = new T1.MeshStandardMaterial({ color: 0x0f766e, emissive: 0x0f766e, emissiveIntensity: 0.25, roughness: 0.35, metalness: 0.0 });
  var mDot1 = new T1.MeshStandardMaterial({ color: 0xffffff, emissive: 0x0f766e, emissiveIntensity: 0.6, roughness: 0.3 });
  var lanes1 = [];
  for (var j = 0; j < 6; j++) {
    var bx = -780 + j * 40, by = 330 - j * 70;
    var P0 = [bx + 125, by, 0];
    var P3 = [gateCx - 170, gateCy - (j - 2.5) * 36, 0];
    var P1 = [P0[0] + 260, P0[1] - 60 - j * 6, 140 - j * 20];
    var P2 = [P3[0] - 200, P3[1] + 30, 140 - j * 20];
    var curve1 = new T1.CubicBezierCurve3(V1(P0[0], P0[1], P0[2]), V1(P1[0], P1[1], P1[2]), V1(P2[0], P2[1], P2[2]), V1(P3[0], P3[1], P3[2]));
    var tube1 = new T1.Mesh(new T1.TubeGeometry(curve1, 96, 4.5, 14, false), mLane1);
    tube1.castShadow = true;
    sc1.add(tube1);
    var dot1 = new T1.Mesh(new T1.SphereGeometry(10, 20, 14), mDot1);
    dot1.visible = false;
    sc1.add(dot1);
    lanes1.push({ curve: curve1, dot: dot1, start: 1.2 + j * 0.15 });
  }

  // One render function driven by a proxy tween, so the output is a pure function of time.
  function render1(t) {
    var k = clamp01b(t / 6.2);
    var pitch = (32 + (26 - 32) * k) * Math.PI / 180;
    var yaw = (-26 + (-14 + 26) * k) * Math.PI / 180;
    var R = 1500;
    cam1g.position.set(R * Math.cos(pitch) * Math.sin(yaw), R * Math.sin(pitch), R * Math.cos(pitch) * Math.cos(yaw));
    cam1g.lookAt(0, 0, 0);
    mRing1.opacity = clamp01b((t - 3.0) / 0.5);
    lanes1.forEach(function (ln) {
      ln.dot.visible = t >= ln.start;
      ln.dot.scale.setScalar(Math.max(clamp01b((t - ln.start) / 0.2), 0.0001));
      if (t >= ln.start) {
        var u = Math.min((t - ln.start) / 2.4, 2);
        var v = u >= 2 ? 1 : (u % 1);
        ln.dot.position.copy(ln.curve.getPoint(v));
      }
    });
    r1.render(sc1, cam1g);
  }
  var A1 = { t: 0 };
  render1(0);
  tl.to(A1, { t: 6.2, duration: 6.2, ease: 'none', onUpdate: function () { render1(A1.t); } }, 0);
  tl.to('#s1', { opacity: 1, duration: 0.5 }, 0.0);
  tl.to('#lab1', { opacity: 1, duration: 0.5 }, 0.5);
  tl.to('#h1a', { opacity: 1, duration: 0.6 }, 0.6);
  tl.to('#h1b', { opacity: 1, duration: 0.6 }, 1.0);
  tl.to('#s1', { opacity: 0, duration: 0.4 }, 6.2);

  // ---------- Scene 2: understanding network, 6.5 to 13.2 s (WebGL) ----------
  // Local time t = 0 at 6.5 s. Every element's opacity and position is a pure function of t.
  var S2 = stage('c2');
  var mSlab2 = new T1.MeshStandardMaterial({ color: 0xc9cdd3, roughness: 0.55, metalness: 0.0, transparent: true, opacity: 0 });
  var slab2 = new T1.Mesh(new T1.RoundedBoxGeometry(420, 18, 240, 4, 6), mSlab2);
  slab2.position.copy(V1(-260, -120, 0));
  S2.g.add(slab2);
  glowSprite(S2.g, 420, -260, -40, 900, 700, 'rgba(15,118,110,0.32)');

  var mRing2 = new T1.MeshStandardMaterial({ color: 0x0f766e, emissive: 0x0f766e, emissiveIntensity: 0.9, roughness: 0.4, transparent: true, opacity: 0 });
  var ring2 = new T1.Mesh(new T1.TorusGeometry(146, 4, 16, 128), mRing2);
  ring2.position.copy(V1(380, -240, 0));
  ring2.rotation.set(68 * D2R, 0, 0);
  S2.g.add(ring2);

  var nodes = [];
  for (var n = 0; n < 78; n++) {
    var hub = rnd() < 0.2;
    nodes.push({
      x: hub ? 300 + rnd() * 320 : -820 + rnd() * 1120,
      y: hub ? -120 + rnd() * 320 : -260 + rnd() * 460,
      z: (rnd() * 2 - 1) * 150,
      hub: hub
    });
  }
  var cloud = [];
  for (var c = 0; c < 220; c++) {
    cloud.push({
      start: [300 + (rnd() * 2 - 1) * 380, (rnd() * 2 - 1) * 200, (rnd() * 2 - 1) * 180],
      end: null
    });
  }
  cloud.forEach(function (cp, idx) {
    var nd = nodes[idx % nodes.length];
    cp.end = [nd.x + (rnd() - 0.5) * 30, nd.y + (rnd() - 0.5) * 30, nd.z];
  });

  var mCloud2 = new T1.MeshBasicMaterial({ color: 0x111318, transparent: true, opacity: 0 });
  var geoCloud = new T1.SphereGeometry(2, 8, 6);
  var cloudMeshes = cloud.map(function (cp) {
    var m = new T1.Mesh(geoCloud, mCloud2);
    m.position.copy(V1(cp.start[0], cp.start[1], cp.start[2]));
    S2.g.add(m);
    return m;
  });
  var geoNodeS = new T1.SphereGeometry(5, 16, 12);
  var geoNodeH = new T1.SphereGeometry(9, 20, 14);
  var nodeMeshes = nodes.map(function (nd) {
    var mat = new T1.MeshBasicMaterial({ color: nd.hub ? 0x0f766e : 0x111318, transparent: true, opacity: 0 });
    var m = new T1.Mesh(nd.hub ? geoNodeH : geoNodeS, mat);
    m.position.copy(V1(nd.x, nd.y, nd.z));
    S2.g.add(m);
    return { mesh: m, mat: mat };
  });
  var edgeMats = [];
  for (var a = 0; a < nodes.length; a++) {
    for (var b = a + 1; b < nodes.length; b++) {
      var na = nodes[a], nb = nodes[b];
      var ddx = na.x - nb.x, ddy = na.y - nb.y, ddz = na.z - nb.z;
      if (ddx * ddx + ddy * ddy + ddz * ddz < 240 * 240 && edgeMats.length < 150) {
        var emat = new T1.MeshBasicMaterial({ color: (na.hub || nb.hub) ? 0x0f766e : 0x9aa3b1, transparent: true, opacity: 0 });
        cylBetween(S2.g, [na.x, na.y, na.z], [nb.x, nb.y, nb.z], 0.8, emat);
        edgeMats.push(emat);
      }
    }
  }

  function render2(t) {
    var k = clamp01(t / 6.7);
    S2.g.rotation.set((8 + (4 - 8) * k) * D2R, (-16 + 22 * k) * D2R, 0);
    mSlab2.opacity = fade(t, 0.3, 0.6);
    mRing2.opacity = fade(t, 0.9, 0.6) * fadeOut(t, 4.1, 0.4);
    mCloud2.opacity = 0.9 * fade(t, 1.5, 0.5) * fadeOut(t, 3.2, 0.3);
    cloud.forEach(function (cp, i) {
      var q = lerp3(cp.start, cp.end, ease2((t - (1.7 + i * 0.0015)) / 1.4));
      cloudMeshes[i].position.copy(V1(q[0], q[1], q[2]));
    });
    nodeMeshes.forEach(function (o, i) { o.mat.opacity = fade(t, 2.9 + i * 0.008, 0.4); });
    edgeMats.forEach(function (mat, j) { mat.opacity = 0.4 * fade(t, 3.3 + j * 0.004, 0.6); });
    S2.r.render(S2.sc, S2.cam);
  }
  var A2 = { t: 0 };
  render2(0);
  tl.to(A2, { t: 6.7, duration: 6.7, ease: 'none', onUpdate: function () { render2(A2.t); } }, 6.5);
  tl.to('#s2', { opacity: 1, duration: 0.5 }, 6.5);
  tl.to('#cap2', { opacity: 1, duration: 0.6 }, 9.2);
  tl.to('#cap2', { opacity: 0, duration: 0.4 }, 13.6);
  tl.to('#s2', { opacity: 0, duration: 0.5 }, 12.8);

  // ---------- Scene 3: routing ring with CASE / LEAD / NO ACTION, 12.8 to 17.6 s (WebGL) ----------
  // Local time t = 0 at 12.8 s.
  var S3 = stage('c3');
  var ring3aM = new T1.MeshStandardMaterial({ color: 0x0f766e, emissive: 0x0f766e, emissiveIntensity: 0.9, roughness: 0.4, transparent: true, opacity: 0 });
  var ring3bM = new T1.MeshStandardMaterial({ color: 0x0f766e, emissive: 0x0f766e, emissiveIntensity: 0.6, roughness: 0.4, transparent: true, opacity: 0 });
  var ring3a = new T1.Mesh(new T1.TorusGeometry(325, 5, 16, 160), ring3aM);
  ring3a.position.copy(V1(0, -20, 0));
  ring3a.rotation.set(-12 * D2R, 0, 0);
  S3.g.add(ring3a);
  var ring3b = new T1.Mesh(new T1.TorusGeometry(327, 3, 16, 160), ring3bM);
  ring3b.position.copy(V1(0, -20, 0));
  ring3b.rotation.set(-12 * D2R, 58 * D2R, 0);
  S3.g.add(ring3b);

  var plateXY = [[-300, -330], [0, -360], [300, -330]];
  var labels = ['CASE', 'LEAD', 'NO ACTION'];
  var plateMats = labels.map(function (txt, k) {
    var mat = new T1.MeshBasicMaterial({ map: plateTex(txt), transparent: true, opacity: 0, depthWrite: false });
    var pm = new T1.Mesh(new T1.PlaneGeometry(270, 74), mat);
    pm.position.copy(V1(plateXY[k][0], plateXY[k][1], 60));
    S3.g.add(pm);
    return mat;
  });

  var coreP = [0, 380, 0];
  var tendrilMats = [];
  plateXY.forEach(function (pxy) {
    var P0 = [pxy[0], pxy[1] + 30, 60];
    var P1 = [pxy[0] * 0.6, pxy[1] + 280, -120];
