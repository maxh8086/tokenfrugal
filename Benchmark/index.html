const GH="https://github.com/maxh8086/tokenfrugal/blob/main/Benchmark",SRC="# TokenFrugal benchmark\n\n<!-- Maintainer note: keep this file to information that stays true over time (method, definitions, how to run). Do not put benchmark results, rankings, scores, \"best model\" claims or run counts here. Results live in index.html and explorer.html, which build_report.py generates from results/*.csv. Same rule for Benchmark/README.md and the root README.md. -->\n\nThis page describes how the benchmark works. For results, open the **[live report](https://maxh8086.github.io/tokenfrugal/Benchmark/)** (rankings, per-role leaderboards, case heatmaps) or the **[live explorer](https://maxh8086.github.io/tokenfrugal/Benchmark/explorer.html)** (filters, charts, sortable table).\n\n## Method\n\n- 16 real-world cases: 4 builder cases (code and file edits) and 12 thinker cases (read, analyse, browse).\n- Each case is run twice for a full run; a run is scored out of the total number of checks. A case counts only when its output is verified, not when the model says it is done.\n- Settings: context window set per model by the `num_ctx` policy (see [Benchmark/README.md](README.md), \"Context window and KV cache\"), temperature 0.0 (set by `LOCAL_LLM_TEMPERATURE`, default `0.0` in `router/config.py`; the same value applies to every tokenfrugal model call). Set it once in `.env` (`LOCAL_LLM_TEMPERATURE=0.0`, already in `.env.example`). The benchmark preflight fails if it is not 0.0, and the value is recorded in each run's `temperature` column.\n- Two local roles: builder and thinker. A task uses one model at a time. The roles, models and allowed tools are defined in `router/tf-roles.yaml` (currently builder `hf.co/unsloth/Qwen3.5-4B-GGUF:Q6_K`, thinker `prism-bonsai-4b-q1:latest`) and shown in the explorer.\n- Compare pass rate (%), not raw scores, because older and newer runs can have different maximums. Gaps of a case or two between runs of the same model are noise.\n- Local runs record the machine they ran on (GPU, memory) in the CSV. Cloud runs are references only: compare scores, not seconds.\n\n## Data\n\n- `results/benchmark.csv`: local runs, one row per run.\n- `results/cloud.csv`: cloud baseline runs (for example Claude Haiku), merged in at build time so the baseline stays unchanged unless a cloud run is added on purpose.\n- Column meanings: [README.md](README.md).\n- `python Benchmark/script/build_report.py` regenerates `index.html` and `explorer.html`.\n\n## Forced tool calls\n\nThe loop sends `tool_choice=\"required\"` on the first step. Ollama accepts the field but does not enforce it, so small local models can still skip tools; the loop retries. Endpoints that reject the field get it removed and retried.\n\n## Test your own model\n\nCopy a prompt into Claude Code or Codex, run from the repo root.\n\nLocal model:\n\n```text\nBenchmark the Ollama model <MODEL_TAG> on this machine for the TokenFrugal repo.\n1. Check `.env` has `LOCAL_LLM_TEMPERATURE=0.0` (copy from `.env.example`). Run `python scripts/doctor.py` and fix what it reports; run `python scripts/install_profiles.py`; start backends with scripts/mcp_up.ps1 (or .sh). Ask before installing anything.\n2. `ollama pull <MODEL_TAG>`, use a variant whose `num_ctx` follows the context policy (Benchmark/README.md, \"Context window and KV cache\").\n3. `python Benchmark/script/run_benchmark.py <MODEL_TAG> --tag <SHORT_NAME>`. If the preflight fails, apply the fix command it prints and retry once.\n4. `python Benchmark/script/build_report.py`, then show me the new row (score, pass rate, s per case) and where it ranks.\nDo not edit other rows of results/benchmark.csv. Do not commit.\n```\n\nCloud model (new baseline run):\n\n```text\nRun a new cloud baseline for TokenFrugal with model <CLOUD_MODEL> at <BASE_URL>. My key is exported in env var <ENV_VAR_NAME>; never print or store it.\n1. `python Benchmark/script/run_benchmark.py <CLOUD_MODEL> --tag <SHORT_NAME> --endpoint <BASE_URL> --api-key-env <ENV_VAR_NAME>`.\n2. Move the new row from results/benchmark.csv into results/cloud.csv (same header). Keep the existing rows in cloud.csv unchanged.\n3. `python Benchmark/script/build_report.py` and report the new row. Do not commit.\n```\n\nOptional review prompt: see [script/README.md](script/README.md).\n",RES="_31 runs x 16 cases, generated from `results/benchmark.csv` and `results/cloud.csv` by `script/build_report.py`. Each table below has its own filters (model name, size, recency, how many to show) and sortable headers; defaults show the top runs by rank (ties by pass rate)._\n\n### Ranking\n\n- Score = verified checks passed out of total checks across 16 cases.\n- Pass rate % = Score / max.\n- Builder / Thinker = the same score split by role cases.\n- s per case = mean wall seconds for one case (primary speed metric, lower = faster). It measures how long you wait for an answer, so wordy models get no credit for verbosity.\n- t/s = tokens generated per second, shown for information only; it no longer affects rank.\n- Rank = 100 x (0.6 x pass rate + 0.4 x speed), speed = ln(slowest s per case / s per case) / ln(slowest / fastest) over full local runs (the post pick score). Blank = partial run. The cloud baseline gets the same score against the local range (speed clamped to 0-1), shown for comparison and never ranked.\n- Run time = wall clock for the whole run.\n- Valid cases = cases that finished without infrastructure failure (invalid cases are excluded from speed, not from score).\n- Date = when the run happened; newer = made with newer code.\n\n<div id=\"rank-bar\"><\/div>\n\n<div id=\"rank\"><\/div>\n\n### Best model per role (local models, top 5 each)\n\nEach role is ranked only on its own cases. Each model is compared across all of its runs in the filtered set; `Runs fully passing` in the recommendation table shows how consistent it is, and `Code (git)` shows the commits that produced those runs. Ties go to more evidence, then the faster model. `Shared memory GB` above 0 means part of the model spilled off the GPU, which is slower. The Haiku cloud baseline is left out because it cannot be pulled.\n\n**Builder** (cases: `write_function`, `fix_bug`, `write_tests`, `rename_across_files`)\n\n<div id=\"rb-bar\"><\/div>\n\n<div id=\"rb\"><\/div>\n\n**Thinker** (cases: `find_symbol`, `review_sqli`, `debug_trace`, `summarize_readme`, `code_graph_search`, `list_project_files`, `read_docs_file`, `security_file_read`, `design_overview`, `browser_navigate_snapshot`, `plan_status`, `web_crawl`)\n\n<div id=\"rt-bar\"><\/div>\n\n<div id=\"rt\"><\/div>\n\n### Recommended model per role\n\nEach model is compared across all of its runs. The dot shows how far to trust it for that role:\n\n- \ud83d\udfe2 Preferred: every case of the role passes in every run, no infra flag, nothing spilled to system RAM.\n- \ud83d\udfe1 Usable: passes at least 75% of the role's checks overall, or passes everything but had an infra flag or system-RAM spill.\n- \ud83d\udd34 Not recommended: below 75% of the role's checks.\n\n**Builder**\n\n| | # | Model | Latest run | Code (git) | Runs | Runs fully passing | Role score | % | Recommendation score | Infra runs | Shared memory GB | s/case | t/s (info) | Pull command |\n|:-:|--:|---|---|---|--:|--:|--:|--:|--:|--:|--:|--:|--:|---|\n| \ud83d\udfe2 | 1 | `hf.co/unsloth/Qwen3.5-4B-GGUF:Q6_K` | 2026-10-17 | `d2becff`, `de8b586` | 2 | 2/2 | 24/24 | 100 | 93 | 0 | 0 | 19.9 | 5.5 | `ollama pull hf.co/unsloth/Qwen3.5-4B-GGUF:Q6_K` |\n| \ud83d\udfe2 | 2 | `ts-qwen3-8b-16384:latest` | 2026-10-18 | `d2becff` | 1 | 1/1 | 12/12 | 100 | 78 | 0 | 0 | 36.2 | 8.5 | `ollama pull qwen3:8b` |\n| \ud83d\udfe1 | 3 | `gemma4:e4b` | 2026-10-17 | `de8b586` | 1 | 0/1 | 11/12 | 92 | 87 | 0 | 0 | 20.5 | 11.5 | `ollama pull gemma4:e4b` |\n| \ud83d\udfe1 | 4 | `hf.co/unsloth/Qwen3.5-9B-GGUF:IQ4_XS` | 2026-10-17 | `d2becff` | 1 | 1/1 | 12/12 | 100 | 83 | 0 | 1.57 | 30.2 | 3.7 | `ollama pull hf.co/unsloth/Qwen3.5-9B-GGUF:IQ4_X function bar(id){

 const go=()=>{b.querySelectorAll("[data-f]").forEach(e=>{if(e.dataset.f!=="c")f[e.dataset.f]=e.value.trim().toLowerCase()});draw(id)};

function cutoff(n){const d=new Date();d.setDate(d.getDate()-n);return[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function table(id,cols,rows,key){

function render(id,cols,rows,key){
 const[k,dir]=S.sort[key]||[null,0];
 const h=cols.map(c=>`<th data-k="${c.k}"${c.v?' style="cursor:pointer"':""}>${c.l}${c.k===k?(dir<0?" ▼":" ▲"):""}</th>`).join("");

function topN(V,n,k){let c=0;return n?V.filter(x=>k(x).startsWith("claude-")||c++<n):V}
