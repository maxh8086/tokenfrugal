const GH="https://github.com/maxh8086/tokenfrugal/blob/main/Benchmark",SRC="# TokenFrugal benchmark\n\n<!-- Maintainer note: keep this file to information that stays true over time (method, definitions, how to run). Do not put benchmark results, rankings, scores, \"best model\" claims or run counts here. Results live in index.html and explorer.html, which build_report.py generates from results/*.csv. Same rule for Benchmark/README.md and the root README.md. -->\n\nThis page describes how the benchmark works. For results, open the **[live report](https://maxh8086.github.io/tokenfrugal/Benchmark/)** (rankings, per-role leaderboards, case heatmaps) or the **[live explorer](https://maxh8086.github.io/tokenfrugal/Benchmark/explorer.html)** (filters, charts, sortable table).\n\n## Method\n\n- 16 real-world cases: 4 builder cases (code and file edits) and 12 thinker cases (read, analyse, browse).\n- Each case is run twice for a full run; a run is scored out of the total number of checks. A case counts only when its output is verified, not when the model says it is done.\n- Settings: context window set per model by the `num_ctx` policy (see [Benchmark/README.md](README.md), \"Context window and KV cache\"), temperature 0.0 (set by `LOCAL_LLM_TEMPERATURE`, default `0.0` in `router/config.py`; the same value applies to every tokenfrugal model call). Set it once in `.env` (`LOCAL_LLM_TEMPERATURE=0.0`, already in `.env.example`). The benchmark preflight fails if it is not 0.0, and the value is recorded in each run's `temperature` column.\n- Two local roles: builder and thinker. A task uses one model at a time. The roles, models and allowed tools are defined in `router/tf-roles.yaml` (currently builder `hf.co/unsloth/Qwen3.5-4B-GGUF:Q6_K`, thinker `prism-bonsai-4b-q1:latest`) and shown in the explorer.\n- Compare pass rate (%), not raw scores, because older and newer runs can have different maximums. Gaps of a case or two between runs of the same model are noise.\n- Local runs record the machine they ran on (GPU, memory) in the CSV. Cloud runs are references only: compare scores, not seconds.\n\n## Data\n\n- `results/benchmark.csv`: local runs, one row per run.\n- `results/cloud.csv`: cloud baseline runs (for example Claude Haiku), merged in at build time so the baseline stays unchanged unless a cloud run is added on purpose.\n- Column meanings: [README.md](README.md).\n- `python Benchmark/script/build_report.py` regenerates `index.html` and `explorer.html`.\n\n## Forced tool calls\n\nThe loop sends `tool_choice=\"required\"` on the first step. Ollama accepts the field but does not enforce it, so small local models can still skip tools; the loop retries. Endpoints that reject the field get it removed and retried.\n\n## Test your own model\n\nCopy a prompt into Claude Code or Codex, run from the repo root.\n\nLocal model:\n\n```text\nBenchmark the Ollama model <MODEL_TAG> on this machine for the TokenFrugal repo.\n1. Check `.env` has `LOCAL_LLM_TEMPERATURE=0.0` (copy from `.env.example`). Run `python scripts/doctor.py` and fix what it reports; run `python scripts/install_profiles.py`; start backends with scripts/mcp_up.ps1 (or .sh). Ask before installing anything.\n2. `ollama pull <MODEL_TAG>`, use a variant whose `num_ctx` follows the context policy (Benchmark/README.md, \"Context window and KV cache\").\n3. `python Benchmark/script/run_benchmark.py <MODEL_TAG> --tag <SHORT_NAME>`. If the preflight fails, apply the fix command it prints and retry once.\n4. `python Benchmark/script/build_report.py`, then show me the new row (score, pass rate, s per case) and where it ranks.\nDo not edit other rows of results/benchmark.csv. Do not commit.\n```\n\nCloud model (new baseline run):\n\n```text\nRun a new cloud baseline for TokenFrugal with model <CLOUD_MODEL> at <BASE_URL>. My key is exported in env var <ENV_VAR_NAME>; never print or store it.\n1. `python Benchmark/script/run_benchmark.py <CLOUD_MODEL> --tag <SHORT_NAME> --endpoint <BASE_URL> --api-key-env <ENV_VAR_NAME>`.\n2. Move the new row from results/benchmark.csv into results/cloud.csv (same header). Keep the existing rows in cloud.csv unchanged.\n3. `python Benchmark/script/build_report.py` and report the new row. Do not commit.\n```\n\nOptional review prompt: see [script/README.md](script/README.md).\n",RES="_40 runs x 16 cases, generated from `results/benchmark.csv` and `results/cloud.csv` by `script/build_report.py`. Each table below has its own filters (model name, size, recency, how many to show) and sortable headers; defaults show the top runs by rank (ties by pass rate)._\n\n<details id=\"rank-desc\"><summary style=\"cursor:pointer;display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.25);font-weight:600\">Ranking <span style=\"font-weight:400;color:var(--mut)\">(click to show how ranks are set)<\/span><\/summary>\n\n- Score = verified checks passed out of total checks across the builder, thinker, hard and coding suites.\n- Pass rate % = Score / max.\n- Builder / Thinker = the same score split by role cases.\n- s per case = mean wall seconds for one case (primary speed metric, lower = faster). It measures how long you wait for an answer, so wordy models get no credit for verbosity.\n- t/s = tokens generated per second, shown for information only; it no longer affects rank.\n- Rank = position among each model's newest complete run, by total passes (most first), then median seconds per case (fastest first). The same runs benchmark.csv ranks. Cloud and partial runs are not ranked.\n- Run time = wall clock for the whole run.\n- Valid cases = cases whose status is valid on the page: a case with infrastructure failure or no tools called is not valid and is excluded from speed, not from score. Counted per case over the builder, thinker, hard and coding files.\n- Ran = cases with at least one attempt that reached the model. A case that never ran is not counted. Counted per case over the same four files, so it is out of the same total as valid cases.\n- Date = when the run happened; newer = made with newer code.\n\n<\/details>\n\n### How to choose a model\n\nEvery model is checked against four gates before its score counts. Only models that pass all four are candidates.\n\n- **Valid cases.** The run finished every case with no infrastructure failure. Partial runs are not ranked.\n- **No infra flag.** A \u26a0infra mark means the environment (backend down, timeout) affected the run, not the model. Rerun it before trusting the result.\n- **Fits in GPU memory.** Shared memory GB above 0 means part of the model ran in system RAM. It works, but it is slower and its speed is not comparable.\n- **Required tools.** A \u26a0 on a case means the model failed to call a tool that case needs. It cannot do that role, however good its pass rate.\n\n**Then compare the way the ranking does.** The Rank column weights pass rate 60% and speed 40%, with speed on a log scale so very fast models do not beat accurate ones. Pass rate is verified checks passed over total checks. Speed is t/s (tokens per second); s/case includes tool calls, so it can differ from t/s.\n\n**Check repeats.** A case that passes once and fails once is unstable. The per-case heatmap shows each repeat.\n\n**Use the dots for the choice.** Each role table shows a status dot per model. Apply the gates above before you pick a model with a green dot.\n\n<div id=\"rank-bar\"><\/div>\n\n<div id=\"rank\" class=\"tbox\"><\/div>\n\n### Recommended model per role\n\nEach role is ranked only on its own cases, because one model is pinned to both roles in a run. The case columns after Thinker are that role's cases from the same run as the score. A model is ranked for a role only from its newest run of that role, and only when every case of the role ran n=3 times. Models that do not meet this are listed under the table as not ranked. `Shared memory GB` above 0 means part of the model spilled off the GPU, which is slower. The Haiku cloud baseline is left out because it cannot be pulled.\n\nEach model is compared across all of its runs. The dot shows how far to trust it for that role:\n\n- \ud83d\udfe2 Preferred: every case of the role passes in every run, no infra flag, nothing spilled to system RAM.\n- \ud83d\udfe1 Usable: passes at least 75% of the role's checks overall, or passes everything but had an infra flag or system-RAM spill.\n- \ud83d\udd34 Not recommended: below 75% of the role's checks.\n\n**Builder**\n\n<div id=\"rb-bar\"><\/div>\n\n<div id=\"rb\" class=\"tbox\"><\/div>\n\n**Thinker**\n\n<div id=\"rt-bar\"><\/div>\n\n<div id=\"rt\" class=\"tbox\"><\/div>\n\n\n### Per team, per role (results/team_results.csv)\n\nEach active role runs n=3 on its team's task (`scripts/bench_team_tasks.py`). Infra repeats, where the compose backend did not start, are left out of the pass rate.\n\n**orchestrator** (2 roles, 4 models tested)\n\n<div id=\"tm0-bar\"><\/div>\n<div id=\"tm0\" class=\"tbox\"><\/div>\n\n**dev-nosql** (7 roles, 4 models tested)\n\n<div id=\"tm1-bar\"><\/div>\n<div id=\"tm1\" class=\"tbox\"><\/div>\n\n**dev-analyst** (3 roles, 4 models tested)\n\n<div id=\"tm2-bar\"><\/div>\n<div id=\"tm2\" class=\"tbox\"><\/div>\n\n**dev-coding** (6 roles, 4 models tested)\n\n<div id=\"tm3-bar\"><\/div>\n<div id=\"tm3\" class=\"tbox\"><\/div>\n\n**dev-sql** (4 roles, 4 models tested)\n\n<div id=\"tm4-bar\"><\/div>\n<div id=\"tm4\" class=\"tbox\"><\/div>\n\n**frontend** (2 roles, 4 models tested)\n\n<div id=\"tm5-bar\"><\/div>\n<div id=\"tm5\" class=\"tbox\"><\/div>\n\n**infra** (3 roles, 4 models tested)\n\n<div id=\"tm6-bar\"><\/div>\n<div id=\"tm6\" class=\"tbox\"><\/div>\n\n**backend-sql-dba** (4 roles, 4 models tested)\n\n<div id=\"tm7-bar\"><\/div>\n<div id=\"tm7\" class=\"tbox\"><\/div>\n\n**backend-nosql-dba** (4 roles, 4 models tested)\n\n<div id=\"tm8-bar\"><\/div>\n<div id=\"tm8\" class=\"tbox\"><\/div>\n\n**security** (1 roles, 4 models tested)\n\n<div id=\"tm9-bar\"><\/div>\n<div id=\"tm9\" class=\"tbox\"><\/div>\n\n**research** (3 roles, 4 models tested)\n\n<div id=\"tm10-bar\"><\/div>\n<div id=\"tm10\" class=\"tbox\"><\/div>\n\n\n### Hard thinker suite (5 harder cases, separate from the 48-case score)\n\nMulti-file bug, two vulnerabilities, ambiguous trace, long summary and function comparison, each run n times (`a/b` = verified runs). Run automatically after the standard benchmark (`run_benchmark.py --role builder,thinker` skips it). Results live in `results/hard_test.csv` and are joined to the models above by name; they do not change the ranking.\n\n<div id=\"hd-bar\"><\/div>\n<div id=\"hd\" class=\"tbox\"><\/div>\n\n",D=[{"model": "glm4:9b-chat-q5_K_M", "day": "2026-10-16", "params": "9B", "pb": 9.0, "hard": "", "teams": {}, "score": "1", "max": "16", "pct": 6, "tps": 5.9, "s": 11.32, "tot": 0.0, "rank": null, "valid": "16", "infra": 0.0, "git": "6e6f19e", "harness": "", "shared": "", "pull": "ollama pull glm4:9b-chat-q5_K_M", "team": "", "req": ["plan_status", "design_overview", "browser_navigate_snapshot"], "cases": {"write_function": "0/1", "fix_bug": "0/1", "write_tests": "0/1", "rename_across_files": "0/1", "find_symbol": "0/1", "review_sqli": "0/1", "debug_trace": "0/1", "summarize_readme": "0/1", "role_analyzer": "0/1", "role_data": "0/1", "role_docs": "0/1", "role_security": "0/1", "role_designer": "1/1", "role_browser": "0/1", "role_tracker": "0/1", "role_research": "0/1"}}, {"model": "ts-phi4-mini-65536:latest", "day": "2026-10-23", "params": "3.8B", "pb": 3.8, "hard": "3/15", "teams": {}, "score": "12", "max": "27", "pct": 44, "tps": 2.4, "s": 19.48, "tot": 0.0, "rank": null, "valid": "9", "infra": 36.0, "git": "e19c8d1", "harness": "", "shared": "", "pull": "ollama pull phi4-mini", "team": "", "req": ["plan_status", "design_overview", "browser_navigate_snapshot"], "cases": {"write_function": "", "fix_bug": "", "write_tests": "", "rename_across_files": "", "find_symbol": "0/3", "review_sqli": "3/3", "debug_t   {k:"pct",l:"Pass rate %",v:r=>r.pct??-1,f:r=>pctBar(r.pct)},
  {k:"day",l:"Latest run",str:1,v:r=>r.day,f:r=>r.day},

  {k:"tps",l:"t/s (info)",v:r=>r.tps||-1,f:r=>r.tps??""},
  ...cs.map(c=>({k:c,cs:1,l:c.replace(/_/g," "),v:r=>{const m=/^(\d+)\/(\d+)$/.exec(r.cases[c]||"");return m?+m[1]/+m[2]:-1},f:r=>mark(r,c)}))];
 let V=table(id,cols,R,id);V=topN(V,+f.top,r=>r.model);

}
function passDraw(id){
 const f=S.f[id],P=PASS[id],cols=[
  {k:"dot",l:"",f:r=>dotOf(r.a,r.n),fz:0,w:28},

  {k:"tps",l:"t/s (info)",v:r=>r.tps||-1,f:r=>r.tps??""},
  ...P.labels.map((c,i)=>({k:"c"+i,cs:1,l:c.replace(/_/g," "),v:r=>{const m=/^(\d+)\/(\d+)$/.exec(r.cells[i]||"");return m?+m[1]/+m[2]:-1},f:r=>/^\d+\/\d+$/.test(r.cells[i]||"")?markF(r.cells[i]):esc(r.cells[i]||"⬜ NA")}))];
 const R=P.rows.filter(r=>(!f.q||r.model.toLowerCase().includes(f.q))&&(!f.size||(r.pb!=null&&r.pb<=+f.size)));
 R.sort((x,y)=>(x.rank??1e9)-(y.rank??1e9));
 let V=table(id,cols,R,id);V=topN(V,+f.top,r=>r.model);
 render(id,cols,V,id);note(id,V.length,R.length,"models");
}

   {k:"tps",l:"t/s (info)",v:r=>r.tps||-1,f:r=>r.tps??""},
   {k:"s",l:"s/case",v:r=>r.s||1e9,f:r=>r.s||""},
   {k:"tot",l:"Run time",v:r=>r.tot||1e9,f:r=>mmss(r.tot)},
   {k:"valid",l:"Valid cases",v:r=>+r.valid||0,f:r=>r.valid||""}];
  let V=table(id,cols,R,"rank");V=topN(V,top,r=>r.model);
  render(id,cols,V,"rank");note(id,V.length,R.length,"runs");
 }
}
