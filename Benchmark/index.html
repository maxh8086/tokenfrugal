const GH="https://github.com/maxh8086/tokenfrugal/blob/main/Benchmark",SRC="# TokenFrugal benchmark\n\n<!-- Maintainer note: keep this file to information that stays true over time (method, definitions, how to run). Do not put benchmark results, rankings, scores, \"best model\" claims or run counts here. Results live in index.html and explorer.html, which build_report.py generates from results/*.csv. Same rule for Benchmark/README.md and the root README.md. -->\n\nThis page describes how the benchmark works. For results, open the **[live report](https://maxh8086.github.io/tokenfrugal/Benchmark/)** (rankings, per-role leaderboards, case heatmaps) or the **[live explorer](https://maxh8086.github.io/tokenfrugal/Benchmark/explorer.html)** (filters, charts, sortable table).\n\n## Method\n\n- 16 real-world cases: 4 builder cases (code and file edits) and 12 thinker cases (read, analyse, browse).\n- Each case is run twice for a full run; a run is scored out of the total number of checks. A case counts only when its output is verified, not when the model says it is done.\n- Settings: 16384 context, temperature 0.1.\n- Two local roles: builder (`qwen2.5-coder-yarn:3b`) and thinker (`llama3.2:3b-16k`). A task uses one model at a time. The roles, models and allowed tools are defined in `router/agents.yaml` and shown in the explorer.\n- Compare pass rate (%), not raw scores, because older and newer runs can have different maximums. Gaps of a case or two between runs of the same model are noise.\n- Local runs record the machine they ran on (GPU, memory) in the CSV. Cloud runs are references only: compare scores, not seconds.\n\n## Data\n\n- `results/benchmark.csv`: local runs, one row per run.\n- `results/cloud.csv`: cloud baseline runs (for example Claude Haiku), merged in at build time so the baseline stays unchanged unless a cloud run is added on purpose.\n- Column meanings: [README.md](README.md).\n- `python Benchmark/script/build_report.py` regenerates `index.html` and `explorer.html`.\n\n## Forced tool calls\n\nThe loop sends `tool_choice=\"required\"` on the first step. Ollama accepts the field but does not enforce it, so small local models can still skip tools; the loop retries. Endpoints that reject the field get it removed and retried.\n\n## Test your own model\n\nCopy a prompt into Claude Code or Codex, run from the repo root.\n\nLocal model:\n\n```text\nBenchmark the Ollama model <MODEL_TAG> on this machine for the TokenFrugal repo.\n1. Run `python scripts/doctor.py` and fix what it reports; run `python scripts/install_profiles.py`; start backends with scripts/mcp_up.ps1 (or .sh). Ask before installing anything.\n2. `ollama pull <MODEL_TAG>`, keep Ollama running with a 16384 context.\n3. `python Benchmark/script/run_benchmark.py <MODEL_TAG> --tag <SHORT_NAME>`. If the preflight fails, apply the fix command it prints and retry once.\n4. `python Benchmark/script/build_report.py`, then show me the new row (score, pass rate, s per case) and where it ranks.\nDo not edit other rows of results/benchmark.csv. Do not commit.\n```\n\nCloud model (new baseline run):\n\n```text\nRun a new cloud baseline for TokenFrugal with model <CLOUD_MODEL> at <BASE_URL>. My key is exported in env var <ENV_VAR_NAME>; never print or store it.\n1. `python Benchmark/script/run_benchmark.py <CLOUD_MODEL> --tag <SHORT_NAME> --endpoint <BASE_URL> --api-key-env <ENV_VAR_NAME>`.\n2. Move the new row from results/benchmark.csv into results/cloud.csv (same header). Keep the existing rows in cloud.csv unchanged.\n3. `python Benchmark/script/build_report.py` and report the new row. Do not commit.\n```\n\nOptional review prompt: see [script/README.md](script/README.md).\n",RES="_32 runs x 16 cases, generated from `results/benchmark.csv` and `results/cloud.csv` by `script/build_report.py`. Each table below has its own filters (model name, size, recency, how many to show) and sortable headers; defaults show the top runs by rank (ties by pass rate)._\n\n### Ranking\n\n- Score = verified checks passed out of total checks across 16 cases.\n- Pass rate % = Score / max.\n- Builder / Thinker = the same score split by role cases.\n- t/s = tokens generated per second (primary speed metric) = tokens out / (s per case x cases).\n- Rank = 100 x (0.6 x pass rate + 0.4 x ln(t/s) / ln(highest t/s)), over full local runs (the post pick score). Blank = partial run or cloud baseline.\n- s per case = mean seconds per case (secondary speed metric).\n- Run time = wall clock for the whole run.\n- Valid cases = cases that finished without infrastructure failure (invalid cases are excluded from speed, not from score).\n- Date = when the run happened; newer = made with newer code.\n\n<div id=\"rank-bar\"><\/div>\n\n<div id=\"rank\"><\/div>\n\n### Best model per role (local models, top 5 each)\n\nEach role is ranked only on its own cases. Only a model's newest-dated runs count (within the filtered set), so older results from earlier code never mix with current ones; `Code (git)` shows the commit that produced them. Ties go to more evidence, then the faster model. `Shared memory GB` above 0 means part of the model spilled off the GPU, which is slower. The Haiku cloud baseline is left out because it cannot be pulled.\n\n**Builder** (cases: `write_function`, `fix_bug`, `write_tests`, `rename_across_files`)\n\n<div id=\"rb-bar\"><\/div>\n\n<div id=\"rb\"><\/div>\n\n**Thinker** (cases: `find_symbol`, `review_sqli`, `debug_trace`, `summarize_readme`, `code_graph_search`, `list_project_files`, `read_docs_file`, `security_file_read`, `design_overview`, `browser_navigate_snapshot`, `plan_status`, `web_crawl`)\n\n<div id=\"rt-bar\"><\/div>\n\n<div id=\"rt\"><\/div>\n\nCharts, the legend and the roles table are in [explorer.html](explorer.html).\n\n### Builder cases (code and file edits: needs write/edit tools)\n\n<div id=\"hb-bar\"><\/div>\n\n<div id=\"hb\"><\/div>\n\n### Thinker cases (read, analyse, browse: needs read/graph/browser tools)\n\n<div id=\"ht-bar\"> doc.querySelectorAll("a[href]").forEach(a=>{const h=a.getAttribute("href");if(h&&!/^(https?:|#|explorer\.html|index\.html)/.test(h))a.href=GH+"/"+h.replace(/^\.?\//,"")});
{const loc=/^(localhost|127\.|\[::1\]|)$/.test(location.hostname),u=loc?"https://maxh8086.github.io/tokenfrugal/Benchmark/":location.href.split("#")[0],t="🚀💥 Boom! My model just took on the TokenFrugal Benchmark! 🧠🔥\n\nTry your own model using https://github.com/maxh8086/tokenfrugal shared by @vpavtekar. Share me your results below so we can see how different hardware performs!\n#LocalLLM #Ollama #TokenFrugal",e=encodeURIComponent,
x="https://twitter.com/intent/tweet?text="+e(t)+"&url="+e(u),l="https://www.linkedin.com/sharing/share-offsite/?url="+e(u);
doc.insertAdjacentHTML("beforeend","<h2>Share with friends</h2><p><a id=lnk href=\""+l+"\" target=_blank rel=noopener>Share on LinkedIn</a> | <a href=\""+x+"\" target=_blank rel=noopener>Share on X</a> | <a href=\"https://github.com/maxh8086/tokenfrugal\" target=_blank rel=noopener>GitHub repo</a></p>");const k=doc.querySelector("#lnk");if(k)k.onclick=ev=>{ev.preventDefault();window.open("/post.html","_blank","noopener")}}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cnt=(r,cs)=>{let a=0,n=0;cs.forEach(c=>{const m=/^(\d+)\/(\d+)$/.exec(r.cases[c]||"");if(m){a+=+m[1];n+=+m[2]}});return[a,n]};
const frac=(r,cs)=>{const[a,n]=cnt(r,cs);return n?a/n:-1};
const sub=(r,cs)=>{const[a,n]=cnt(r,cs);return n?a+"/"+n:"·"};
const tie=(x,y)=>(y.pct-x.pct)||((x.s||1e9)-(y.s||1e9));
const mmss=t=>t?Math.floor(t/60)+":"+String(Math.round(t%60)).padStart(2,"0"):"";
const mark=(r,c)=>{const m=/^(\d+)\/(\d+)$/.exec(r.cases[c]||"");if(!m)return"·";const f=+m[1]/+m[2];let s=f===1?"🟩":f>0?"🟨":"🟥";if(f===0&&r.req.includes(c))s+="⚠";return s};
const S={sort:{},f:{}};
const DEF={rank:"10",rb:"5",rt:"5",hb:"10",ht:"10"};
const TOPS={rank:[5,10,20,0],rb:[3,5,10,0],rt:[3,5,10,0],hb:[5,10,20,0],ht:[5,10,20,0]};
function bar(id){
 const f=S.f[id]={q:"",size:"",days:"",top:DEF[id]};
 const b=$(id+"-bar");
 b.style.cssText="display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;margin:8px 0";
 b.innerHTML=`<label>Model name <input data-f="q" placeholder="e.g. qwen, gemma" style="width:140px"></label>
 <label>Size <select data-f="size"><option value="">any</option><option value="4">up to 4B</option><option value="8">up to 8B</option><option value="14">up to 14B</option><option value="40">up to 40B</option></select></label>
 <label>Runs from <select data-f="days"><option value="">all time</option><option value="7">last 7 days</option><option value="30">last 30 days</option><option value="90">last 90 days</option></select></label>
 <label>Show <select data-f="top">${TOPS[id].map(n=>`<option value="${n}"${String(n)===DEF[id]?" selected":""}>${n?"top "+n:"all"}</option>`).join("")}</select></label>
 <button type="button">Reset</button><span data-f="c" style="color:var(--mut)"></span>`;
 const go=()=>{b.querySelectorAll("[data-f]").forEach(e=>{if(e.dataset.f!=="c")f[e.dataset.f]=e.value.trim().toLowerCase()});draw(id)};
 b.querySelectorAll("input").forEach(e=>e.addEventListener("input",go));
 b.querySelectorAll("select").forEach(e=>e.addEventListener("change",go));
 b.querySelector("button").onclick=()=>{b.querySelectorAll("input").forEach(e=>e.value="");b.querySelectorAll("select").forEach(e=>e.value=e.dataset.f==="top"?DEF[id]:"");go()};
}
function cutoff(n){const d=new Date();d.setDate(d.getDate()-n);return[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function table(id,cols,rows,key){
 const[k,dir]=S.sort[key]||[null,0],c=cols.find(c=>c.k===k);
 if(c&&c.v)rows=[...rows].sort((x,y)=>{const a=c.v(x),b=c.v(y);return(a<b?-1:a>b?1:0)*dir||tie(x,y)});
 return rows;
}
function render(id,cols,rows,key){
 const[k,dir]=S.sort[key]||[null,0];
 const h=cols.map(c=>`<th data-k="${c.k}"${c.v?' style="cursor:pointer"':""}>${c.l}${c.k===k?(dir<0?" ▼":" ▲"):""}</th>`).join("");
 const b=rows.map((r,i)=>"<tr>"+cols.map(c=>`<td>${c.f(r,i)}</td>`).join("")+"</tr>").join("");
 $(id).innerHTML=`<table><thead><tr>${h}</tr></thead><tbody>${b}</tbody></table>`;
 $(id).querySelectorAll("th[data-k]").forEach(t=>t.onclick=()=>{const c=cols.find(c=>c.k===t.dataset.k);if(!c.v)return;
  const[k0,d0]=S.sort[key]||[];S.sort[key]=[c.k,k0===c.k?-d0:(c.str?1:-1)];draw(id)});
}
const code=s=>"<code>"+esc(s)+"</code>";
function sel(id){const f=S.f[id];
 const R=D.filter(r=>r.model.startsWith("claude-")||((!f.q||r.model.toLowerCase().includes(f.q))&&(!f.size||(r.pb!=null&&r.pb<=+f.size))&&(!f.days||!r.day||r.day>=cutoff(+f.days))));
 R.sort(id==="rank"?(x,y)=>((y.comp??-1)-(x.comp??-1))||tie(x,y):tie);return R}
// Cloud baseline rows are always kept; "Show top N" counts local rows only.
function topN(V,n,k){let c=0;return n?V.filter(x=>k(x).startsWith("claude-")||c++<n):V}
function note(id,shown,total,what){$(id+"-bar").querySelector('[data-f="c"]').textContent=`Showing ${shown} of ${total} ${what}`}
function draw(id){
 const R=sel(id),top=+S.f[id].top;
 if(id==="rank"){
  const cols=[{k:"n",l:"#",f:(r,i)=>i+1},
   {k:"model",l:"Model",str:1,v:r=>r.model.toLowerCase(),f:r=>code(r.model)+(r.infra>0?" ⚠infra":"")},
   {k:"day",l:"Date",str:1,v:r=>r.day,f:r=>r.day},
   {k:"pb",l:"Params",v:r=>r.pb==null?-1:r.pb,f:r=>esc(r.params)},
   {k:"score",l:"Score",v:r=>r.score,f:r=>r.score+"/"+r.max},
   {k:"pct",l:"Pass rate %",v:r=>r.pct,f:r=>r.pct},
   {k:"b",l:"Builder",v:r=>frac(r,BC),f:r=>sub(r,BC)},
   {k:"t",l:"Thinker",v:r=>frac(r,TC),f:r=>sub(r,TC)},
   {k:"tps",l:"t/s",v:r=>r.tps||-1,f:r=>r.tps??""},
   {k:"comp",l:"Rank",v:r=>r.comp??-1,f:r=>r.comp==null?"":(r.comp*100).toFixed(1),t:"Rank = 100 x (60% pass rate + 40% speed, speed relative to the fastest full run); higher is better, and the post pick uses the same score"},
   {k:"s",l:"s per case",v:r=>r.s||1e9,f:r=>r.s||""},
   {k:"tot",l:"Run time",v:r=>r.tot||1e9,f:r=>mmss(r.tot)},
   {k:"valid",l:"Valid cases",v:r=>+r.valid||0,f:r=>r.valid||""}];
  let V=table(id,cols,R,"rank");V=topN(V,top,r=>r.model);
  render(id,cols,V,"rank");note(id,V.length,R.length,"runs");
 }else if(id==="rb"||id==="rt"){
  const cs=id==="rb"?BC:TC,newest={};
  R.forEach(r=>{if(r.day>(newest[r.model]||""))newest[r.model]=r.day});
  const agg={};
  R.forEach(r=>{const[a,n]=cnt(r,cs);if(!n||r.model.startsWith("claude-")||r.day!==newest[r.model])return;
   const m=agg[r.model]||(agg[r.model]={model:r.model,a:0,n:0,runs:0,ss:[],day:r.day,g:new Set,h:new Set,r});
   m.a+=a;m.n+=n;m.runs++;m.g.add(r.git);m.h.add(r.harness);if(r.s)m.ss.push(r.s)});
  const L=Object.values(agg).map(m=>({...m,pct:Math.round(100*m.a/m.n),s:m.ss.length?m.ss.reduce((x,y)=>x+y)/m.ss.length:0}));
  L.sort((x,y)=>(y.a/y.n-x.a/x.n)||(y.n-x.n)||((y.tps||0)-(x.tps||0))||((x.s||1e9)-(y.s||1e9)));
  const rc=[{k:"n",l:"#",f:(m,i)=>i+1},
   {k:"model",l:"Model",str:1,v:m=>m.model.toLowerCase(),f:m=>code(m.model)},
   {k:"day",l:"Date",str:1,v:m=>m.day,f:m=>m.day},
   {k:"g",l:"Code (git)",f:m=>[...m.g].filter(Boolean).map(code).join(", ")},
   {k:"h",l:"Harness",f:m=>[...m.h].filter(Boolean).join(", ")||"-"},
   {k:"a",l:"Role score",v:m=>m.a/m.n,f:m=>m.a+"/"+m.n},
   {k:"pct",l:"%",v:m=>m.pct,f:m=>m.pct},
   {k:"runs",l:"Runs",v:m=>m.runs,f:m=>m.runs},
   {k:"tps",l:"t/s",v:m=>m.tps||-1,f:m=>m.tps==null?"":m.tps.toFixed(1)},
   {k:"s",l:"s/case",v:m=>m.s||1e9,f:m=>m.s?m.s.toFixed(1):""},
   {k:"sh",l:"Shared memory GB",f:m=>m.r.shared||""},
   {k:"pull",l:"Pull command",f:m=>code(m.r.pull)}];
  const[k,d]=S.sort[id]||[],c=rc.find(c=>c.k===k);
  let V=c&&c.v?[...L].sort((x,y)=>{const a=c.v(x),b=c.v(y);return(a<b?-1:a>b?1:0)*d}):L;
  const all=V.length;V=topN(V,top,m=>m.model);
  render(id,rc,V,id);note(id,V.length,all,"local models");
 }else{
  const cs=id==="hb"?BC:TC;
  const hc=[{k:"model",l:"Run",str:1,v:r=>r.model.toLowerCase(),f:r=>code(r.model.slice(0,44))+" <small>"+r.day+"</small>"},
   {k:"pct",l:"%",v:r=>frac(r,cs),f:r=>sub(r,cs)}]
   .concat(cs.map(c=>({k:c,l:c.replace(/_/g," "),v:r=>{const m=/^(\d+)\/(\d+)$/.exec(r.cases[c]||"");return m?+m[1]/+m[2]:-1},f:r=>mark(r,c)})));
  let V=table(id,hc,R,id);V=topN(V,top,r=>r.model);
  render(id,hc,V,id);note(id,V.length,R.length,"runs");
 }
}
["rank","rb","rt","hb","ht"].forEach(id=>{bar(id);draw(id)});
el.querySelectorAll("a[href]").forEach(a=>{const h=a.getAttribute("href");if(h&&!/^(https?:|#|explorer\.html)/.test(h))a.href=GH+"/"+h.replace(/^\.?\//,"")});
</script>
