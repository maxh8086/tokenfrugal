const GH="https://github.com/maxh8086/tokenfrugal/blob/main/Benchmark",SRC="# TokenFrugal benchmark\n\n<!-- Maintainer note: keep this file to information that stays true over time (method, definitions, how to run). Do not put benchmark results, rankings, scores, \"best model\" claims or run counts here. Results live in index.html and explorer.html, which build_report.py generates from results/*.csv. Same rule for Benchmark/README.md and the root README.md. -->\n\nThis page describes how the benchmark works. For results, open the **[live report](https://maxh8086.github.io/tokenfrugal/Benchmark/)** (rankings, per-role leaderboards, case heatmaps) or the **[live explorer](https://maxh8086.github.io/tokenfrugal/Benchmark/explorer.html)** (filters, charts, sortable table).\n\n## Method\n\n- 16 real-world cases: 4 builder cases (code and file edits) and 12 thinker cases (read, analyse, browse).\n- Each case is run twice for a full run; a run is scored out of the total number of checks. A case counts only when its output is verified, not when the model says it is done.\n- Settings: context window set per model by the `num_ctx` policy (see [Benchmark/README.md](README.md), \"Context window and KV cache\"), temperature 0.0 (set by `LOCAL_LLM_TEMPERATURE`, default `0.0` in `router/config.py`; the same value applies to every tokenfrugal model call). Set it once in `.env` (`LOCAL_LLM_TEMPERATURE=0.0`, already in `.env.example`). The benchmark preflight fails if it is not 0.0, and the value is recorded in each run's `temperature` column.\n- Two local roles: builder and thinker. A task uses one model at a time. The roles, models and allowed tools are defined in `router/tf-roles.yaml` (currently builder `hf.co/unsloth/Qwen3.5-4B-GGUF:Q6_K`, thinker `prism-bonsai-4b-q1:latest`) and shown in the explorer.\n- Compare pass rate (%), not raw scores, because older and newer runs can have different maximums. Gaps of a case or two between runs of the same model are noise.\n- Local runs record the machine they ran on (GPU, memory) in the CSV. Cloud runs are references only: compare scores, not seconds.\n\n## Data\n\n- `results/benchmark.csv`: local runs, one row per run.\n- `results/cloud.csv`: cloud baseline runs (for example Claude Haiku), merged in at build time so the baseline stays unchanged unless a cloud run is added on purpose.\n- Column meanings: [README.md](README.md).\n- `python Benchmark/script/build_report.py` regenerates `index.html` and `explorer.html`.\n\n## Forced tool calls\n\nThe loop sends `tool_choice=\"required\"` on the first step. Ollama accepts the field but does not enforce it, so small local models can still skip tools; the loop retries. Endpoints that reject the field get it removed and retried.\n\n## Test your own model\n\nCopy a prompt into Claude Code or Codex, run from the repo root.\n\nLocal model:\n\n```text\nBenchmark the Ollama model <MODEL_TAG> on this machine for the TokenFrugal repo.\n1. Check `.env` has `LOCAL_LLM_TEMPERATURE=0.0` (copy from `.env.example`). Run `python scripts/doctor.py` and fix what it reports; run `python scripts/install_profiles.py`; start backends with scripts/mcp_up.ps1 (or .sh). Ask before installing anything.\n2. `ollama pull <MODEL_TAG>`, use a variant whose `num_ctx` follows the context policy (Benchmark/README.md, \"Context window and KV cache\").\n3. `python Benchmark/script/run_benchmark.py <MODEL_TAG> --tag <SHORT_NAME>`. If the preflight fails, apply the fix command it prints and retry once.\n4. `python Benchmark/script/build_report.py`, then show me the new row (score, pass rate, s per case) and where it ranks.\nDo not edit other rows of results/benchmark.csv. Do not commit.\n```\n\nCloud model (new baseline run):\n\n```text\nRun a new cloud baseline for TokenFrugal with model <CLOUD_MODEL> at <BASE_URL>. My key is exported in env var <ENV_VAR_NAME>; never print or store it.\n1. `python Benchmark/script/run_benchmark.py <CLOUD_MODEL> --tag <SHORT_NAME> --endpoint <BASE_URL> --api-key-env <ENV_VAR_NAME>`.\n2. Move the new row from results/benchmark.csv into results/cloud.csv (same header). Keep the existing rows in cloud.csv unchanged.\n3. `python Benchmark/script/build_report.py` and report the new row. Do not commit.\n```\n\nOptional review prompt: see [script/README.md](script/README.md).\n",RES="_13 runs x 16 cases, generated from `results/benchmark.csv` and `results/cloud.csv` by `script/build_report.py`. Each table below has its own filters (model name, size, recency, how many to show) and sortable headers; defaults show the top runs by rank (ties by pass rate)._\n\n### Ranking\n\n- Score = verified checks passed out of total checks across 16 cases.\n- Pass rate % = Score / max.\n- Builder / Thinker = the same score split by role cases.\n- s per case = mean wall seconds for one case (primary speed metric, lower = faster). It measures how long you wait for an answer, so wordy models get no credit for verbosity.\n- t/s = tokens generated per second, shown for information only; it no longer affects rank.\n- Rank = 100 x (0.6 x pass rate + 0.4 x speed), speed = ln(slowest s per case / s per case) / ln(slowest / fastest) over full local runs (the post pick score). Blank = partial run. The cloud baseline gets the same score against the local range (speed clamped to 0-1), shown for comparison and never ranked.\n- Run time = wall clock for the whole run.\n- Valid cases = cases that finished without infrastructure failure (invalid cases are excluded from speed, not from score).\n- Date = when the run happened; newer = made with newer code.\n\n<div id=\"rank-bar\"><\/div>\n\n<div id=\"rank\"><\/div>\n\n### Best model per role (local models, top 5 each)\n\nEach role is ranked only on its own cases, because one model is pinned to both roles in a run. Each model is compared across all of its runs in the filtered set. `Runs` shows how many runs it has. `Shared memory GB` above 0 means part of the model spilled off the GPU, which is slower. The Haiku cloud baseline is left out because it cannot be pulled.\n\n**Builder** (cases: `write_function`, `fix_bug`, `write_tests`, `rename_across_files`)\n\n<div id=\"rb-bar\"><\/div>\n\n<div id=\"rb\"><\/div>\n\n**Thinker** (cases: `find_symbol`, `review_sqli`, `debug_trace`, `summarize_readme`, `code_graph_search`, `list_project_files`, `read_docs_file`, `security_file_read`, `design_overview`, `browser_navigate_snapshot`, `plan_status`, `web_crawl`)\n\n<div id=\"rt-bar\"><\/div>\n\n<div id=\"rt\"><\/div>\n\n### Recommended model per role\n\nEach model is compared across all of its runs. The dot shows how far to trust it for that role:\n\n- \ud83d\udfe2 Preferred: every case of the role passes in every run, no infra flag, nothing spilled to system RAM.\n- \ud83d\udfe1 Usable: passes at least 75% of the role's checks overall, or passes everything but had an infra flag or system-RAM spill.\n- \ud83d\udd34 Not recommended: below 75% of the role's checks.\n\n**Builder**\n\n| | # | Model | Latest run | Runs | Score | % | Rank | Shared memory GB | s/case | t/s (info) |\n|:-:|--:|---|---|--:|--:|--:|--:|--:|--:|--:|\n| \ud83d\udfe2 | 1 | `ts-gemma4-e4b-65536:latest` | 2026-10-21 | 1 | 12/12 | 100 | 100 | 0 | 18.3 | 11.2 |\n| \ud83d\udfe1 | 2 | `ts-granite4-micro-65536:latest` | 2026-10-21 | 1 | 9/12 | 75 | 79 | 0 | 22.3 | 2.9 |\n| \ud83d\udd34 | 3 | `ts-qwen3-5-9b-iq4xs-65536:latest` | 2026-10-20 | 1 | 8/12 | 67 | 42 | 0 | 61.2 | 2.1 |\n| \ud83d\udd34 | 4 | `ts-granite3-3-8b-65536:latest` | 2026-10-21 | 1 | 3/12 | 25 | 36 | 0 | 33.2 | 2.4 |\n| \ud83d\udd34 | 5 | `ts-lfm2-5-thinking-1-2b-65536:latest` | 2026-10-21 | 1 | 3/12 | 25 | 36 | 0 | 33.2 | 25.2 |\n| \u2601\ufe0f | ref | `claude-haiku-5-5` (cloud reference, not ranked) | | | 8/8 | 100 | 100 | | | |\n\n<details><summary>Show the other 6 models<\/summary>\n\n| | # | Model | Latest run | Runs | Score | % | Rank | Shared memory GB | s/case | t/s (info) |\n|:-:|--:|---|---|--:|--:|--:|--:|--:|--:|--:|\n| \ud83d\udd34 | 6 | ` 5/36 | 42 | 38 | 0 | 42.3 | 2.3 |\n| \ud83d\udd34 | 9 | `ts-qwen3-5-9b-iq4xs-65536:latest` | 2026-10-20 | 1 | 22/36 | 61 | 38 | 0 | 61.2 | 2.1 |\n| \ud83d\udd34 | 10 | `ts-llama3-2-1b-65536:latest` | 2026-10-20 | 1 | 9/36 | 25 | 18 | 0 | 58.8 | 4.4 |\n| \ud83d\udd34 | 11 | `ts-deepseek-r1-distill-qwen-7b-65536:latest` | 2026-10-20 | 1 | 7/36 | 19 | 17 | 0 | 54.5 | 7.0 |\n\n<\/details>\n\n- **Builder:** 1 preferred choice:\n  - \ud83d\udfe2 `ts-gemma4-e4b-65536:latest` \u2014 pull: `ollama pull gemma4:e4b`\n- **Thinker:** no model passes every case in every run without flags, so these are the best available:\n  - \ud83d\udfe1 `ts-gemma4-e4b-65536:latest` \u2014 pull: `ollama pull gemma4:e4b`\n  - \ud83d\udfe1 `ts-granite4-micro-65536:latest` \u2014 pull: `ollama pull granite4:micro`\n  - \ud83d\udd34 `ts-lfm2-5-thinking-1-2b-65536:latest` \u2014 pull: `ollama pull lfm2.5-thinking:1.2b`\n\n### Hard thinker suite (5 harder cases, separate from the 48-case score)\n\nMulti-file bug, two vulnerabilities, ambiguous trace, long summary and function comparison, each run n times (`a/b` = verified runs). Run automatically after the standard benchmark (`run_benchmark.py --no-hard` skips it). Results live in `results/hard_test.csv` and are joined to the models above by name; they do not change the ranking.\n\n| Model | Hard score | multifile_bug | two_vulns | ambiguous_trace | long_summary | compare_functions | median s/case |\n|---|---|---|---|---|---|---|---|\n| `ts-gemma4-e4b-65536:latest` | 15/15 | \ud83d\udfe9 3/3 | \ud83d\udfe9 3/3 | \ud83d\udfe9 3/3 | \ud83d\udfe9 3/3 | \ud83d\udfe9 3/3 | 19 |\n| `ts-granite4-micro-65536:latest` | 14/15 | \ud83d\udfe9 3/3 | \ud83d\udfe8 2/3 | \ud83d\udfe9 3/3 | \ud83d\udfe9 3/3 | \ud83d\udfe9 3/3 | 20 |\n| `claude-haiku-5-5` | 14/15 | \ud83d\udfe9 3/3 | \ud83d\udfe9 3/3 | \ud83d\udfe9 3/3 | \ud83d\udfe8 2/3 | \ud83d\udfe9 3/3 | 24 |\n| `ts-qwen3-5-9b-iq4xs-65536:latest` | 12/15 | \ud83d\udfe9 3/3 | \ud83d\udfe8 2/3 | \ud83d\udfe8 2/3 | \u    .concat(cs.map(c=>({k:c,l:c.replace(/_/g," "),v:r=>{const m=/^(\d+)\/(\d+)$/.exec(r.cases[c]||"");return m?+m[1]/+m[2]:-1},f:r=>mark(r,c)})));
  let V=table(id,hc,R,id);V=topN(V,top,r=>r.model);
  render(id,hc,V,id);note(id,V.length,R.length,"runs");
 }
}
