const GH="https://github.com/maxh8086/tokenfrugal/blob/main/Benchmark",SRC="# TokenFrugal benchmark\n\n<!-- Maintainer note: keep this file to information that stays true over time (method, definitions, how to run). Do not put benchmark results, rankings, scores, \"best model\" claims or run counts here. Results live in index.html and explorer.html, which build_report.py generates from results/*.csv. Same rule for Benchmark/README.md and the root README.md. -->\n\nThis page describes how the benchmark works. For results, open the **[live report](https://maxh8086.github.io/tokenfrugal/Benchmark/)** (rankings, per-role leaderboards, case heatmaps) or the **[live explorer](https://maxh8086.github.io/tokenfrugal/Benchmark/explorer.html)** (filters, charts, sortable table).\n\n## Method\n\n- 16 real-world cases: 4 builder cases (code and file edits) and 12 thinker cases (read, analyse, browse).\n- Each case is run twice for a full run; a run is scored out of the total number of checks. A case counts only when its output is verified, not when the model says it is done.\n- Settings: context window set per model by the `num_ctx` policy (see [Benchmark/README.md](README.md), \"Context window and KV cache\"), temperature 0.0 (set by `LOCAL_LLM_TEMPERATURE`, default `0.0` in `router/config.py`; the same value applies to every tokenfrugal model call). Set it once in `.env` (`LOCAL_LLM_TEMPERATURE=0.0`, already in `.env.example`). The benchmark preflight fails if it is not 0.0, and the value is recorded in each run's `temperature` column.\n- Two local roles: builder and thinker. A task uses one model at a time. The roles, models and allowed tools are defined in `router/tf-roles.yaml` (currently builder `hf.co/unsloth/Qwen3.5-4B-GGUF:Q6_K`, thinker `prism-bonsai-4b-q1:latest`) and shown in the explorer.\n- Compare pass rate (%), not raw scores, because older and newer runs can have different maximums. Gaps of a case or two between runs of the same model are noise.\n- Local runs record the machine they ran on (GPU, memory) in the CSV. Cloud runs are references only: compare scores, not seconds.\n\n## Data\n\n- `results/benchmark.csv`: local runs, one row per run.\n- `results/cloud.csv`: cloud baseline runs (for example Claude Haiku), merged in at build time so the baseline stays unchanged unless a cloud run is added on purpose.\n- Column meanings: [README.md](README.md).\n- `python Benchmark/script/build_report.py` regenerates `index.html` and `explorer.html`.\n\n## Forced tool calls\n\nThe loop sends `tool_choice=\"required\"` on the first step. Ollama accepts the field but does not enforce it, so small local models can still skip tools; the loop retries. Endpoints that reject the field get it removed and retried.\n\n## Test your own model\n\nCopy a prompt into Claude Code or Codex, run from the repo root.\n\nLocal model:\n\n```text\nBenchmark the Ollama model <MODEL_TAG> on this machine for the TokenFrugal repo.\n1. Check `.env` has `LOCAL_LLM_TEMPERATURE=0.0` (copy from `.env.example`). Run `python scripts/doctor.py` and fix what it reports; run `python scripts/install_profiles.py`; start backends with scripts/mcp_up.ps1 (or .sh). Ask before installing anything.\n2. `ollama pull <MODEL_TAG>`, use a variant whose `num_ctx` follows the context policy (Benchmark/README.md, \"Context window and KV cache\").\n3. `python Benchmark/script/run_benchmark.py <MODEL_TAG> --tag <SHORT_NAME>`. If the preflight fails, apply the fix command it prints and retry once.\n4. `python Benchmark/script/build_report.py`, then show me the new row (score, pass rate, s per case) and where it ranks.\nDo not edit other rows of results/benchmark.csv. Do not commit.\n```\n\nCloud model (new baseline run):\n\n```text\nRun a new cloud baseline for TokenFrugal with model <CLOUD_MODEL> at <BASE_URL>. My key is exported in env var <ENV_VAR_NAME>; never print or store it.\n1. `python Benchmark/script/run_benchmark.py <CLOUD_MODEL> --tag <SHORT_NAME> --endpoint <BASE_URL> --api-key-env <ENV_VAR_NAME>`.\n2. Move the new row from results/benchmark.csv into results/cloud.csv (same header). Keep the existing rows in cloud.csv unchanged.\n3. `python Benchmark/script/build_report.py` and report the new row. Do not commit.\n```\n\nOptional review prompt: see [script/README.md](script/README.md).\n",RES="_40 runs x 16 cases, generated from `results/benchmark.csv` and `results/cloud.csv` by `script/build_report.py`. Each table below has its own filters (model name, size, recency, how many to show) and sortable headers; defaults show the top runs by rank (ties by pass rate)._\n\n<details id=\"rank-desc\"><summary style=\"cursor:pointer;display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.25);font-weight:600\">&#9656; Ranking <span style=\"font-weight:400;color:var(--mut)\">(click to show how ranks are set)<\/span><\/summary>\n\n- Score = verified checks passed out of total checks across the builder, thinker, hard and coding suites.\n- Pass rate % = Score / max.\n- Builder / Thinker = the same score split by role cases.\n- s per case = mean wall seconds for one case (primary speed metric, lower = faster). It measures how long you wait for an answer, so wordy models get no credit for verbosity.\n- t/s = tokens generated per second, shown for information only; it no longer affects rank.\n- Rank = position among each model's newest complete run, by total passes (most first), then median seconds per case (fastest first). The same runs benchmark.csv ranks. Cloud and partial runs are not ranked.\n- Run time = wall clock for the whole run.\n- Valid cases = cases whose status is valid on the page: a case with infrastructure failure or no tools called is not valid and is excluded from speed, not from score. Counted per case over the builder, thinker, hard and coding files.\n- Ran = cases with at least one attempt that reached the model. A case that never ran is not counted. Counted per case over the same four files, so it is out of the same total as valid cases.\n- Date = when the run happened; newer = made with newer code.\n\n<\/details>\n\n<div id=\"rank-bar\"><\/div>\n\n<div id=\"rank\"><\/div>\n\n### Best model per role (local models, top 5 each)\n\nEach role is ranked only on its own cases, because one model is pinned to both roles in a run. A model is ranked for a role only from its newest run of that role, and only when every case of the role ran n=3 times. Models that do not meet this are listed under the table as not ranked. `Shared memory GB` above 0 means part of the model spilled off the GPU, which is slower. The Haiku cloud baseline is left out because it cannot be pulled.\n\n**Builder** (cases: `write_function`, `fix_bug`, `write_tests`, `rename_across_files`)\n\n<div id=\"rb-bar\"><\/div>\n\n<div id=\"rb\"><\/div>\n\n**Thinker** (cases: `find_symbol`, `review_sqli`, `debug_trace`, `summarize_readme`, `role_analyzer`, `role_data`, `role_docs`, `role_security`, `role_designer`, `role_browser`, `role_tracker`, `role_research`)\n\n<div id=\"rt-bar\"><\/div>\n\n<div id=\"rt\"><\/div>\n\n### Best model per team\n\nEach team is scored through the families its roles use: builder roles on the builder cases, thinker roles on the thinker cases. Hard and coding scores are not mapped to a team. Picks follow the same rule as the role tables above.\n\n**ui-ux**: UI and UX work. Layout, components, design tokens, accessibility checks, visual and console review, webapp tests.\n\n- thinker, 2 role(s): best available (none green): `granite4:tiny-h`, `hermes3:8b`, `nemotron-3-nano:4b`\n- 10 role(s) have no model yet, not scored\n\n**development**: Coding and development. Writing and reviewing code, debugging, analysis, data engineering and database development.\n\n- builder, 18 role(s): recommended: `granite4:tiny-h`, `hf.co/bandtor/gemma-4-E4B-it-GGUF:latest`, `hf.co/unsloth/Qwen3.5-4B-GGUF:Q6_K`\n- thinker, 3 role(s): best available (none green): `granite4:tiny-h`, `hermes3:8b`, `nemotron-3-nano:4b`\n\n**ops**: Operations. Devops, task tracking, GitHub read-only access, and database administration.\n\n- builder, 1 role(s): recommended: `granite4:tiny-h`, `hf.co/bandtor/gemma-4-E4B-it-GGUF:latest`, `hf.co/unsloth/Qwen3.5-4B-GGUF:Q6_K`\n- thinker, 11 role(s): best available (none green): `granite4:tiny-h`, `hermes3:8b`, `nemotron-3-nano:4b`\n\n**security**: Security audits and reviews.\n\n- thinker, 1 role(s): best available (none green): `granite4:tiny-h`, `hermes3:8b`, `nemotron-3-nano:4b`\n\n**research**: Research, finance analysis and documentation.\n\n- thinker, 3 role(s): best available (none green): `granite4:tiny-h`, `hermes3:8b`, `nemotron-3-nano:4b`\n\n\n### Per team, per role (results/team_results.csv)\n\nEach active role runs n=3 on its team's task (`scripts/bench_team_tasks.py`). Infra repeats, where the compose backend did not start, are left out of the pass rate.\n\n**development** (21 roles)\n\n| Role | Model | Runs | Passed | Infra | Pass rate % | Mean s/case (warm) | Failure |\n|---|---|--:|--:|--:|--:|--:|---|\n| `builder` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 12.6 |  |\n| `data-engineer` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 8.4 |  |\n| `analyzer` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 24.1 |  |\n| `reviewer` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 16.0 |  |\n| `debugger` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 30.8 |  |\n| `code-l1` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 9.6 |  |\n| `code-l2` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 8.8 |  |\n| `code-l3` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 9.8 |  |\n| `code-l4` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 7.8 |  |\n| `code-l5` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 10.4 |  |\n| `code-l6` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 11.0 |  |\n| `db-postgres-dev` | `maternion/spark-x2.5:4b-q8_0` | 3 | \u2b1c NA | 3 |  |  | infra: compose backend did not start |\n| `db-mysql-dev` | `maternion/spark-x2.5:4b-q8_0` | 3 | \u2b1c NA | 3 |  |  | infra: compose backend did not start |\n| `db-mssql-dev` | `maternion/spark-x2.5:4b-q8_0` | 3 | \u2b1c NA | 3 |  |  | infra: compose backend did not start |\n| `db-oracle-dev` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 7.6 |  |\n| `db-elastic-dev` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 29.4 |  |\n| `db-mongo-dev-l1` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe7 2/3 | 0 | 67 | 144.4 | [760e53197d] FAILED (db-mongo-dev-l1/maternion/spark-x2.5:4b-q8_0) reason=timeou |\n| `db-mongo-dev-l2` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe5 0/3 | 0 | 0 |  | [115831f39a] FAILED (db-mongo-dev-l2/maternion/spark-x2.5:4b-q8_0) reason=timeou |\n| `db-redis-dev-l1` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 87.7 |  |\n| `db-redis-dev-l2` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe7 1/2 | 1 | 50 |  | [7c6c581719] FAILED (db-redis-dev-l2/maternion/spark-x2.5:4b-q8_0) reason=timeou |\n| `db-redis-dev-l3` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 21.8 |  |\n\n**ui-ux** (2 roles)\n\n| Role | Model | Runs | Passed | Infra | Pass rate % | Mean s/case (warm) | Failure |\n|---|---|--:|--:|--:|--:|--:|---|\n| `designer` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 41.6 |  |\n| `browser` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 47.9 |  |\n\n**ops** (12 roles)\n\n| Role | Model | Runs | Passed | Infra | Pass rate % | Mean s/case (warm) | Failure |\n|---|---|--:|--:|--:|--:|--:|---|\n| `devops` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\udfe9 3/3 | 0 | 100 | 29.0 |  |\n| `tracker` | `maternion/spark-x2.5:4b-q8_0` | 3 | \ud83d\ud    .concat(cs.map(c=>({k:c,l:c.replace(/_/g," "),v:r=>{const m=/^(\d+)\/(\d+)$/.exec(r.cases[c]||"");return m?+m[1]/+m[2]:-1},f:r=>mark(r,c)})));
  let V=table(id,hc,R,id);V=topN(V,top,r=>r.model);
  render(id,hc,V,id);note(id,V.length,R.length,"runs");
 }
}
