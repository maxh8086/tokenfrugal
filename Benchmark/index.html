const GH="https://github.com/maxh8086/tokenfrugal/blob/main/Benchmark",SRC="# TokenFrugal benchmark\n\n<!-- Maintainer note: keep this file to information that stays true over time (method, definitions, how to run). Do not put benchmark results, rankings, scores, \"best model\" claims or run counts here. Results live in index.html and explorer.html, which build_report.py generates from results/*.csv. Same rule for Benchmark/README.md and the root README.md. -->\n\nThis page describes how the benchmark works. For results, open the **[live report](https://maxh8086.github.io/tokenfrugal/Benchmark/)** (rankings, per-role leaderboards, case heatmaps) or the **[live explorer](https://maxh8086.github.io/tokenfrugal/Benchmark/explorer.html)** (filters, charts, sortable table).\n\n## Method\n\n- 16 real-world cases: 4 builder cases (code and file edits) and 12 thinker cases (read, analyse, browse).\n- Each case is run twice for a full run; a run is scored out of the total number of checks. A case counts only when its output is verified, not when the model says it is done.\n- Settings: 16384 context, temperature 0.1.\n- Two local roles: builder (`qwen2.5-coder-yarn:3b`) and thinker (`llama3.2:3b-16k`). A task uses one model at a time. The roles, models and allowed tools are defined in `router/agents.yaml` and shown in the explorer.\n- Compare pass rate (%), not raw scores, because older and newer runs can have different maximums. Gaps of a case or two between runs of the same model are noise.\n- Local runs record the machine they ran on (GPU, memory) in the CSV. Cloud runs are references only: compare scores, not seconds.\n\n## Data\n\n- `results/benchmark.csv`: local runs, one row per run.\n- `results/cloud.csv`: cloud baseline runs (for example Claude Haiku), merged in at build time so the baseline stays unchanged unless a cloud run is added on purpose.\n- Column meanings: [README.md](README.md).\n- `python Benchmark/script/build_report.py` regenerates `index.html` and `explorer.html`.\n\n## Forced tool calls\n\nThe loop sends `tool_choice=\"required\"` on the first step. Ollama accepts the field but does not enforce it, so small local models can still skip tools; the loop retries. Endpoints that reject the field get it removed and retried.\n\n## Test your own model\n\nCopy a prompt into Claude Code or Codex, run from the repo root.\n\nLocal model:\n\n```text\nBenchmark the Ollama model <MODEL_TAG> on this machine for the TokenFrugal repo.\n1. Run `python scripts/doctor.py` and fix what it reports; run `python scripts/install_profiles.py`; start backends with scripts/mcp_up.ps1 (or .sh). Ask before installing anything.\n2. `ollama pull <MODEL_TAG>`, keep Ollama running with a 16384 context.\n3. `python Benchmark/script/run_benchmark.py <MODEL_TAG> --tag <SHORT_NAME>`. If the preflight fails, apply the fix command it prints and retry once.\n4. `python Benchmark/script/build_report.py`, then show me the new row (score, pass rate, s per case) and where it ranks.\nDo not edit other rows of results/benchmark.csv. Do not commit.\n```\n\nCloud model (new baseline run):\n\n```text\nRun a new cloud baseline for TokenFrugal with model <CLOUD_MODEL> at <BASE_URL>. My key is exported in env var <ENV_VAR_NAME>; never print or store it.\n1. `python Benchmark/script/run_benchmark.py <CLOUD_MODEL> --tag <SHORT_NAME> --endpoint <BASE_URL> --api-key-env <ENV_VAR_NAME>`.\n2. Move the new row from results/benchmark.csv into results/cloud.csv (same header). Keep the existing rows in cloud.csv unchanged.\n3. `python Benchmark/script/build_report.py` and report the new row. Do not commit.\n```\n\nOptional review prompt: see [script/README.md](script/README.md).\n",RES="\n_32 runs x 16 cases, generated from `results/benchmark.csv` and `results/cloud.csv` by `script/build_report.py`._\n\n### Ranking (best score first, ties by speed)\n\n- Score = verified checks passed out of total checks across 16 cases.\n- Pass rate % = Score / max.\n- Builder / Thinker = the same score split by role cases.\n- s per case = mean seconds per case.\n- Run time = wall clock for the whole run.\n- Valid cases = cases that finished without infrastructure failure (invalid cases are excluded from speed, not from score).\n- Date = when the run happened; newer = made with newer code.\n\n| # | Model | Date | Params | Score | Pass rate % | Builder | Thinker | s per case | Run time | Valid cases |\n|--:|---|---|---|--:|--:|--:|--:|--:|--:|--:|\n| 1 | `claude-haiku-5-5` | 2026-10-15 |  | 32/32 | 100 | 8/8 | 24/24 | 18.4 |  |  |\n| 2 | `hf.co/unsloth/Qwen3.5-9B-GGUF:IQ4_XS` | 2026-10-16 | 9B | 16/16 | 100 | 4/4 | 12/12 | 36.3 | 9:40 | 16 |\n| 3 | `hf.co/unsloth/Qwen3.5-4B-GGUF:Q6_K` | 2026-10-16 | 4B | 30/32 | 94 | 8/8 | 22/24 | 22.8 |  |  |\n| 4 | `hf.co/unsloth/Qwen3.5-9B-GGUF:IQ4_XS` | 2026-10-16 | 9B | 15/16 | 94 | 4/4 | 11/12 | 38.4 | 10:14 | 16 |\n| 5 | `hf.co/empero-ai/Qwable-9B-Claude-Fable-5-GGUF:Q4_K_M` | 2026-10-16 | 9B | 15/16 | 94 | 4/4 | 11/12 | 48.4 | 12:54 | 16 |\n| 6 | `gemma4:e4b` | 2026-10-16 | 4B | 28/32 | 88 | 8/8 | 20/24 | 19.5 |  |  |\n| 7 | `hf.co/empero-ai/Qwen3.8-9B-Distill-GGUF:Q4_K_M` | 2026-10-16 | 9B | 14/16 | 88 | 3/4 | 11/12 | 27.5 | 7:19 | 16 |\n| 8 | `hf.co/empero-ai/Qwen3.8-9B-Distill-GGUF:Q4_K_M` | 2026-10-16 | 9B | 14/16 | 88 | 3/4 | 11/12 | 28.2 | 7:32 | 16 |\n| 9 | `hf.co/bartowski/Mistral-Nemo-Instruct-2407-GGUF:Q4_K_M` | 2026-10-16 |  | 13/16 | 81 | 1/4 | 12/12 | 33.0 | 8:48 | 16 |\n| 10 | `llama3.2:3b-16k` | 2026-10-15 | 3B | 24/32 | 75 | 2/8 | 22/24 | 14.2 |  |  |\n| 11 | `qwen2.5-coder:7b` | 2026-10-16 | 7B | 24/32 | 75 | 6/8 | 18/24 | 18.2 |  |  |\n| 12 | `ministral-3:8b` | 2026-10-16 | 8B | 24/32 | 75 | 4/8 | 20/24 | 40.0 |  |  |\n| 13 | `hf.co/empero-ai/Qwable-9B-Claude-Fable-5-GGUF:Q4_K_M` | 2026-10-16 | 9B | 12/16 | 75 | 3/4 | 9/12 | 51.6 | 13:46 | 16 |\n| 14 | `hf.co/bartowski/Qwen2.5-Coder-32B-Instruct-GGUF:IQ4_XS` | 2026-10-16 | 32B | 12/16 | 75 | 3/4 | 9/12 | 66.2 | 17:39 | 16 |\n| 15 | `qwen2.5-coder:7b-instruct-q5_K_M` | 2026-10-16 | 7B | 23/32 | 72 | 5/8 | 18/24 | 17.3 |  |  |\n| 16 | `qwen2.5:7b` | 2026-10-16 | 7B | 22/32 | 69 | 4/8 | 18/24 | 16.4 |  |  |\n| 17 | `hf.co/bartowski/Mistral-Nemo-Instruct-2407-GGUF:Q4_K_M` | 2026-10-16 |  | 11/16 | 69 | 1/4 | 10/12 | 40.8 | 10:53 | 16 |\n| 18 | `granite4:micro` | 2026-10-15 |  | 21/32 | 66 | 3/8 | 18/24 | 14.4 |  |  |\n| 19 | `llama3.1:8b` | 2026-10-16 | 8B | 18/32 | 56 | 2/8 | 16/24 | 41.8 |  |  |\n| 20 | `qwen2.5-coder-yarn:3b` | 2026-10-15 | 3B | 17/32 | 53 | 4/8 | 13/24 | 18.0 |  |  |\n| 21 | `hf.co/empero-ai/Qwythos-9B-v2-GGUF:Q4_K_M` | 2026-10-16 | 9B | 17/32 | 53 | 5/8 | 12/24 | 86.4 |  |  |\n| 22 | `hf.co/bartowski/Mistral-Nemo-Instruct-2407-GGUF:Q4_K_M` | 2026-10-16 |  | 12/32 | 38 | 0/8 | 12/24 | 23.3 |  |  |\n| 23 | `qwen2.5:1.5b` | 2026-10-15 | 1.5B | 11/32 | 34 | 0/8 | 11/24 | 12.0 |  |  |\n| 24 | `llama3.2:1b` | 2026-10-15 | 1B | 8/32 | 25 | 0/8 | 8/24 | 20.2 |  |  |\n| 25 | `granite3.3:2b` | 2026-10-15 | 2B | 7/32 | 22 | 0/8 | 7/24 | 15.2 |  |  |\n| 26 | `phi4-mini:latest` | 2026-10-15 |  | 2/32 | 6 | 0/8 | 2/24 | 23.2 |  |  |\n| 27 | `gemma3:4b` | 2026-10-15 | 4B | 0/32 | 0 | 0/8 | 0/24 | 9.5 |  |  |\n| 28 | `starcoder2:7b` | 2026-10-16 | 7B | 0/32 | 0 | 0/8 | 0/24 | 9.6 |  |  |\n| 29 | `hf.co/bartowski/google_gemma-3-12b-it-GGUF:Q4_K_M` | 2026-10-16 | 12B | 0/16 | 0 | 0/4 | 0/12 | 10.4 | 2:47 | 16 |\n| 30 | `glm4:9b-chat-q5_K_M` | 2026-10-16 | 9B | 0/16 | 0 | 0/4 | 0/12 | 20.5 | 5:28 | 16 |\n| 31 | `hf.co/lmstudio-community/DeepSeek-R1-Distill-Qwen-7B-GGUF:latest` | 2026-10-16 |  | 0/32 | 0 | 0/8 | 0/24 | 65.7 |  |  |\n| 32 | `granite3.3:8b` | 2026-10-16 | 8B | 0/32 | 0 | 0/8 | 0/24 | 97.9 |  |  |\n\n### Best model per role (local models, top 5 each)\n\nEach role is ranked only on its own cases, because one model is pinned to both roles in a run. Only a model's newest-dated runs count, so older results from earlier code never mix with current ones; the `Code (git)` column shows the commit that
