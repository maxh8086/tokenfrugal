# Use with a second -f, for example:
#   docker compose -p tokenfrugal-gpu -f docker-compose.gpu.yml -f docker-compose.gpu.cpu.yml up -d --wait
# The tab never uses this file. Timings taken in CPU mode are not recorded. Needs Compose 2.24.4+ for !reset.
services:
  comfyui:
    deploy: !reset {}
